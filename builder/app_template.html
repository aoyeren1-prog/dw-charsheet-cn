// kind 即目标区域的 areaKey。能导入的唯一条件：该区域存在且是动作区
function importTarget(kind){
  const area = kind && AREAS[kind];
  return (area && area.type === "moveList") ? area : null;
}
// 登记可导入条目并返回卡片 HTML（idx 与 lastSearchItems 一一对应，-1 表示只展示）
function refCard(item){
  const idx = importTarget(item.kind) ? lastSearchItems.push(item) - 1 : -1;
  const src = item.source ? `<span class="src">${esc(item.source)}</span>` : "";
  const btn = (idx >= 0 && mode === "edit")
    ? `<div class="rmv-foot"><button class="rmv-b" data-imp="${idx}">＋ 导入</button></div>` : "";
  return `<details class="rmv"><summary>${esc(item.name || "")}${src}</summary><div class="rmv-t">${markdownToHtml(item.html)}</div>${btn}</details>`;
}
// 资料区段里的动作：不折叠，用角色卡那套普通动作卡 .mv
function refMoveCard(item){
  const idx = importTarget(item.kind) ? lastSearchItems.push(item) - 1 : -1;
  const btn = (idx >= 0 && mode === "edit") ? `<button class="mv-imp" data-imp="${idx}">＋ 导入</button>` : "";
  return `<div class="mv"><div class="mv-h"><div class="mv-n">${esc(item.name || "")}</div>${btn}</div><div class="mv-t">${markdownToHtml(item.html)}</div></div>`;
}
function tagItemHtml(tag){
  const desc = tag.description ? ` ${inlineMarkdown(tag.description)}` : '';
  return `<div class="tag-item">${inlineMarkdown(`{${tag.name}}`)}${desc}</div>`;
}
function renderRefSearch(kw){
  return `<input class="ref-search" id="refSearch" placeholder="搜索动作、${esc(getClassLabel())}、分组、法术…" value="${esc(kw||"")}"><div id="refSearchResults">${searchResultsHtml(kw||"")}</div>`;
}
// 取某职业某区域合并后的配置（不依赖角色状态）
function areaFor(cls, areaKey){
  return getAreaHeader(areaKey, cls);
}
// 列出所有 moveList 区域的 key
function moveListAreaKeys(cls){
  return Object.keys(AREAS).filter(k => { const a = areaFor(cls, k); return a && a.type === "moveList"; });
}
// 所有 moveList 区域里的分组 → {label, key, areaKey}
// key 要一起带出来：条目上存的 group 是 key，而匹配用的是 label，两者常常不等
function collectGroupLabels(){
  const out = [];
  const seen = new Set();
  (DW_DATA.classes||[]).forEach(c => {
    moveListAreaKeys(c).forEach(areaKey => {
      const a = areaFor(c, areaKey);
      (a.groups || []).forEach(g => {
        if(!g.label) return;
        const k = areaKey + "::" + g.key + "::" + g.label;
        if(seen.has(k)) return;
        seen.add(k);
        out.push({label:g.label, key:g.key, areaKey});
      });
    });
  });
  return out;
}
function classMovesFlat(c){
  const items = [];
  moveListAreaKeys(c).forEach(areaKey => {
    const a = areaFor(c, areaKey);
    (a.groups || []).forEach(g => (g.moves || []).forEach(m => items.push({kind:areaKey, name:m.name, html:m.text, source:c.name, group:g.key, classId:c.id})));
    (a.moves || []).forEach(m => items.push({kind:areaKey, name:m.name, html:m.text, source:c.name, classId:c.id}));
  });
  return items;
}
// 一个 refSection 里的全部可搜条目：组条目 + 文章块（含纯文本块）
// 不区分能否导入，能导入的由 refCard 自己长出按钮
function sectionSearchItems(sec){
  if(sec.type !== 'moves') return [];
  
  const data = refSectionData(sec.id);
  const items = [];
  
  const addMove = (m, context) => {
    if(typeof m === "string") return;  // 跳过纯文本
    items.push({
      kind: m.importArea || context.importArea || sec.importArea || null,
      name: m.name,
      html: m.text,
      source: sec.title,
      group: m.importGroup || context.importGroup || sec.importGroup || null
    });
  };
  
  // 顶层 moves
  (data.moves || []).forEach(m => addMove(m, sec));
  
  // groups
  for(const g of (data.groups || [])){
    (g.moves || []).forEach(m => addMove(m, g));
  }
  
  return items;
}

// 可搜范围 = 职业动作 + 所有 refSection 的内容。标签另有形态，见 searchResultsHtml
function collectSearchable(){
  const items = [];
  (DW_DATA.classes||[]).forEach(c => items.push(...classMovesFlat(c)));
  REF_SECTIONS.forEach(sec => items.push(...sectionSearchItems(sec)));
  return items;
}
function searchResultsHtml(kw){
  kw = (kw||"").trim();
  lastSearchItems = [];
  if(!kw) return `<div class="ref-empty">输入关键词，可搜动作名/正文、${esc(getClassLabel())}名、分组名、法术。</div>`;
  const parts = [];
  // 1. 职业
  const classMatches = (DW_DATA.classes||[]).filter(c => c.name.includes(kw));
  classMatches.forEach(c => {
    const intro = c.intro ? `<div class="ref-intro">${markdownToHtml(c.intro)}</div>` : "";
    const cards = classMovesFlat(c).map(refCard).join("");
    parts.push(`<div class="ref-sec">${esc(getClassLabel())}：${esc(c.name)}</div>${intro}${cards}`);
  });
  // 2. 分组名（种族 / 背景 / 法术环位等）
  const searchable = collectSearchable();
  const matchedGroups = collectGroupLabels().filter(g => g.label.includes(kw));
  // 条目上存的 group 是 key，所以按「区域::key」匹配，不能拿 label 比
  const matchedGroupKeys = new Set(matchedGroups.map(g => g.areaKey + "::" + g.key));
  const inMatchedGroup = it => !!it.group && matchedGroupKeys.has(it.kind + "::" + it.group);
  if(matchedGroups.length){
    // 按区域归类展示
    const byArea = {};
    matchedGroups.forEach(g => { (byArea[g.areaKey] = byArea[g.areaKey] || []).push(g.label); });
    for(const areaKey of Object.keys(byArea)){
      const items = searchable.filter(it => it.kind === areaKey && inMatchedGroup(it));
      if(!items.length) continue;
      const cards = items.map(refCard).join("");
      const title = (AREAS[areaKey] && AREAS[areaKey].title) || areaKey;
      parts.push(`<div class="ref-sec">${esc(title)}：${esc(byArea[areaKey].join("、"))}</div>${cards}`);
    }
  }
  // 2b. reference 中 group title 的搜索
  const ref = DW_DATA.reference || {};
  for(const sectionId of Object.keys(ref)){
    const sec = REF_SECTIONS.find(s => s.id === sectionId);
    if(!sec || sec.type !== 'moves') continue;
    
    const data = ref[sectionId];
    
    // 搜索 group title
    (data.groups || []).forEach(g => {
      if(g.title && g.title.includes(kw)){
        const groupMoves = [];
        (g.moves || []).forEach(m => { 
          if(typeof m === "object") groupMoves.push(createMoveItem(m, g, sec)); 
        });
        if(groupMoves.length){
          parts.push(`<div class="ref-sec">${esc(sec.title)}：${esc(g.title)}</div>${groupMoves.map(refCard).join("")}`);
        }
      }
    });
  }
  // 3. 标签
  const tagMatches = [];
  for(const sectionId of Object.keys(ref)){
    const data = ref[sectionId];
    const sec = REF_SECTIONS.find(s => s.id === sectionId);
    if(!sec || sec.type !== 'tags') continue;
    
    // 顶层 tags
    (data.tags || []).forEach(tag => {
      if(tag.name.includes(kw) || (tag.description && tag.description.includes(kw))){
        tagMatches.push(tag);
      }
    });
    // groups 内的 tags
    (data.groups || []).forEach(g => {
      (g.tags || []).forEach(tag => {
        if(tag.name.includes(kw) || (tag.description && tag.description.includes(kw))){
          tagMatches.push(tag);
        }
      });
    });
  }
  if(tagMatches.length){
    parts.push('<div class="ref-sec">标签</div>' + tagMatches.map(tagItemHtml).join(""));
  }
  // 4. 关键词 (去重)
  const matchedClassIds = new Set(classMatches.map(c=>c.id));
  const kwItems = searchable.filter(it => {
    if(!((it.name||"").includes(kw) || stripTags(it.html).includes(kw))) return false;
    if(it.classId && matchedClassIds.has(it.classId)) return false;
    if(inMatchedGroup(it)) return false;
    return true;
  });
  if(kwItems.length){
    const cards = kwItems.map(refCard).join("");
    parts.push(`<div class="ref-sec">关键词匹配</div>${cards}`);
  }
  if(!parts.length) return `<div class="ref-empty">没有找到匹配「${esc(kw)}」的内容。</div>`;
  return parts.join("");
}
function importSearchItem(idx){
  const item = lastSearchItems[idx];
  if(!item) return;
  const cls = getClass(char.classId);
  const areaKey = item.kind;
  const area = cls ? areaFor(cls, areaKey) : null;

  if(!area || area.type !== "moveList"){
    // 导入目标不存在或不是动作区，与其静默失败不如说清楚
    alert(areaKey ? `当前规则里没有可接收的「${areaKey}」动作区域。` : "该条目没有声明导入目标。");
    return;
  }
  // boundMove 未取得时该区域整个不渲染，导进去会看不见，所以挡在这里
  // （勾选动作只触发 renderPlaybook，边栏按钮来不及更新，只能在导入时判）
  if(!boundMoveTaken(area)){
    const need = area.boundMove;
    const title = (AREAS[areaKey] && AREAS[areaKey].title) || areaKey;
    alert(`「${title}」要先取得「${need}」才会出现，现在导入会看不到。`);
    return;
  }
  // 目标 group：沿用来源 group，本职业没有该 group 时自动建一个
  const groupKey = ensureMoveListGroup(areaKey, item.group || null);
  moveListCustomMoves(areaKey).push({id:uid(), name:item.name, text:item.html, group:groupKey || null});
  renderPlaybook(); save();
}

// 动作卡左侧色条：由区域在数据里声明 color，未声明则不显示
function mvBarStyle(areaKey){
  const c = AREAS[areaKey] && AREAS[areaKey].color;
  return c ? ` style="--bar:${esc(c)}"` : "";
}
function autosize(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }
function autosizeAll(){ document.querySelectorAll("textarea").forEach(autosize); }
function autosizeBlank(inp){
  const sizer = inp.parentNode.querySelector(".blank-sizer");
  if(!sizer) return;
  sizer.textContent = inp.value || inp.placeholder || "＿";
  inp.style.width = (sizer.offsetWidth + 2) + "px";
}
function autosizeBlanks(){ document.querySelectorAll("input.blank").forEach(autosizeBlank); }

/* ============ 事件 ============ */
function onClassChange(){
  const newId=document.getElementById("classSelect").value;
  if(newId!==char.classId){
    const prevHeader = headerFor(getClass(char.classId));
    char.classId=newId;
    char.moveListSelections={}; char.moveListGroupNames={}; char.moveListNames={}; char.moveListTexts={};
    // 内容来自职业的区域换职业时清空：plain 区一律清空，其余按 resetOnClassChange
    const cls=getClass(newId);
    Object.keys(char.areaData||{}).forEach(k => {
      const a = cls ? getAreaHeader(k, cls) : {};
      if(a.type === "plain" || a.resetOnClassChange) delete char.areaData[k];
    });
    // metrics 与区域 rightStat 都是逐职业的数值，换职业一律丢掉重算；
    // charInfo（姓名/等级/XP）属于角色本身，保留
    prevHeader.metrics.fields.forEach(f => { delete char.fields[f.id]; });
    rightStatKeys().forEach(k => { delete char.fields[k]; });
  }
  const cls=getClass(char.classId);
  if(!cls){ renderPlaybook(); return; }
  // 回填：有公式的按公式算，否则取声明的 default
  headerFor(cls).metrics.fields.forEach(f => {
    if(char.fields[f.id]) return;
    const v = defaultFieldValue(f);
    if(v !== "" && v !== 0) char.fields[f.id] = v;
  });
  renderPlaybook(); save();
}
// 所有区域里声明过的 rightStat key
function rightStatKeys(){
  const out = [];
  const cls = getClass(char.classId);
  Object.keys(AREAS).forEach(areaKey => {
    (getAreaHeader(areaKey, cls).rightStats || []).forEach(s => {
      if(s.key && !out.includes(s.key)) out.push(s.key);
    });
  });
  return out;
}

document.addEventListener("input", e=>{
  const t=e.target, d=t.dataset||{};
  if(t.id==="refSearch"){ searchKw=t.value; const r=document.getElementById("refSearchResults"); if(r) r.innerHTML=searchResultsHtml(searchKw); return; }
  // 页首字段与属性共用一个分支：field: 写 char.fields，stat: 写 char.stats
  if(d.field!==undefined){
    const i = d.field.indexOf(":");
    const scope = d.field.slice(0, i), key = d.field.slice(i + 1);
    if(scope === "stat"){
      char.stats[key] = parseInt(t.value)||0;
    } else {
      char.fields[key] = t.type === "number" ? (parseInt(t.value)||0) : t.value;
    }
    // 属性与页首数值都可能被调整值或公式引用，就地刷新显示
    refreshMods();
    save(); return;
  }
  if(d.area!==undefined){
    const parts = d.area.split(":");
    const op = parts[0], areaKey = parts[1];
    // 计数器 key 可能含冒号，整段取回
    const i = op === "cnt" ? parts.slice(2).join(":") : parts[2];
    const data = char.areaData && char.areaData[areaKey];
    if(!data) return;
    const num = () => parseInt(t.value)||0;
    if(op === "text"){ data.text = t.value; autosize(t); }
    else if(op === "cnt"){ data.counters[i] = num(); }
    else if(op === "xname"){ data.extra[+i].name = t.value; }
    else if(op === "xval"){ data.extra[+i].value = num(); }
    else if(op === "bond"){ data.lines[+i] = t.value; }
    else if(op === "rtarget"){ data.relations[+i].target = t.value; }
    else if(op === "rdesc"){ data.relations[+i].description = t.value; }
    else if(op === "hmove"){ data.moves[+i] = t.value; }
    else return;
    save(); return;
  }

  // moveList input 事件
  if(d.movelistName!==undefined){
    const [areaKey, id] = d.movelistName.split(":");
    updateMoveListField(areaKey, id, "name", t.value);
    save(); return;
  }
  if(d.movelistText!==undefined){
    const [areaKey, id] = d.movelistText.split(":");
    updateMoveListField(areaKey, id, "text", t.value);
    autosize(t); save(); return;
  }
  if(d.movelistGroupName!==undefined){
    const [areaKey, groupKey] = d.movelistGroupName.split(":");
    updateMoveListGroupName(areaKey, groupKey, t.value);
    save(); return;
  }
  
  if(d.plain && d.plain.startsWith("input:")){
    const [, areaKey, key] = d.plain.split(":");
    plainSet(areaKey, key, t.value);
    save(); return;
  }
  if(d.plain && d.plain.startsWith("blank:")){
    const [, areaKey, key] = d.plain.split(":");
    plainSet(areaKey, key, t.value);
    autosizeBlank(t);
    save(); return;
  }
});

document.addEventListener("change", e=>{
  const t=e.target, d=t.dataset||{};
  if(t.id==="classSelect"){ onClassChange(); return; }
  // charInfo 的数值字段可能被公式或 minLevel 依赖，改完整表重渲染
  if(d.field !== undefined && d.field.startsWith("field:") && t.type === "number"){
    const key = d.field.slice(6);
    if(headerFor(getClass(char.classId)).charInfo.some(f => f.id === key)){
      renderPlaybook(); return;
    }
  }
  if(d.plain && d.plain.startsWith("choice:")){
    const [, areaKey, key] = d.plain.split(":");
    let arr = plainGet(areaKey, key, []);
    if(t.checked){ if(!arr.includes(t.value)) arr.push(t.value); }
    else { arr = arr.filter(x => x !== t.value); }
    plainSet(areaKey, key, arr);
    save(); return;
  }

  if(d.area!==undefined){
    const [op, areaKey, i] = d.area.split(":");
    const data = char.areaData && char.areaData[areaKey];
    if(!data) return;
    if(op === "hbox"){ data.boxes[+i] = t.checked; renderPlaybook(); save(); return; }
    if(op === "hup"){ data.upgraded = t.checked; renderPlaybook(); save(); return; }
    return;
  }

  // moveList toggle 事件
  if(d.movelistToggle!==undefined){
    const i = d.movelistToggle.indexOf(":");
    toggleMoveListMove(d.movelistToggle.slice(0, i), d.movelistToggle.slice(i + 1), t.checked);
    return;
  }
  if(d.movelistGroup!==undefined){
    const [areaKey, groupKey] = d.movelistGroup.split(":");
    toggleMoveListGroup(areaKey, groupKey, t.checked);
    return;
  }
  
  if(d.movebox!==undefined){
    const key=d.movebox, idx=parseInt(d.box)||0;
    const ref=boxReg[key];
    if(ref){
      ref.set(toggleTextBox(ref.get(), idx));
      renderPlaybook(); save();
    }
    return;
  }
});

// 数字框的步进箭头。dir 为 +1 / -1，声明了 min/max 就夹住。
// 从当前显示值起步：metrics 字段值为空时显示的是公式算出的默认值，
// 不从那个值开始加减会跳回 0。
function stepField(spec){
  const i = spec.indexOf(":"), j = spec.lastIndexOf(":");
  const scope = spec.slice(0, i);
  const key = spec.slice(i + 1, j);
  const dir = parseInt(spec.slice(j + 1), 10) || 0;
  const header = headerFor(getClass(char.classId));

  let def, cur;
  if(scope === "stat"){
    def = header.stats.items.find(s => s.id === key);
    cur = statValue(key, header) || 0;
  } else {
    def = header.charInfo.concat(header.metrics.fields).find(f => f.id === key);
    cur = shownFieldValue(def, key);
  }
  if(!def) return;

  let next = (parseInt(cur, 10) || 0) + dir;
  if(def.min !== undefined) next = Math.max(parseInt(def.min, 10), next);
  if(def.max !== undefined) next = Math.min(parseInt(def.max, 10), next);

  if(scope === "stat") char.stats[key] = next;
  else char.fields[key] = next;
  renderPlaybook(); save();
}
// 字段当前显示的值：空值回退到公式或 default 算出的默认值
function shownFieldValue(def, key){
  const raw = char.fields[key];
  if(raw !== undefined && raw !== "" && raw !== 0) return raw;
  return def ? defaultFieldValue(def) : 0;
}

// select 字段的下拉弹层
function closeSelectMenus(except){
  document.querySelectorAll(".sel-menu").forEach(m => {
    if(m !== except) m.classList.add("hidden");
  });
}
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeSelectMenus();
});

document.addEventListener("click", e=>{
  const t=e.target, d=t.dataset||{};
  // 点到弹层外面就收起来（点 caret 或选项时在 .sel-wrap 内，不受影响）
  if(!t.closest(".sel-wrap")) closeSelectMenus();
  if(d.fieldMenu!==undefined){
    const menu = t.parentNode.querySelector(".sel-menu");
    if(menu){
      const willOpen = menu.classList.contains("hidden");
      closeSelectMenus(menu);
      menu.classList.toggle("hidden", !willOpen);
    }
    return;
  }
  if(d.fieldPick!==undefined){
    char.fields[d.fieldPick] = d.val;
    renderPlaybook(); save(); return;
  }
  if(d.fieldStep!==undefined){ stepField(d.fieldStep); return; }
  if(d.setformula!==undefined){ applyFormula(d.setformula); return; }
  if(d.ruleDel!==undefined){ removeRule(+d.ruleDel); return; }
  if(d.ruleReload!==undefined){ reloadRule(+d.ruleReload); return; }
  if(t.closest("[data-ref-tab]")){ refTab=t.closest("[data-ref-tab]").dataset.refTab; renderRef(); save(); return; }
  if(d.imp!==undefined){ importSearchItem(+d.imp); return; }
  // 状态按钮：点一次进下一档，到顶回 0
  if(d.state!==undefined){
    const cond = headerFor(getClass(char.classId)).stats.conditions.find(c => c.id === d.state);
    if(!cond) return;
    const cur = char.states[d.state] || 0;
    char.states[d.state] = (cur + 1) % stateCount(cond);
    renderPlaybook(); save(); return;
  }
  // charInfo 的轨道字段：点第 k 格即设为 k 或 k+1
  if(d.fieldTrack!==undefined){
    const i = d.fieldTrack.lastIndexOf(":");
    const key = d.fieldTrack.slice(0, i);
    const k = parseInt(d.fieldTrack.slice(i + 1), 10);
    const cur = char.fields[key] || 0;
    char.fields[key] = (k < cur) ? k : (k + 1);
    renderPlaybook(); save(); return;
  }
  if(d.plain && d.plain.startsWith("track:")){
    const parts = d.plain.split(":");
    const areaKey = parts[1], key = parts[2];
    const gi = parseInt(parts[3], 10), zeroIndex = parseInt(parts[4], 10);
    const dual = parts[5] === "1";
    const raw = plainGet(areaKey, key, 0);
    const d0 = gi - zeroIndex;
    if(dual){
      const obj = (raw && typeof raw === 'object') ? raw : {};
      let left = obj.left || 0, right = obj.right || 0;
      if(d0 >= 0){ const t = d0 + 1; right = (right >= t) ? t - 1 : t; }
      else { const t = -d0; left = (left >= t) ? t - 1 : t; }
      plainSet(areaKey, key, {left, right});
    } else {
      const cur = typeof raw === 'number' ? raw : 0;
      const nv = d0 >= 0 ? (d0 < cur ? d0 : d0 + 1) : (d0 >= cur ? d0 + 1 : d0);
      plainSet(areaKey, key, nv);
    }
    renderPlaybook(); save(); return;
  }
  if(d.area!==undefined){
    const parts = d.area.split(":");
    const op = parts[0], areaKey = parts[1], j = parts[3];
    // 选项文本可能含冒号，整段取回
    const i = op === "opt" ? parts.slice(2).join(":") : parts[2];
    const data = char.areaData && char.areaData[areaKey];
    if(!data) return;
    if(op === "opt"){ data.text = (data.text ? data.text + "\n" : "") + i; }
    else if(op === "xadd"){ (data.extra = data.extra || []).push({name:"", value:0}); }
    else if(op === "xdel"){ data.extra.splice(+i, 1); }
    else if(op === "badd"){ data.lines.push(""); }
    else if(op === "bdel"){ data.lines.splice(+i, 1); }
    else if(op === "radd"){ data.relations.push({target:"", description:"", depth:0}); }
    else if(op === "rdel"){ data.relations.splice(+i, 1); }
    else if(op === "rdepth"){ const r = data.relations[+i]; const k = +j; r.depth = (k < (r.depth||0)) ? k : (k+1); }
    else if(op === "hide"){ data.hidden = !data.hidden; }
    else return;
    renderPlaybook(); save(); return;
  }

  // moveList 事件处理
  if(d.movelistAction!==undefined){
    const [areaKey, action, targetGroup] = d.movelistAction.split(":");
    if(action === "addMove"){
      addMoveToMoveList(areaKey, targetGroup || null);
    } else if(action === "addGroup"){
      addGroupToMoveList(areaKey);
    }
    renderPlaybook(); save(); return;
  }
  if(d.movelistDel!==undefined){
    deleteMoveFromMoveList(d.movelistDel);
    renderPlaybook(); save(); return;
  }
  if(d.movelistGroupDel!==undefined){
    const [areaKey, groupKey] = d.movelistGroupDel.split(":");
    deleteGroupFromMoveList(areaKey, groupKey);
    renderPlaybook(); save(); return;
  }
});

// moveList 操作函数
function customGroupStore(areaKey){
  if(!customData.moveListGroups) customData.moveListGroups = {};
  if(!customData.moveListGroups[char.classId]) customData.moveListGroups[char.classId] = {};
  if(!customData.moveListGroups[char.classId][areaKey]) customData.moveListGroups[char.classId][areaKey] = [];
  return customData.moveListGroups[char.classId][areaKey];
}

// 确保 targetGroup 存在：模板里没有、自定义里也没有时，就建一个同 key 的分组
function ensureMoveListGroup(areaKey, groupKey, label){
  if(!groupKey) return null;
  const cls = getClass(char.classId);
  const area = cls ? getAreaHeader(areaKey, cls) : null;
  const inTemplate = ((area && area.groups) || []).some(g => g.key === groupKey);
  if(inTemplate) return groupKey;
  const store = customGroupStore(areaKey);
  if(!store.some(g => g.key === groupKey)) store.push({key:groupKey, label:(label !== undefined ? label : groupKey), moves:[]});
  return groupKey;
}

function addMoveToMoveList(areaKey, targetGroup){
  const groupKey = ensureMoveListGroup(areaKey, targetGroup);
  moveListCustomMoves(areaKey).push({id:uid(), name:"", text:"", group:groupKey || null});
}

function addGroupToMoveList(areaKey){
  customGroupStore(areaKey).push({key:uid(), label:"", moves:[]});
}

function deleteMoveFromMoveList(key){
  const [areaKey, id] = key.split(":");
  const custom = moveListCustomMoves(areaKey);
  const i = custom.findIndex(m => m.id === id);
  if(i === -1) return;
  // 连带清掉它的勾选
  const sel = moveListSelections(areaKey);
  const si = sel.indexOf(moveSelKey(custom[i]));
  if(si !== -1) sel.splice(si, 1);
  custom.splice(i, 1);
}

function deleteGroupFromMoveList(areaKey, groupKey){
  if(!customData.moveListGroups || !customData.moveListGroups[char.classId]) return;
  const groups = customData.moveListGroups[char.classId][areaKey];
  if(!groups) return;
  const i = groups.findIndex(g => g.key === groupKey);
  if(i === -1) return;
  // 连带删掉该分组下的自定义动作，并清理勾选与分组名
  const custom = moveListCustomMoves(areaKey);
  const sel = moveListSelections(areaKey);
  for(let j = custom.length - 1; j >= 0; j--){
    if(custom[j].group !== groupKey) continue;
    const si = sel.indexOf(moveSelKey(custom[j]));
    if(si !== -1) sel.splice(si, 1);
    custom.splice(j, 1);
  }
  (groups[i].moves || []).forEach(m => {
    const si = sel.indexOf(moveSelKey(m));
    if(si !== -1) sel.splice(si, 1);
  });
  groups.splice(i, 1);
  const gi = sel.indexOf(groupKey);
  if(gi !== -1) sel.splice(gi, 1);
  if(char.moveListGroupNames) delete char.moveListGroupNames[`${areaKey}::${groupKey}`];
}

// 获取区域的自定义 groups
function moveListCustomGroups(areaKey){
  if(!customData.moveListGroups) return [];
  if(!customData.moveListGroups[char.classId]) return [];
  return customData.moveListGroups[char.classId][areaKey] || [];
}

function toggleMoveListMove(areaKey, selKey, checked){
  const sel = moveListSelections(areaKey);
  const all = collectMovesInArea(areaKey);
  const move = all.find(m => moveSelKey(m) === selKey);
  if(checked){
    if(!sel.includes(selKey)) sel.push(selKey);
    // 处理 replaces：勾选时移除被替代的动作（按名字找出对应的勾选键）
    if(move) repList(move).forEach(r => {
      all.filter(m => m.name === r).forEach(m => {
        const i = sel.indexOf(moveSelKey(m));
        if(i !== -1) sel.splice(i, 1);
      });
    });
  } else {
    const i = sel.indexOf(selKey);
    if(i !== -1) sel.splice(i, 1);
    // 处理 requires：取消时移除依赖它的动作（requires 按动作名引用）
    const name = move ? move.name : selKey;
    for(let j = sel.length - 1; j >= 0; j--){
      const dep = all.find(m => moveSelKey(m) === sel[j]);
      if(dep && reqList(dep).includes(name)) sel.splice(j, 1);
    }
  }
  renderPlaybook(); save();
}

function toggleMoveListGroup(areaKey, groupKey, checked){
  const sel = moveListSelections(areaKey);
  if(checked){
    if(!sel.includes(groupKey)) sel.push(groupKey);
  } else {
    const i = sel.indexOf(groupKey);
    if(i !== -1) sel.splice(i, 1);
  }
  renderPlaybook(); save();
}

// 编辑动作的名称/正文：自定义动作直接改自身，内置动作写入角色数据的覆盖表
// 自定义动作的勾选以 id 为键，改名不影响勾选
function updateMoveListField(areaKey, idOrName, field, value){
  const mv = moveListCustomMoves(areaKey).find(m => m.id === idOrName);
  if(mv){ mv[field] = value; return; }
  const store = field === "name" ? "moveListNames" : "moveListTexts";
  if(!char[store]) char[store] = {};
  char[store][`${areaKey}::${idOrName}`] = value;
}

function updateMoveListGroupName(areaKey, groupKey, value){
  if(!char.moveListGroupNames) char.moveListGroupNames = {};
  char.moveListGroupNames[`${areaKey}::${groupKey}`] = value;
}


function collectMovesInArea(areaKey){
  const cls = getClass(char.classId);
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "moveList") return [];
  let all = [];
  (area.groups || []).forEach(g => { all = all.concat(g.moves || []); });
  all = all.concat(area.moves || []);
  all = all.concat(moveListCustomMoves(areaKey));
  return all;
}

// 自定义动作统一存储在 customData.moveListMoves[classId][areaKey]
function moveListCustomMoves(areaKey){
  if(!customData.moveListMoves) customData.moveListMoves = {};
  if(!customData.moveListMoves[char.classId]) customData.moveListMoves[char.classId] = {};
  if(!customData.moveListMoves[char.classId][areaKey]) customData.moveListMoves[char.classId][areaKey] = [];
  return customData.moveListMoves[char.classId][areaKey];
}

// 导出文件名里的角色名：取 charInfo 第一个有值的文本字段
function charDisplayName(){
  const f = headerFor(getClass(char.classId)).charInfo
    .find(f => (f.type || "text") === "text" && char.fields[f.id]);
  return f ? String(char.fields[f.id]) : "";
}
function exportJSON(){
  const payload={kind:"dw-card-export",version:5,character:char,custom:customData,exportedAt:new Date().toISOString()};
  const text=JSON.stringify(payload,null,2);
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(charDisplayName()||"角色")+"-角色卡.json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result||"");
    let data=null;
    try{ data=JSON.parse(text); }
    catch(err){
      const m=text.match(/window\.DW_CARD\s*=\s*([\s\S]*);\s*$/);
      if(m){ try{ data=JSON.parse(m[1]); }catch(e2){} }
    }
    if(!data){ alert("无法识别的文件：应为 JSON（兼容旧的 window.DW_CARD 格式）。"); return; }
    if(data.kind==="dw-card-export"){
      if(data.character && !usableChar(data.character)){
        alert("这张角色卡是旧版格式（扁平字段），当前版本不再支持，请重新车卡。");
        return;
      }
      if(data.character) char=Object.assign(defaultChar(),data.character);
      if(data.custom) customData=data.custom;
      normalizeChar();
      alert("已导入角色与自定义数据。");
    } else if(data.classes||data.moveListMoves||data.moveListGroups){
      customData={classes:(data.classes||[]).concat(customData.classes||[]),
        moveListMoves:Object.assign(customData.moveListMoves||{},data.moveListMoves||{}),
        moveListGroups:Object.assign(customData.moveListGroups||{},data.moveListGroups||{})};
      alert("已导入自定义数据。");
    } else { alert("无法识别的数据。"); }
    normalizeCustomData();
    renderClassSelect(); renderPlaybook(); save();
  };
  reader.readAsText(f);
  e.target.value="";
}

function effectiveRules(){
  return ruleStack.reduce((acc, layer) => deepMerge(acc, layer.data), {});
}
// char 的字段集取决于 header，所以必须在 applyData 之后才能建。
// 规则换了之后也要再补一次：新规则可能声明了旧存档里没有的字段。
function ensureChar(){
  if(!char) char = defaultChar();
  else normalizeChar();
}
function applyEffective(){
  applyData(effectiveRules());
  ensureChar();
  if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
    renderNoRules();
    save();
    return;
  }
  renderClassSelect(); renderPlaybook(); renderRef(); save();
}
function checkAffected(after){
  const items = [];
  const cls = (after.classes||[]).find(c=>c.id===char.classId);
  if(!cls){
    if(char.classId) items.push(`· 当前${getClassLabel()}「${char.classId}」`);
    return items;
  }
  // 逐个 moveList 区域比对：移除后规则 + 自定义数据里是否还存在该条目
  const areas = (after.meta && after.meta.areas) || {};
  for(const areaKey of Object.keys(char.moveListSelections || {})){
    const sel = char.moveListSelections[areaKey] || [];
    if(!sel.length) continue;
    const base = areas[areaKey];
    const override = (cls.areas && cls.areas[areaKey]) || {};
    const area = deepMerge(base, override);
    const title = area.title || areaKey;
    const label = n => (char.moveListGroupNames && char.moveListGroupNames[`${areaKey}::${n}`]) || n;

    if(!area || area.type !== "moveList"){
      sel.forEach(n => items.push("· "+title+"「"+label(n)+"」"));
      continue;
    }
    // 有效的勾选键：分组用 key，动作用 moveSelKey
    const keys = [];
    (area.groups||[]).forEach(g => { keys.push(g.key); (g.moves||[]).forEach(m => keys.push(moveSelKey(m))); });
    (area.moves||[]).forEach(m => keys.push(moveSelKey(m)));
    moveListCustomGroups(areaKey).forEach(g => keys.push(g.key));
    moveListCustomMoves(areaKey).forEach(m => keys.push(moveSelKey(m)));
    sel.forEach(n => { if(!keys.includes(n)) items.push("· "+title+"「"+label(n)+"」"); });
  }
  return items;
}
function confirmRuleChange(actionName, layerName, newStack){
  const after = newStack.reduce((acc, l) => deepMerge(acc, l.data), {});
  const affected = checkAffected(after);
  let msg = "确定" + actionName + "「" + layerName + "」？";
  if(affected.length) msg = "检测到" + actionName + "后你角色卡里的以下条目可能受影响：\n\n" + affected.join("\n") + "\n\n确定" + actionName + "？";
  return confirm(msg);
}
function removeRule(index){
  const layer = ruleStack[index];
  if(!layer) return;
  const afterStack = ruleStack.filter((_,i)=>i!==index);
  if(!confirmRuleChange("移除", layer.name, afterStack)) return;
  ruleStack = afterStack;
  saveRules();
  applyEffective();
  renderRulesPanel();
}
function reloadRule(index){
  const layer = ruleStack[index];
  if(!layer) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const newData = JSON.parse(String(reader.result||""));
        const tempStack = ruleStack.map((l, i) => i === index ? {name: f.name, data: newData} : l);
        if(!confirmRuleChange("重载", layer.name, tempStack)) return;
        ruleStack[index] = {name: f.name, data: newData};
        saveRules();
        applyEffective();
        renderRulesPanel();
      }catch(err){ alert("规则 JSON 解析失败："+err.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}
function clearRules(){
  if(ruleStack.length && !confirm("确定清空整个规则栈（移除全部 "+ruleStack.length+" 层）？")) return;
  ruleStack = [];
  saveRules();
  lsSet("dw-rules", "");   // 同时清掉旧版的单份规则键，避免残留
  applyData(null);
  renderNoRules();
  save();
}
function importRules(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||""));
      if(ruleStack.length === 0 && (!data || !data.classes || !data.classes.length)){
        alert("第一份导入的规则（底层）应包含 classes 数组。"); return;
      }
      ruleStack.push({name: f.name, data});
      saveRules();
      applyEffective();
      renderRulesPanel();
    }catch(err){ alert("规则 JSON 解析失败："+err.message); }
  };
  reader.readAsText(f);
  e.target.value="";
}

function renderRulesPanel(){
  const list = document.getElementById("rulesList");
  if(!list) return;
  if(!ruleStack.length){
    list.innerHTML = '<div class="hint">（空）尚无规则，请点「📥 导入规则」导入底层规则。</div>';
  } else {
    list.innerHTML = ruleStack.map((layer, i) => ({layer, i})).reverse().map(({layer, i}) =>
      `<div class="rule-layer"><span class="rule-layer-name">${esc(layer.name)}</span>${i===0?'<span class="rule-tag">底层</span>':''}<button class="xbtn" data-rule-reload="${i}" title="重新加载该层">⟳</button><button class="xbtn" data-rule-del="${i}" title="撤销该层">✕</button></div>`
    ).join("");
  }
}

function renderNoRules(){
  document.getElementById("playbook").innerHTML = '<div class="empty">⚠️ 未加载规则<br><br>请点「📥 导入规则」导入第一份规则 JSON（底层，需包含 classes）。之后可继续导入规则包叠加。</div>';
  const sel = document.getElementById("classSelect");
  if(sel) sel.innerHTML = `<option value="">—— 选择${esc(getClassLabel())} ——</option>`;
  renderRef();
  renderRulesPanel();
}

function init(){
  const start = () => {
    loadRules();
    applyData(effectiveRules());
    // char 的字段集由 header 决定，必须在 applyData 之后建
    ensureChar();
    if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
      renderNoRules();
      bind();
      return;
    }
    load();
    renderClassSelect();
    renderPlaybook();
    renderRef();
    bind();
    renderRulesPanel();
  };

  start();
}
init();
</script>
</body>
</html>
