<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地城世界车卡工具</title>
<style>
:root{
  /* ===== 主题配色：改这里即可整体换肤 ===== */
  /* 应用外壳（背景/工具栏） */
  --bg:#20242c; --panel:#262b35; --panel2:#2d3340; --panel3:#38404e; --line:#3d4554;
  --text:#e8eaf0; --muted:#98a2b3;
  --accent:#c8a24b; --accent-hover:#d7b25e; --accent-ink:#1a1408;
  --accent2:#5b8def; --accent2-dim:#2c3a4d; --accent2-ink:#cfe0f5; --accent2-line:#3d5470;
  /* 角色卡纸面 */
  --paper:#ffffff; --paper-2:#fafbfc; --ink:#1a1d24;
  --ink-2:#333333; --ink-3:#555555; --ink-4:#777777; --ink-5:#999999;
  --paperline:#cfd4dd;
  --line-2:#9aa; --line-3:#bbb; --line-4:#ccc; --line-5:#ddd;
  --warn:#b06a1a; --danger:#c0392b; --danger-bg:#fdecea;
  --tag-bg:#e0e0e0; --tag-ink:#000000; --on-ink:#ffffff;
  /* 资料边栏（默认跟随纸面，可单独覆盖以区别于角色卡） */
  --ref-paper:var(--paper); --ref-ink:var(--ink);
  --ref-ink-2:var(--ink-2); --ref-ink-3:var(--ink-3); --ref-ink-4:var(--ink-4); --ref-ink-5:var(--ink-5);
  --ref-paperline:var(--paperline); --ref-line-4:var(--line-4); --ref-line-5:var(--line-5);
  /* 自定义动作的左侧色条（默认透明 = 不显示） */
  --bar-custom:transparent;
}
*{box-sizing:border-box}
input,select,textarea,button{font-family:inherit}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.55}

/* ===== 工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.toolbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
.toolbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;max-width:180px}
.toolbar .spacer{flex:1}
.toolbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.toolbar button:hover{background:var(--panel3)}
.toolbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.toolbar button.primary:hover{background:var(--accent-hover)}
.toolbar button.mode-btn{background:var(--accent2);color:var(--on-ink);border-color:var(--accent2);font-weight:600}

/* ===== 规则栈面板 ===== */
.rules-panel{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:53px;z-index:99}
.rules-panel.hidden{display:none}
.rules-panel-head{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.rules-list{display:flex;flex-direction:column;gap:4px}
.rule-layer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.rule-layer-name{flex:1;color:var(--text);word-break:break-all}
.rule-tag{font-size:10px;color:var(--accent2);border:1px solid var(--accent2);border-radius:4px;padding:0 5px;white-space:nowrap}
.rule-layer .xbtn{flex:none}
.rules-actions{display:flex;gap:8px}
.rules-actions button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
.rules-actions button:hover{background:var(--panel3)}
.toolbar button.mode-btn.view{background:var(--accent2-dim);color:var(--accent2-ink);border-color:var(--accent2-line)}

/* ===== 主体 ===== */
.wrap{max-width:1440px;margin:0 auto;padding:18px 14px 60px}
.main-cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:1120px){.main-cols{grid-template-columns:1fr}}
/* 规则没声明 refSections：边栏整个不存在，角色卡保持宽度居中 */
.main-cols.no-ref{display:block}
.main-cols.no-ref .playbook{max-width:900px;margin:0 auto}
.playbook{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px 22px;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.4)}

/* ===== 参考资料边栏 (浅色) ===== */
.ref{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--ref-paper);color:var(--ref-ink);border:1px solid var(--ref-line-4);border-radius:8px;display:flex;flex-direction:column}
.ref-tabs{display:flex;border-bottom:1px solid var(--ref-paperline);position:sticky;top:0;background:var(--ref-paper);z-index:5}
.ref-tab{flex:1;background:transparent;color:var(--ref-ink-4);border:none;padding:9px 4px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.ref-tab.active{color:var(--ref-ink);border-bottom-color:var(--accent);font-weight:600}
.ref-body{padding:12px 14px}
.ref-empty{color:var(--ref-ink-4);font-size:12.5px;text-align:center;padding:30px 10px}
.ref-sec{font-size:12.5px;font-weight:700;color:var(--ref-ink);margin:14px 0 6px;letter-spacing:.5px;border-bottom:1px solid var(--ref-paperline);padding-bottom:3px}
.ref-sec:first-child{margin-top:0}
.ref-intro{font-size:12px;color:var(--ref-ink-2);margin-bottom:8px}
.rmv{border:1px solid var(--ref-line-4);border-radius:6px;margin-bottom:7px;background:var(--ref-paper);position:relative}
.rmv summary{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ref-ink);list-style:none}
.rmv summary::before{content:"▸";color:var(--ref-ink-4);font-size:10px;flex:none}
.rmv[open] summary::before{content:"▾"}
.rmv summary::-webkit-details-marker{display:none}
.rmv summary .src{font-size:10.5px;font-weight:400;color:var(--ref-ink-4);margin-left:auto;white-space:nowrap}
.rmv .rmv-b{margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.rmv .rmv-b:hover{background:var(--accent);color:var(--accent-ink)}
.rmv .rmv-t{padding:6px 9px 8px;font-size:12px;color:var(--ref-ink-2);border-top:1px solid var(--ref-paperline)}
.rmv .rmv-foot{padding:0 9px 8px;text-align:right}
.rmv .rmv-t p{margin:3px 0}
.rmv .rmv-t ul{margin:3px 0;padding-left:18px}
.rmv .rmv-t .tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:3px;padding:0 4px;font-size:12px}
.ref-search{width:100%;background:var(--ref-paper);color:var(--ref-ink);border:1px solid var(--ref-line-5);border-radius:6px;padding:7px 9px;font-size:13px;margin-bottom:4px}
.mv .mv-imp{flex:none;padding:1px 6px;border-radius:4px;font-size:11px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer}
.mv .mv-imp:hover{background:var(--accent);color:var(--accent-ink)}
/* 资料分组：无边框，样子就是一条可点开合的标题，组内动作卡铺满边栏整宽 */
.ref-grp{margin:14px 0 6px}
.ref-grp:first-child{margin-top:0}
.ref-grp>summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;color:var(--ref-ink);letter-spacing:.5px;border-bottom:1px solid var(--ref-paperline);padding-bottom:3px;margin-bottom:6px}
.ref-grp>summary::-webkit-details-marker{display:none}
.ref-grp>summary::before{content:"▸";color:var(--ref-ink-4);font-size:10px;flex:none}
.ref-grp[open]>summary::before{content:"▾"}
/* 边栏里的纯文本串：与动作正文 .mv-t 同字号 */
.ref .md{font-size:12px;margin:6px 0}
.tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:3px;padding:0 4px;font-size:12px;display:inline-block}
.tag-item{margin-bottom:6px;font-size:12px;color:var(--ref-ink-2);line-height:1.6}
.tag-item .tag{margin-right:4px}

/* ===== 页头：职业名 + charInfo ===== */
.pb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.pb-class{font-size:32px;font-weight:800;letter-spacing:1px;line-height:1.1}

/* --info-w 是字段基准宽；字段的 flex 声明按它的倍数折算成显式宽度，
   不走 flex-grow，否则 basis:0 的那一格会把全部剩余空间吃掉 */
.pb-info{--info-w:68px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;align-items:flex-end}
.pb-info .it{display:flex;flex-direction:column;flex:none;width:var(--info-w)}
/* 轨道的宽度由格数决定，不受基准宽约束 */
.pb-info .it.it-track{width:auto}
.pb-info .it .k{font-size:10px;color:var(--ink-4)}
.pb-info .it .v{font-size:16px;font-weight:700;word-break:break-word}
.pb-info input{background:transparent;border:none;border-bottom:1px dashed var(--ink-5);font-size:16px;font-weight:700;color:var(--ink);width:100%;min-width:0;text-align:left}
.pb-info .it .track{height:22px;align-content:center}
.pb-info .it .track .trc{width:18px;height:18px}

/* ===== 属性 + 数值 ===== */
.pb-stats{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:12px}
/* 属性块按内容收窄后整体居中，这样 prompt 能与最左侧属性卡左沿对齐 */
.stat-block{display:inline-flex;flex-direction:column;gap:4px;max-width:100%}
.pb-stats > .stat-block{justify-self:center}
.stat-prompt{font-size:11px;color:var(--ink-5);line-height:1.3}
.stat-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
/* 宽度有下限，label 更宽时被撑开 */
.stat-card{flex:0 0 auto;min-width:96px;text-align:center;display:flex;flex-direction:column;align-items:stretch}
.stat-card .n{font-size:13px;color:var(--ink-3);border-bottom:1px solid var(--paperline);padding-bottom:1px;white-space:nowrap}
.stat-card .v{font-size:24px;font-weight:800}
.stat-card .m{font-size:15px;font-weight:700;color:var(--ink-2)}
.stat-card input{width:100%;border:none;border-bottom:1px dashed var(--ink-5);text-align:center;font-size:24px;font-weight:800;background:transparent;color:var(--ink)}
/* 无 boundStat 的状态：另起一行横排居中，超宽换行 */
.loose-conditions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:2px}
.cond{border:1px solid var(--ink-5);background:transparent;color:var(--ink-4);border-radius:3px;padding:1px 5px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:3px;line-height:1.4;margin-top:2px}
.cond:hover{border-color:var(--accent)}
.cond.on{color:var(--ink);border-color:var(--ink-3)}
/* 状态标记：自己画的圆，填充比例由档位算出（--fill）。
   不走字体，所以档位切换时尺寸恒定；currentColor 让它跟着 .cond / .cond.on 变色。
   声明了 symbols 的状态改用字符，由 .cond-sym 退回纯文本。 */
.cond-mark{flex:none;display:inline-block;width:11px;height:11px;box-sizing:border-box;border:1px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor var(--fill,0%),transparent var(--fill,0%))}
.cond-sym{width:auto;height:auto;border:none;border-radius:0;background:none;font-size:11px;line-height:1}
.track{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.trl{font-size:14px;color:var(--ink-4);margin:0 3px}
.trl.on{color:var(--ink);font-weight:700}
.trc{width:14px;height:14px;border:1px solid var(--ink-5);border-radius:2px;background:transparent;padding:0;cursor:pointer}
.trc.on{background:var(--accent);border-color:var(--accent)}
/* --metric-w 是每列的下限宽，标签更宽时列会被撑开 */
.metrics-grid{--metric-w:96px;display:grid;gap:6px}
.metric-field{text-align:center;border:1px solid var(--line-3);border-radius:4px;padding:4px 6px;min-width:0}
.metric-field .k{font-size:12px;color:var(--ink-3)}
.metric-field .v{font-size:22px;font-weight:800}
/* 宽度必须是确定值：input 不写宽时固有宽约 20 字符，而 width:100% 在固有宽计算中被当作 auto 忽略 */
.metric-field input{width:calc(var(--metric-w) - 14px);max-width:100%;border:none;border-bottom:1px dashed var(--ink-5);text-align:center;font-size:22px;font-weight:800;background:transparent;color:var(--ink)}
.metric-field .formula{font-size:10px;color:var(--ink-5);margin-top:1px}

/* ===== number 字段的步进箭头 =====
   绝对定位叠在输入框右侧，不占横向空间，
   这样属性格的大数字仍然居中、列宽也不受影响 */
/* 数值格的输入框有显式宽度，包裹层按内容收窄并居中，箭头才贴着框右沿；
   属性格与页首的输入框是 width:100%，包裹层必须撑满才能给出参照宽度 */
/* 箭头尺寸随所在格的字号走：两枚箭头叠起来不能超过输入框的行高，
   否则下箭头会压到输入框的下划线上。页首字号小，单独调小一档。 */
.num-wrap{--step-w:17px;--step-h:13px;--step-f:10px;position:relative;display:inline-block;max-width:100%}
.pb-info .num-wrap{--step-w:15px;--step-h:9px;--step-f:8px}
.stat-card .num-wrap,.pb-info .num-wrap{display:block}
.num-step{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1px;line-height:0}
.num-step button{border:none;background:transparent;color:var(--line-3);cursor:pointer;padding:0;width:var(--step-w);height:var(--step-h);font-size:var(--step-f);line-height:1;display:flex;align-items:center;justify-content:center}
.num-step button:hover{color:var(--accent)}
/* 给箭头让出位置，避免长数字顶上去。
   居中的数字两侧要对称留白，否则文字会被推向左边 */
.num-wrap > input{padding-right:calc(var(--step-w) + 1px)}
.stat-card .num-wrap > input,.metric-field .num-wrap > input{padding:0 calc(var(--step-w) + 1px)}

/* ===== select 字段：可输入的下拉 =====
   不用 <datalist>：它的箭头由浏览器绘制、弹层宽度不可控，
   而且按输入内容过滤选项（那是输入建议，不是下拉） */
.sel-wrap{position:relative;display:inline-flex;align-items:flex-end;gap:2px;max-width:100%}
/* 箭头要占掉一点横向空间，所以输入框比普通数值格窄一些，
   这样整格不会比别的列宽 */
.metric-field .sel-wrap{width:calc(var(--metric-w) - 10px)}
.metric-field .sel-wrap > input{width:auto;flex:1;min-width:0}
.sel-caret{flex:none;border:none;background:transparent;color:var(--ink-4);cursor:pointer;padding:0;width:20px;height:20px;font-size:11px;line-height:1;align-self:center;display:flex;align-items:center;justify-content:center;border-radius:3px}
.sel-caret:hover{color:var(--accent);background:var(--tag-bg)}
.sel-menu{position:absolute;top:100%;left:0;min-width:100%;z-index:50;margin-top:2px;background:var(--paper);border:1px solid var(--line-3);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:2px;max-height:220px;overflow:auto}
.sel-menu.hidden{display:none}
.sel-opt{display:block;width:100%;border:none;background:transparent;color:var(--ink);text-align:left;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:400;padding:4px 8px;border-radius:3px}
.sel-opt:hover{background:var(--tag-bg)}
/* 纸面区域要能接住浮层，否则会被后面的边栏盖住 */
.playbook{position:relative;z-index:0}
/* 数字框一律去掉浏览器自带的上下箭头 */
.stat-card input[type=number],.metric-field input[type=number],.pb-info input[type=number],.h3r input[type=number],.coins-input[type=number]{-moz-appearance:textfield;appearance:textfield}
.stat-card input[type=number]::-webkit-outer-spin-button,.stat-card input[type=number]::-webkit-inner-spin-button,
.metric-field input[type=number]::-webkit-outer-spin-button,.metric-field input[type=number]::-webkit-inner-spin-button,
.pb-info input[type=number]::-webkit-outer-spin-button,.pb-info input[type=number]::-webkit-inner-spin-button,
.h3r input[type=number]::-webkit-outer-spin-button,.h3r input[type=number]::-webkit-inner-spin-button,
.coins-input[type=number]::-webkit-outer-spin-button,.coins-input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.formula-link{margin:0;padding:0;border:none;background:none;color:inherit;font:inherit;text-decoration:none;cursor:pointer}
.formula-link:hover{color:var(--accent);text-decoration:underline}

/* ===== 两栏 ===== */
.pb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.pb-cols{grid-template-columns:1fr}}
.pb-sec{margin-bottom:12px}
/* plain 元素之间统一间隔（首个贴标题，其后每个间隔 6px） */
.plain-el + .plain-el{margin-top:6px}
.plain-el > .hint{margin-top:0}
.pb-sec h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pb-sec h3 small{font-weight:400;color:var(--ink-4);font-size:11px;text-transform:none;margin-left:4px}
.pb-sec h3 .h3r{font-weight:400;font-size:11px;color:var(--ink-5);text-transform:none;letter-spacing:0;white-space:nowrap}
.pb-sec h3 .h3r input{border:1px solid var(--line-5);border-radius:3px;padding:1px 3px;font-size:12px;background:var(--paper);color:var(--ink);width:52px;text-align:center}
.pb-sec h3 .h3r b{color:var(--ink);font-weight:700}

/* ===== 动作卡 ===== */
.mv{border:1px solid var(--line-2);border-radius:4px;padding:7px 9px;margin:6px 0;background:var(--paper);position:relative}
.mv.disabled{opacity:.45}
/* 动作左侧色条（--bar 由来源 class 或内联样式指定） */
.mv::before,.rmv::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--bar,transparent);border-radius:3px 0 0 3px;pointer-events:none}
.mv-custom{--bar:var(--bar-custom)}
.mv .mv-h{display:flex;align-items:flex-start;gap:6px}
.mv .mv-h .chk{flex:none;margin-top:3px}
.mv .mv-n{font-weight:700;font-size:13px;flex:1}
.mv .mv-n input{width:100%;border:none;border-bottom:1px dashed transparent;background:transparent;font-weight:700;font-size:13px;color:var(--ink)}
.mv .mv-n input:focus{border-bottom-color:var(--accent);outline:none}
.mv .mv-t{font-size:12px;color:var(--ink-2);margin-top:3px}
.mv .mv-t textarea{width:100%;border:1px solid var(--line-5);border-radius:3px;background:var(--paper-2);font-size:12px;min-height:34px;padding:5px 7px;resize:none;overflow:hidden;font-family:inherit;color:var(--ink);line-height:1.5}
.mv .req{font-size:10px;color:var(--warn);font-weight:400;margin-left:6px;white-space:nowrap}
.mv .mv-t p{margin:3px 0}
.mv .mv-t ul{margin:3px 0;padding-left:18px}
.mv .mv-t input.mbox,input.mbox{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1.5px solid var(--ink-4);border-radius:3px;background:var(--paper);vertical-align:-2px;margin:0 2px;cursor:pointer}
.mv .mv-t input.mbox:hover,input.mbox:hover{border-color:var(--accent)}
.mv .mv-t input.mbox:checked,input.mbox:checked{background:var(--ink);border-color:var(--ink)}
input.mbox:disabled{border-color:var(--ink-5);cursor:not-allowed;opacity:.5}
input.mbox:disabled:hover{border-color:var(--ink-5)}
.md p{margin:3px 0}
.md ul{margin:3px 0;padding-left:18px}
.md li{margin:1px 0}
.mv .tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:3px;padding:0 4px;font-size:12px}

<body>

    </aside>

<script>
let DW_DATA = null, META = {}, HEADER = {charInfo:[], stats:{}, metrics:{}}, REF_SECTIONS = [], AREAS = {}, AREA_LAYOUT = {left:[], right:[]};
function applyData(data){
  DW_DATA = data || {};
  META = DW_DATA.meta || {};
  // 页首三个区块全由 meta.header 声明，代码不预设任何属性名、状态名或字段名
  HEADER = resolveHeader(META.header);
  HEADER_CACHE = {};
  AREAS = META.areas || {};
  AREA_LAYOUT = resolveAreaLayout(META.areaLayout);
  // 边栏内容全由 refSections 声明；没声明就没有页签
  REF_SECTIONS = META.refSections || [];
  if(!REF_SECTIONS.some(s => s.id === refTab)) refTab = REF_SECTIONS[0] ? REF_SECTIONS[0].id : null;
  buildTagMap();
}

// 获取角色类型的显示名称（默认"职业"）
function getClassLabel(){ return META.classLabel || "职业"; }

// header 的三个区块都允许整块缺省：缺 charInfo 就没有页首字段，
// 缺 stats.items 就没有属性格，缺 metrics.fields 就没有数值格。
function resolveHeader(h){
  const src = isObj(h) ? h : {};
  const stats = isObj(src.stats) ? src.stats : {};
  const metrics = isObj(src.metrics) ? src.metrics : {};
  return {
    charInfo: Array.isArray(src.charInfo) ? src.charInfo : [],
    stats: {
      prompt: stats.prompt || "",
      modTable: isObj(stats.modTable) ? stats.modTable : null,
      items: Array.isArray(stats.items) ? stats.items : [],
      conditions: Array.isArray(stats.conditions) ? stats.conditions : []
    },
    metrics: {
      columns: metrics.columns || 2,
      fields: Array.isArray(metrics.fields) ? metrics.fields : []
    }
  };
}

// 职业可以覆盖 header 的任何部分，合并规则与 areas 一致。
// 渲染时每个属性、每个分组都会问一次，所以按职业缓存合并结果。
let HEADER_CACHE = {};
function headerFor(cls){
  if(!cls || !isObj(cls.header)) return HEADER;
  const k = cls.id || "";
  if(!HEADER_CACHE[k]) HEADER_CACHE[k] = resolveHeader(deepMerge(META.header || {}, cls.header));
  return HEADER_CACHE[k];
}

// areaLayout 显式声明哪些区域渲染及其顺序和栏位。
// 未定义 areaLayout 时，渲染所有 areas 中的区域（按声明顺序放到左栏）。
// 定义了 areaLayout 后，未列入的区域不渲染（可用于房规隐藏某个区域）。
// 布局里列了但 areas 里没有的 key 直接跳过。
function resolveAreaLayout(layout){
  const keys = Object.keys(AREAS);
  if(!layout) return { left: keys, right: [] };
  const pick = side => (layout[side] || []).filter(k => AREAS[k]);
  const left = pick("left");
  const right = pick("right").filter(k => !left.includes(k));
  return { left, right };
}

/*__MERGE_RULES_JS__*/

/* ============ 状态 ============ */
let mode = "edit";
let refTab = null;   // 实际值由 refSections 的第一个页签决定
let searchKw = "";
let lastSearchItems = [];
let boxReg = {};
let ruleStack = [];
let customData = {classes:[], moveListMoves:{}, moveListGroups:{}};
let char = null;  // 延迟初始化，等待 HEADER 就位
let TAG_COLOR_MAP = {};

function uid(){ return "c"+Math.random().toString(36).slice(2,9); }

/* ============ 角色数据 ============ */
// 三个容器，键名全部来自 header 声明：
//   fields —— charInfo 与 metrics 的字段值
//   stats  —— 属性值，按 stats.items[].id 存
//   states —— 状态档位，按 stats.conditions[].id 存，0 即初始档
function defaultChar(){
  const c = {classId:"", fields:{}, stats:{}, states:{},
    areaData:{}, moveListSelections:{}, moveListGroupNames:{}, moveListNames:{}, moveListTexts:{}};
  seedChar(c, HEADER);
  return c;
}
// 按 header 声明补齐字段初值。已有值不动，所以换职业时只补新出现的字段。
function seedChar(c, header){
  header.charInfo.forEach(f => {
    if(c.fields[f.id] === undefined) c.fields[f.id] = fieldSeed(f);
  });
  header.metrics.fields.forEach(f => {
    if(c.fields[f.id] === undefined) c.fields[f.id] = fieldSeed(f);
  });
  header.stats.items.forEach(s => {
    if(c.stats[s.id] === undefined) c.stats[s.id] = s.default || 0;
  });
}
function fieldSeed(f){
  if(f.default !== undefined) return f.default;
  return (f.type === "number" || f.type === "track") ? 0 : "";
}

/* ============ 属性与状态 ============ */
// 属性定义按 id 或 label 查：公式和 boundStat 都允许写任意一种
function statItem(statKey, header){
  const h = header || headerFor(getClass(char.classId));
  return h.stats.items.find(s => s.id === statKey || s.label === statKey) || null;
}
function statValue(statKey, header){
  const item = statItem(statKey, header);
  if(!item) return null;
  const v = char.stats[item.id];
  return v === undefined || v === "" ? (item.default || 0) : (parseInt(v, 10) || 0);
}
// 数值 → 调整值。只有 score 类属性查表，modifier 类属性自身即调整值。
function rawMod(item, value, header){
  if(item.type !== "score") return value || 0;
  const h = header || headerFor(getClass(char.classId));
  const table = h.stats.modTable;
  if(!table) return 0;
  for(const r of Object.keys(table)){
    const parts = String(r).split("-");
    const lo = parseInt(parts[0], 10) || 0;
    const hi = parts.length > 1 ? (parseInt(parts[1], 10) || 0) : Infinity;
    if(value >= lo && value <= hi) return table[r];
  }
  return 0;
}
// 计入状态效果后的调整值
function effModOf(item, header){
  const h = header || headerFor(getClass(char.classId));
  const value = statValue(item.id, h);
  return rawMod(item, value, h) - statePenalty(item, h);
}
// 绑定到该属性、且已离开初始档的状态，每个按 effect 扣减
function statePenalty(item, header){
  const h = header || headerFor(getClass(char.classId));
  let penalty = 0;
  boundConditions(item, h).forEach(c => {
    if(c.effect !== "modPenalty") return;
    if((char.states[c.id] || 0) > 0) penalty += 1;
  });
  return penalty;
}
// boundStat 同样按 id 或 label 匹配
function boundConditions(item, header){
  const h = header || headerFor(getClass(char.classId));
  return h.stats.conditions.filter(c =>
    c.boundStat !== undefined && (c.boundStat === item.id || c.boundStat === item.label));
}
function fmtMod(m){return (m>0?"+":"")+m;}
// 就地刷新调整值文本，省掉一次整表重渲染（输入框正在被编辑，不能重建）
function refreshMods(){
  const header = headerFor(getClass(char.classId));
  header.stats.items.forEach(item => {
    const el = document.querySelector(`[data-mod="${cssEsc(item.id)}"]`);
    if(el) el.textContent = fmtMod(effModOf(item, header));
  });
}
// id 由规则作者自定，可能含引号或中文，放进选择器前要转义
function cssEsc(s){
  if(window.CSS && CSS.escape) return CSS.escape(String(s));
  return String(s).replace(/["\\]/g, "\\$&");
}
// 状态档数，至少两档（清空 / 已标记）
function stateCount(c){ return Math.max(2, parseInt(c.states, 10) || 2); }
function boundsAttr(f){
  let out = "";
  if(f.min !== undefined) out += ` min="${esc(f.min)}"`;
  if(f.max !== undefined) out += ` max="${esc(f.max)}"`;
  return out;
}
// 数值输入框的上下限。规则没声明就给一个足够宽的区间兜底，
// 只为挡住会把输入框撑爆的超长数字，不是业务约束。
function numBounds(f){
  if(f.min !== undefined || f.max !== undefined) return boundsAttr(f);
  return ' min="-9999" max="99999"';
}
// tags 页签的数据按它自己的 id 取：id 为 tags 的页签读顶层 tags。
// 可以有多个 tags 页签，各读各的数据块。按页签声明顺序返回。
function tagSectionData(){
  return REF_SECTIONS.filter(s => s.type === "tags").map(s => refSectionData(s.id));
}
// 颜色定义来自全部 tags 页签，与页签是否渲染无关。
// 按「页签 → 分类 → 标签」的声明顺序写入，所以同名标签以后出现的页签为准。
function buildTagMap() {
  TAG_COLOR_MAP = {};
  for (const tagsData of tagSectionData()) {
    // 顶层 tags
    (tagsData.tags || []).forEach(tag => {
      if (tag.name && tag.color) {
        TAG_COLOR_MAP[tag.name] = {
          color: tag.color,
          textColor: tag.textColor || null
        };
      }
    });
    // groups 内的 tags
    (tagsData.groups || []).forEach(g => {
      (g.tags || []).forEach(tag => {
        if (tag.name && tag.color) {
          TAG_COLOR_MAP[tag.name] = {
            color: tag.color,
            textColor: tag.textColor || null
          };
        }
      });
    });
  }
}
function getTagColor(tagName) {
  return TAG_COLOR_MAP[tagName] || null;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stripTags(html){ const d=document.createElement("div"); d.innerHTML=html||""; return d.textContent||""; }
function inlineMarkdown(t){
  return esc(t).replace(/\{([^{}]+)\}/g, (match, tagName) => {
    const tagStyle = getTagColor(tagName);
    let style = '';
    if (tagStyle) {
      const bg = tagStyle.color;
      const fg = tagStyle.textColor;
      style = fg ? ` style="background:${bg};color:${fg};"` : ` style="background:${bg};"`;
    }
    return `<span class="tag"${style}>${tagName}</span>`;
  }).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function markdownToHtml(md){
  const lines=String(md||"").split("\n");
  const out=[]; let list=[]; let para=[];
  const flushList=()=>{ if(list.length){ out.push("<ul>"+list.map(x=>"<li>"+x+"</li>").join("")+"</ul>"); list=[]; } };
  const flushPara=()=>{ if(para.length){ out.push("<p>"+para.map(inlineMarkdown).join("<br>")+"</p>"); para=[]; } };
  for(const line of lines){
    const m=line.match(/^\s*[-*]\s+(.*)$/);
    if(m){ flushPara(); list.push(inlineMarkdown(m[1])); continue; }
    if(line.trim()===""){ flushList(); flushPara(); continue; }
    flushList(); para.push(line.trim());
  }
  flushList(); flushPara();
  return out.join("");
}
function applyBoxes(html, key){
  let idx = 0;
  return String(html||"").replace(/\[([ xX])\]/g, (m, c)=>{
    const box = `<input type="checkbox" class="mbox" data-movebox="${esc(key)}" data-box="${idx}"${c !== " " ? " checked" : ""}>`;
    idx++;
    return box;
  });
}
// 渲染单个填空位 [[key]] / [[key:内容]]，绑定 char.areaData[areaKey][key]。
// 编辑模式：原生 input，内容作 placeholder（纯文本）；查看模式：已存值走 inlineMarkdown 渲染。
function renderBlank(key, content, areaKey, editable){
  const val = plainGet(areaKey, key, "");
  if(!editable) return val ? inlineMarkdown(val) : (content ? esc(content) : "＿");
  return `<span class="blank-wrap"><input class="blank" data-plain="blank:${areaKey}:${key}" value="${esc(val)}" placeholder="${esc(content||"")}"><span class="blank-sizer" aria-hidden="true"></span></span>`;
}
// 先把 [[...]] 换成占位符，markdown 处理完再用 restore 还原，避免内容里的标记被外层 markdown 吃掉。
function protectBlanks(text){
  const blanks = [];
  const t = String(text||"").replace(/\[\[([^:\]]+)(?::([^\]]*))?\]\]/g, (m, key, content) => {
    blanks.push({key, content});
    return `\uE000${blanks.length - 1}\uE001`;
  });
  return {
    text: t,
    restore(html, areaKey, editable){
      return String(html).replace(/\uE000(\d+)\uE001/g, (m, i) => {
        const b = blanks[+i];
        return b ? renderBlank(b.key, b.content, areaKey, editable) : "";
      });
    }
  };
}
// 内联渲染（choices 选项 / track 标签）：保护 [[...]] 后其余文本走 inlineMarkdown，再还原填空位。
function renderInline(text, areaKey, editable){
  const pb = protectBlanks(text);
  return pb.restore(inlineMarkdown(pb.text), areaKey, editable);
}
function toggleTextBox(md, index){
  let i = 0;
  return String(md||"").replace(/\[([ xX])\]/g, (m, c)=>{
    if(i === index){ i++; return c === " " ? "[x]" : "[ ]"; }
    i++;
    return m;
  });
}
function renderFieldMarkdown(md, key, get, set){
  boxReg[key] = {get, set};
  return applyBoxes(markdownToHtml(md), key);
}

function mergedClasses(){ return (DW_DATA.classes||[]).concat(customData.classes||[]); }
function getClass(id){ return mergedClasses().find(c=>c.id===id); }
function reqList(mv){ return mv.requires ? (Array.isArray(mv.requires) ? mv.requires : [mv.requires]) : []; }
function repList(mv){ return mv.replaces ? (Array.isArray(mv.replaces) ? mv.replaces : [mv.replaces]) : []; }

// 公式项的查找顺序：数字 → 属性 → header 字段 → 区域 rightStat。
// 每一层都同时接受 id 与 label，规则想用哪种写法都行。
function evalFormula(formula, ctx){
  const terms = String(formula||"").split("+").map(t=>t.trim()).filter(t=>t!=="");
  if(!terms.length) return null;
  const header = headerFor(getClass(char.classId));
  let sum = 0;
  for(const t of terms){
    if(/^-?\d+$/.test(t)){ sum += parseInt(t,10); continue; }
    const sv = statValue(t, header);
    if(sv !== null){ sum += sv; continue; }
    const fv = fieldValueByKey(t, header);
    if(fv !== null){ sum += fv; continue; }
    const rv = statValueByLabel(t);
    if(rv !== null){ sum += rv; continue; }
    return null;
  }
  return sum;
}
// 在 charInfo / metrics 里按 id 或 label 找字段的当前数值
function fieldValueByKey(key, header){
  const h = header || headerFor(getClass(char.classId));
  const def = h.charInfo.concat(h.metrics.fields)
    .find(f => f.id === key || f.label === key);
  if(!def) return null;
  const cur = char.fields[def.id];
  return cur !== undefined && cur !== "" ? (parseInt(cur, 10) || 0) : 0;
}
// 按 label 在所有区域的 rightStats 里反查当前值
function statValueByLabel(label){
  const cls = getClass(char.classId);
  for(const areaKey of Object.keys(AREAS)){
    const stats = getAreaHeader(areaKey, cls).rightStats || [];
    const def = stats.find(s => s.label === label);
    if(!def) continue;
    const cur = char.fields[def.key];
    return cur !== undefined && cur !== "" ? (parseInt(cur, 10) || 0) : 0;
  }
  return null;
}
// 公式按钮：target 可能是 header 的 metrics 字段，也可能是区域里的 rightStat
function applyFormula(target){
  const cls = getClass(char.classId);
  if(!cls) return;
  const field = headerFor(cls).metrics.fields.find(f => f.id === target);
  const formula = field ? field.formula : (statDefByKey(target, cls) || {}).formula;
  if(!formula) return;
  const v = evalFormula(formula);
  if(v != null) char.fields[target] = v;
  renderPlaybook(); save();
}

/* ============ 持久化 ============ */
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function save(){ lsSet("dw-char", JSON.stringify(char)); lsSet("dw-custom", JSON.stringify(customData)); lsSet("dw-ui", JSON.stringify({mode, refTab})); }
function saveRules(){ lsSet("dw-rules-stack", JSON.stringify(ruleStack)); }
function loadRules(){
  const s = lsGet("dw-rules-stack");
  if(s !== null){
    // 有规则栈键（哪怕是空数组），说明是新版存储，直接用它，不再回退旧键
    try{ const arr = JSON.parse(s); if(Array.isArray(arr)) ruleStack = arr; }catch(e){}
    return;
  }
}
function normalizeCustomData(){
  customData.classes = customData.classes || [];
  customData.moveListMoves = customData.moveListMoves || {};
  customData.moveListGroups = customData.moveListGroups || {};
  // 补全缺失的 id
  Object.values(customData.moveListMoves).forEach(byArea => Object.values(byArea||{}).forEach(arr => (arr||[]).forEach(m => { if(!m.id) m.id = uid(); })));
  Object.values(customData.moveListGroups).forEach(byArea => Object.values(byArea||{}).forEach(arr => (arr||[]).forEach(g => { if(!g.key) g.key = uid(); })));
}
function normalizeChar(){
  char.fields = char.fields || {};
  char.stats = char.stats || {};
  char.states = char.states || {};
  char.areaData = char.areaData || {};
  char.moveListSelections = char.moveListSelections || {};
  char.moveListGroupNames = char.moveListGroupNames || {};
  char.moveListNames = char.moveListNames || {};
  char.moveListTexts = char.moveListTexts || {};
  // 补齐当前 header 新声明、而存档里还没有的字段
  seedChar(char, headerFor(getClass(char.classId)));
}
// 只认 fields/stats/states 三容器的新结构，旧的扁平存档直接丢弃
function usableChar(saved){
  return isObj(saved) && isObj(saved.fields) && isObj(saved.states);
}
function load(){
  try{
    const c=lsGet("dw-char");
    if(c){
      const saved = JSON.parse(c);
      if(usableChar(saved)) char = Object.assign(defaultChar(), saved);
    }
    const cu=lsGet("dw-custom"); if(cu) customData=JSON.parse(cu);
    const ui=lsGet("dw-ui"); if(ui){ const u=JSON.parse(ui); if(u.mode==="view"||u.mode==="edit") mode=u.mode; if(u.refTab && REF_SECTIONS.some(s=>s.id===u.refTab)) refTab=u.refTab; }
  }catch(e){}
  normalizeCustomData();
  normalizeChar();
}

/* ============ 渲染 ============ */
/* ============ 区域标题渲染 ============ */
// 从 areaHeaders + 职业覆盖中取出某个 rightStat 的定义
function findRightStat(areaKey, statKey, cls) {
  const h = getAreaHeader(areaKey, cls);
  return (h.rightStats || []).find(s => s.key === statKey) || null;
}
// 按 key 反查定义（供 applyFormula / defaultStatValue 使用）
function statDefByKey(statKey, cls){
  for(const areaKey of Object.keys(AREAS)){
    const d = findRightStat(areaKey, statKey, cls);
    if(d) return d;
  }
  return null;
}
function statFormula(statKey, cls){
  const d = statDefByKey(statKey, cls);
  return d ? d.formula : undefined;
}
// rightStat 的默认值：公式算得出就用它，算不出退回公式首项的常数
function defaultStatValue(statKey, cls){
  const f = statFormula(statKey, cls);
  if(!f) return 0;
  const v = evalFormula(f);
  if(v != null) return v;
  return parseInt(String(f).split("+")[0], 10) || 0;
}
// metrics 字段的默认值：有公式先算公式，否则取声明的 default。
// 职业覆盖已在 headerFor 里合并进 field，这里不必再看 cls。
function defaultFieldValue(field){
  if(field.formula){
    const v = evalFormula(field.formula);
    if(v != null) return v;
  }
  if(field.default !== undefined) return field.default;
  return field.type === "number" ? 0 : "";
}

function getAreaHeader(areaKey, cls) {
  const base = AREAS[areaKey];
  if (!base) return {title: "", note: null, type: null, rightStats: []};

  const override = (cls && cls.areas && cls.areas[areaKey]) || {};

  // 直接深度合并整个区域对象
  return deepMerge(base, override);
}

function renderAreaHeader(areaKey, cls, extraRight) {
  const area = getAreaHeader(areaKey, cls);
  if (!area.title) return "";

  let leftSide = esc(area.title);
  if (area.note) leftSide += ` <small>${esc(area.note)}</small>`;

  const right = (area.rightStats || []).map(s => renderRightStat(s, cls));
  if (extraRight) right.push(extraRight);
  const rightSide = right.length ? `<span class="h3r">${right.join(" ")}</span>` : "";

  return `<h3><span>${leftSide}</span>${rightSide}</h3>`;
}

/* ============ Plain 区域模板 ============ */
function plainGet(areaKey, key, dflt){
  const a = char.areaData && char.areaData[areaKey];
  const v = a ? a[key] : undefined;
  return v === undefined ? dflt : v;
}
function plainSet(areaKey, key, val){
  if(!char.areaData) char.areaData = {};
  if(!char.areaData[areaKey]) char.areaData[areaKey] = {};
  char.areaData[areaKey][key] = val;
}
// 获取元素的渲染策略（中心化判断）
function getPlainRenderStrategy(el){
  const viewMode = (mode === "edit") ? "editable" : (el.view || "readonly");
  
  return {
    shouldRender: viewMode !== "hide",
    isEditable: viewMode === "editable",
    addGreyClass: viewMode === "grey",
    hideUnselected: viewMode === "hideUnselect",
    greyUnselected: viewMode === "greyUnselect"
  };
}

function plainText(areaKey, el){
  const strategy = getPlainRenderStrategy(el);
  if(!strategy.shouldRender) return "";
  
  const stateKey = el.key || ("_text" + el._idx);
  const boxKey = "plain::" + areaKey + "::" + stateKey;
  const raw = plainGet(areaKey, stateKey, el.value || "");
  const pb = protectBlanks(raw);
  const content = pb.restore(renderFieldMarkdown(
    pb.text,
    boxKey,
    () => plainGet(areaKey, stateKey, el.value || ""),
    t => plainSet(areaKey, stateKey, t)
  ), areaKey, strategy.isEditable);
  
  const wrapped = `<div class="md">${content}</div>`;
  return strategy.addGreyClass ? `<div class="grey">${wrapped}</div>` : wrapped;
}

function plainHint(areaKey, el){
  const strategy = getPlainRenderStrategy(el);
  if(!strategy.isEditable) return "";
  return `<div class="hint md">${markdownToHtml(el.value || "")}</div>`;
}

function plainChoices(areaKey, el){
  const strategy = getPlainRenderStrategy(el);
  if(!strategy.shouldRender) return "";
  
  const selected = plainGet(areaKey, el.key, []);
  const options = el.value || [];
  
  // 根据策略决定显示哪些选项
  let visible = options;
  if(!strategy.isEditable && strategy.hideUnselected){
    // hideUnselect: 只显示已选中项
    visible = options.filter(o => selected.includes(o));
    if(!visible.length) return "";
  }
  // 默认（readonly）、grey、greyUnselected: 显示所有选项
  
  // 默认 layout 为 line，只有显式设为 break 才换行
  const useLineLayout = el.layout !== "break";
  
  const boxes = visible.map(o => {
    const checked = selected.includes(o);
    const dis = strategy.isEditable ? "" : " disabled";
    const itemGrey = (strategy.greyUnselected && !checked) ? " grey" : "";
    // line 模式：去掉 .opt 容器，直接用 label 包裹，避免 padding 导致的对齐问题
    if(useLineLayout){
      return `<label class="${itemGrey}" style="display:inline-flex;align-items:center;gap:4px;font-size:12.5px"><input type="checkbox" class="chk" value="${esc(o)}" data-plain="choice:${areaKey}:${el.key}"${checked ? " checked" : ""}${dis}> ${renderInline(o, areaKey, strategy.isEditable)}</label>`;
    }
    // break 模式：保持原有的 .opt 容器
    return `<div class="opt${itemGrey}"><label class="optt"><input type="checkbox" class="chk" value="${esc(o)}" data-plain="choice:${areaKey}:${el.key}"${checked ? " checked" : ""}${dis}> ${renderInline(o, areaKey, strategy.isEditable)}</label></div>`;
  }).join("");
  
  if(!el.label){
    const html = useLineLayout ? `<div class="addrow" style="margin-top:0">${boxes}</div>` : boxes;
    return strategy.addGreyClass ? `<div class="grey">${html}</div>` : html;
  }
  
  // 有 label 时
  if(useLineLayout){
    // line 模式：label 紧贴选项，选项之间有间距
    const content = `<div class="choices-line"><b style="white-space:nowrap">${renderInline(el.label, areaKey, strategy.isEditable)}：</b><div class="choices-line-items">${boxes}</div></div>`;
    return strategy.addGreyClass ? `<div class="grey">${content}</div>` : content;
  } else {
    // break 模式：label 与第一个选项对齐，其余选项缩进
    const content = `<div class="choices-break"><b class="choices-label">${renderInline(el.label, areaKey, strategy.isEditable)}：</b><div>${boxes}</div></div>`;
    return strategy.addGreyClass ? `<div class="grey">${content}</div>` : content;
  }
}

function plainInput(areaKey, el){
  const strategy = getPlainRenderStrategy(el);
  if(!strategy.shouldRender) return "";
  
  const value = plainGet(areaKey, el.key, el.prefix || "");
  const lab = el.label ? `<b>${renderInline(el.label, areaKey, strategy.isEditable)}</b>：` : "";
  
  if(strategy.isEditable){
    const hintHtml = el.hint ? `<div class="origin-hint">${esc(el.hint)}</div>` : "";
    return `<div class="origin-line"><div class="origin-row">${lab}<input data-plain="input:${areaKey}:${el.key}" value="${esc(value)}" placeholder="${esc(el.tip || "")}"></div>${hintHtml}</div>`;
  } else {
    if(!value) return "";
    const html = `<div class="origin-line">${lab}${esc(value)}</div>`;
    return strategy.addGreyClass ? html.replace(/^<div/, '<div class="grey"') : html;
  }
}

function plainTrack(areaKey, el){
  const strategy = getPlainRenderStrategy(el);
  if(!strategy.shouldRender) return "";
  const dis = strategy.isEditable ? "" : " disabled";
  const segs = el.value || [];

  // 定位零点（zero:true 或最靠左的 label）并记录各 label 槽位下标
  const labelIdx = [];
  let acc = 0, zeroIndex = -1;
  for(const item of segs){
    if(item.label !== undefined){
      labelIdx.push(acc);
      if(item.zero && zeroIndex < 0) zeroIndex = acc;
    } else if(item.slots !== undefined) acc += item.slots;
  }
  const hasZero = zeroIndex >= 0;
  if(!hasZero) zeroIndex = labelIdx.length ? labelIdx[0] : 0;

  // 左右填充数（非 dual 是有符号整数，dual 是 {left,right}）
  const dual = el.dual === true && hasZero;
  const raw = plainGet(areaKey, el.key, 0);
  const o = dual ? (raw && typeof raw === 'object' ? raw : {}) : null;
  const leftFill = dual ? (o.left || 0) : (raw < 0 ? -raw : 0);
  const rightFill = dual ? (o.right || 0) : (raw > 0 ? raw : 0);

  // 高亮 label 下标集合："all" 全亮；否则按到达
  const firstAtLeast = x => { for(let i = 0; i < labelIdx.length; i++) if(labelIdx[i] >= x) return i; return -1; };
  const lastAtMost = x => { for(let i = labelIdx.length - 1; i >= 0; i--) if(labelIdx[i] <= x) return i; return -1; };
  const hl = new Set();
  if(el.highlight === "all") labelIdx.forEach((_, i) => hl.add(i));
  else if(dual){
    const li = firstAtLeast(zeroIndex - leftFill), ri = lastAtMost(zeroIndex + rightFill);
    if(labelIdx[li] === zeroIndex && labelIdx[ri] === zeroIndex) hl.add(li);
    else { if(labelIdx[li] !== zeroIndex) hl.add(li); if(labelIdx[ri] !== zeroIndex) hl.add(ri); }
  } else {
    const cur = raw >= 0 ? lastAtMost(zeroIndex + raw) : firstAtLeast(zeroIndex + raw);
    if(cur >= 0) hl.add(cur);
  }

  // 渲染
  const slotOn = gi => (gi >= zeroIndex - leftFill && gi < zeroIndex) || (gi >= zeroIndex && gi < zeroIndex + rightFill);
  let gi = 0, li = 0, html = "";
  for(const item of segs){
    if(item.label !== undefined){
      html += `<span class="trl${hl.has(li) ? " on" : ""}">${renderInline(item.label, areaKey, strategy.isEditable)}</span>`;
      li++;
    } else if(item.slots !== undefined){
      for(let i = 0; i < item.slots; i++){
        html += `<button type="button" class="trc${slotOn(gi) ? " on" : ""}" data-plain="track:${areaKey}:${el.key}:${gi}:${zeroIndex}:${dual ? 1 : 0}"${dis}></button>`;
        gi++;
      }
    }
  }

  const trackHtml = `<div class="track">${html}</div>`;
  if(!el.label) return strategy.addGreyClass ? `<div class="grey">${trackHtml}</div>` : trackHtml;
  const content = `<div style="display:flex;align-items:center"><b style="white-space:nowrap">${renderInline(el.label, areaKey, strategy.isEditable)}：</b>${trackHtml}</div>`;
  return strategy.addGreyClass ? `<div class="grey">${content}</div>` : content;
}

const PLAIN_RENDERERS = { text: plainText, hint: plainHint, choices: plainChoices, input: plainInput, track: plainTrack };

function renderPlainArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "plain") return "";
  const inner = (area.elements || []).map((el, i) => {
    el._idx = i;
    const fn = PLAIN_RENDERERS[el.type];
    const html = fn ? fn(areaKey, el) : "";
    return html ? `<div class="plain-el">${html}</div>` : "";
  }).join("");
  if(!inner) return "";
  return `<div class="pb-sec">${renderAreaHeader(areaKey, cls)}${inner}</div>`;
}

/* ============ moveList 区域模板 ============ */
function renderMoveListArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "moveList") return "";
  // boundMove：绑定动作未取得时整个区域不出现
  if(!boundMoveTaken(area)) return "";

  const customMoves = moveListCustomMoves(areaKey);
  const withCustom = g => ({...g, moves: (g.moves || []).concat(customMoves.filter(m => m.group === g.key))});
  let inner = "";

  // 模板 groups + 自定义 groups
  const groups = (area.groups || []).concat(moveListCustomGroups(areaKey));
  groups.forEach(g => { inner += renderMoveGroup(areaKey, withCustom(g), area); });

  // 无 group 的动作（模板 + 自定义）。所属分组已不存在的动作也归到这里，避免丢失
  const groupKeys = groups.map(g => g.key);
  let noGroup = (area.moves || []).concat(customMoves.filter(m => !m.group || !groupKeys.includes(m.group)));
  // 无分组：没有分组勾选框代表它们，covered 恒为 false
  if(mode === "view") noGroup = noGroup.filter(mv => moveVisibleInView(areaKey, mv, area, false));
  inner += noGroup.map(mv => renderMoveCard(areaKey, mv, area, false, false)).join("");

  // 全局按钮
  const globalButtons = (area.buttons || []).filter(btn => btn.position === "global");
  if(globalButtons.length && mode === "edit"){
    inner += `<div class="addrow">${globalButtons.map(btn => renderMoveButton(areaKey, btn)).join(" ")}</div>`;
  }

  if(!inner) return "";
  return `<div class="pb-sec">${renderAreaHeader(areaKey, cls)}${inner}</div>`;
}

function renderMoveGroup(areaKey, group, area){
  const moves = group.moves || [];
  const locked = groupLocked(group);
  const gSel = groupSelectable(group, area);
  const groupChecked = isMoveGroupSelected(areaKey, group);

  // 可见性：带勾选框的条目需已勾选，默认获得的常显
  let visible = moves;
  if(mode === "view"){
    if(gSel && !groupChecked) return "";
    visible = moves.filter(mv => moveVisibleInView(areaKey, mv, area, gSel));
  }
  // 空分组不显示（除非分组自己带勾选行，或编辑模式下有分组内按钮）
  const inGroupBtns = (area.buttons || []).filter(b => b.position === "inGroup" && (!b.targetGroup || b.targetGroup === group.key));
  if(!visible.length && !gSel && !(mode === "edit" && inGroupBtns.length)) return "";

  let html = "";

  // 分组标题：统一用 .adv-tier；带勾选框时多一个勾选框与可编辑名
  if(gSel){
    const name = esc(getMoveGroupName(areaKey, group));
    if(mode === "edit"){
      const delBtn = isCustomGroup(areaKey, group.key)
        ? `<button class="x" data-movelist-group-del="${areaKey}:${esc(group.key)}" title="删除">✕</button>` : "";
      html += `<div class="adv-tier sel${locked?" locked":""}"><input type="checkbox" class="chk" data-movelist-group="${areaKey}:${esc(group.key)}"${groupChecked?" checked":""}><input type="text" data-movelist-group-name="${areaKey}:${esc(group.key)}" value="${name}" placeholder="${esc(group.label||"")}">${delBtn}</div>`;
    } else {
      html += `<div class="adv-tier sel"><span class="ck-mark on"></span><span>${name}</span></div>`;
    }
  } else if(group.label){
    html += `<div class="adv-tier${locked?" locked":""}">${esc(group.label)}</div>`;
  }
  if(group.note) html += `<div class="adv-tier-note">${esc(group.note)}</div>`;

  // gSel 为真时分组勾选框已代表组内动作，组内动作不再各自出勾选框
  html += visible.map(mv => renderMoveCard(areaKey, mv, area, locked, gSel)).join("");

  if(inGroupBtns.length && mode === "edit"){
    html += `<div class="mv-add">${inGroupBtns.map(b => renderMoveButton(areaKey, b, group.key)).join(" ")}</div>`;
  }

  return html;
}

// 分组是否带勾选框：分组自身声明优先，否则取区域的 selectGroups
function groupSelectable(group, area){
  if(group.selectable !== undefined) return !!group.selectable;
  return !!area.selectGroups;
}
// 动作是否带勾选框：动作自身声明优先，带 replaces/requires 的动作本身即为选择项，
// 否则取区域的 selectMoves / viewSelect。
// covered 表示该动作已被所在分组的勾选框代表（选分组即选它），此时自己不再出勾选框；
// 反之——无分组、或分组不带勾选框——即使区域只开了 selectGroups 也得自己出一个，
// 否则这个动作既选不上也排不掉，等于绕过了选择机制。
function moveSelectable(move, area, covered){
  if(move.selectable !== undefined) return !!move.selectable;
  if(reqList(move).length || repList(move).length) return true;
  if(area.selectMoves || area.viewSelect) return true;
  return !!area.selectGroups && !covered;
}
// viewSelect：勾选框在查看模式下也可用，且未勾选的条目置灰而非隐藏
function viewSelectable(area){
  return !!area.viewSelect;
}
// 单个动作是否算「已取得」：自己有勾选框就看自己，被分组勾选框代表就看分组，
// 两者都没有即默认获得
function moveTaken(areaKey, area, move, covered, group){
  if(moveSelectable(move, area, covered)) return isMoveSelected(areaKey, move);
  if(covered) return isMoveGroupSelected(areaKey, group);
  return true;
}
// 某区域里有没有已取得的同名动作（需要分组上下文，不能用展平后的列表）
function areaMoveTaken(areaKey, area, name){
  const custom = moveListCustomMoves(areaKey);
  const groups = (area.groups || []).concat(moveListCustomGroups(areaKey));
  for(const g of groups){
    const gSel = groupSelectable(g, area);
    const moves = (g.moves || []).concat(custom.filter(m => m.group === g.key));
    for(const mv of moves){
      if(mv.name === name && moveTaken(areaKey, area, mv, gSel, g)) return true;
    }
  }
  const groupKeys = groups.map(g => g.key);
  const noGroup = (area.moves || []).concat(custom.filter(m => !m.group || !groupKeys.includes(m.group)));
  for(const mv of noGroup){
    if(mv.name === name && moveTaken(areaKey, area, mv, false, null)) return true;
  }
  return false;
}
// boundMove：该区域绑定的动作是否已在任何 moveList 区域里取得
function boundMoveTaken(area){
  const name = area.boundMove;
  if(!name) return true;
  const cls = getClass(char.classId);
  if(!cls) return false;
  for(const areaKey of Object.keys(AREAS)){
    const a = getAreaHeader(areaKey, cls);
    if(!a || a.type !== "moveList") continue;
    if(areaMoveTaken(areaKey, a, name)) return true;
  }
  return false;
}

// minLevel / maxLevel 对照的是 charInfo 里的等级字段。
// 字段名由规则自定，默认按 level 查（id 或 label 都行），
// 也可以用 group.levelField 指定别的字段。
function groupLevel(group){
  const key = group.levelField || "level";
  const v = fieldValueByKey(key, headerFor(getClass(char.classId)));
  return v === null ? null : v;
}
function groupLocked(group){
  if(group.minLevel === undefined && group.maxLevel === undefined) return false;
  const lvl = groupLevel(group);
  // 规则没声明对应字段时不锁，否则整组动作会凭空消失
  if(lvl === null) return false;
  if(group.minLevel !== undefined && lvl < group.minLevel) return true;
  if(group.maxLevel !== undefined && lvl > group.maxLevel) return true;
  return false;
}

// 查看模式下该动作是否出现：viewSelect 区域一律显示（未勾选置灰），
// 其余区域里带勾选框的需已勾选
function moveVisibleInView(areaKey, move, area, covered){
  if(viewSelectable(area)) return true;
  return !moveSelectable(move, area, covered) || isMoveSelected(areaKey, move);
}

function renderMoveCard(areaKey, move, area, locked, covered){
  return mode === "edit"
    ? mvCard(areaKey, move, area, locked, covered)
    : mvViewCard(areaKey, move, area, covered);
}

function mvCard(areaKey, move, area, locked, covered){
  const key = moveKey(areaKey, move);
  const selectable = moveSelectable(move, area, covered);
  const checked = isMoveSelected(areaKey, move);
  // requires 未满足或所在分层锁定时禁用（requires 按动作名引用）
  const chosenNames = selectedMoveNames(areaKey);
  const unmet = reqList(move).some(r => !chosenNames.includes(r));
  const disabled = locked || unmet;

  const req = reqList(move).map(r => `<span class="req">需:${esc(r)}</span>`).join("");
  const rep = repList(move).map(r => `<span class="req">替:${esc(r)}</span>`).join("");

  const box = selectable
    ? `<input type="checkbox" class="chk" data-movelist-toggle="${areaKey}:${esc(moveSelKey(move))}"${checked?" checked":""}${disabled?" disabled":""}>`
    : "";
  const delBtn = move.id ? `<button class="del" data-movelist-del="${esc(key)}" title="删除">✕</button>` : "";
  // viewSelect 区域里未勾选的条目置灰
  const off = (selectable && viewSelectable(area) && !checked) ? " spell-off" : "";

  const header = `<div class="mv-h">${box}<div class="mv-n"><input data-movelist-name="${esc(key)}" value="${esc(moveName(areaKey, move))}">${req}${rep}</div>${delBtn}</div>`;
  const textHtml = `<div class="mv-t"><textarea data-movelist-text="${esc(key)}">${esc(moveText(areaKey, move))}</textarea></div>`;

  return `<div class="mv ${move.id?"mv-custom":""}${disabled?" disabled":""}${off}"${move.id?"":mvBarStyle(areaKey)}>${header}${textHtml}</div>`;
}

function mvViewCard(areaKey, move, area, covered){
  const selectable = moveSelectable(move, area, covered);
  const checked = isMoveSelected(areaKey, move);
  // viewSelect：查看模式仍给出可点的勾选框，未勾选的置灰
  if(selectable && viewSelectable(area)){
    const off = checked ? "" : " spell-off";
    return `<div class="mv${off}"${mvBarStyle(areaKey)}><div class="mv-h"><input type="checkbox" class="chk" data-movelist-toggle="${areaKey}:${esc(moveSelKey(move))}"${checked?" checked":""}><div class="mv-n">${esc(moveName(areaKey, move))}</div></div><div class="mv-t">${renderMoveText(areaKey, move)}</div></div>`;
  }
  // 不带勾选框的动作不显示勾选标记
  const markHtml = selectable ? `<span class="ck-mark on"></span>` : "";
  return `<div class="mv"${mvBarStyle(areaKey)}><div class="mv-h">${markHtml}<div class="mv-n">${esc(moveName(areaKey, move))}</div></div><div class="mv-t">${renderMoveText(areaKey, move)}</div></div>`;
}

// 名称与正文：内置条目也可编辑，覆盖值按 区域::id或原名 存入角色数据
function moveEditKey(areaKey, move){ return `${areaKey}::${move.id || move.name}`; }
function moveName(areaKey, move){
  const k = moveEditKey(areaKey, move);
  const v = char.moveListNames && char.moveListNames[k];
  return v !== undefined ? v : (move.name || "");
}
function moveText(areaKey, move){
  const k = moveEditKey(areaKey, move);
  const v = char.moveListTexts && char.moveListTexts[k];
  return v !== undefined ? v : (move.text || "");
}
// 查看模式正文：支持 [ ] 勾选框
function renderMoveText(areaKey, move){
  const k = moveEditKey(areaKey, move);
  return renderFieldMarkdown(moveText(areaKey, move), "movelist::"+k,
    () => moveText(areaKey, move),
    t => { if(!char.moveListTexts) char.moveListTexts = {}; char.moveListTexts[k] = t; });
}

function renderMoveButton(areaKey, btn, groupKey){
  const action = `${areaKey}:${btn.action}:${btn.targetGroup || groupKey || ""}`;
  return `<button data-movelist-action="${esc(action)}">＋ ${esc(btn.label)}</button>`;
}

// moveList 辅助函数
function moveKey(areaKey, move){
  if(move.id) return `${areaKey}:${move.id}`;
  return `${areaKey}:${move.name}`;
}

function isCustomGroup(areaKey, groupKey){
  return moveListCustomGroups(areaKey).some(g => g.key === groupKey);
}

// moveList 选中状态：统一存储在 char.moveListSelections[areaKey]
function moveListSelections(areaKey){
  if(!char.moveListSelections) char.moveListSelections = {};
  if(!char.moveListSelections[areaKey]) char.moveListSelections[areaKey] = [];
  return char.moveListSelections[areaKey];
}

// 选中状态的键：自定义动作用它自带的 id（天然唯一），内置动作用动作名
// （replaces / requires 都按动作名引用，内置动作必须保持名字作键）
function moveSelKey(move){ return move.id || move.name; }

function isMoveSelected(areaKey, move){
  return moveListSelections(areaKey).includes(moveSelKey(move));
}

// 某区域已勾选动作的名字（requires / replaces / boundMove 都按名字引用）
function selectedMoveNames(areaKey){
  const sel = moveListSelections(areaKey);
  return collectMovesInArea(areaKey).filter(m => sel.includes(moveSelKey(m))).map(m => m.name);
}

function isMoveGroupSelected(areaKey, group){
  return moveListSelections(areaKey).includes(group.key);
}

function getMoveGroupName(areaKey, group){
  if(!char.moveListGroupNames) char.moveListGroupNames = {};
  const key = `${areaKey}::${group.key}`;
  return char.moveListGroupNames[key] !== undefined ? char.moveListGroupNames[key] : (group.label || "");
}


function renderRightStat(stat, cls) {
  // char 值优先，0/空则回退到公式默认值
  const cur = char.fields[stat.key];
  const val = cur || defaultStatValue(stat.key, cls);

  let html = `${esc(stat.label)} `;

  if (stat.type === "display") {
    html += `<b>${esc(val)}</b>`;
  } else if (mode === "edit") {
    const type = stat.type === "number" ? "number" : "text";
    html += `<input type="${type}" data-field="field:${esc(stat.key)}" value="${esc(val)}"${boundsAttr(stat)}>`;
  } else {
    html += `<b>${esc(val)}</b>`;
  }

  if (stat.formula) html += ` <span class="faint">${formulaHint(stat.formula, stat.key)}</span>`;

  return html;
}

function renderClassSelect(){
  const el=document.getElementById("classSelect");
  el.innerHTML = [`<option value="">—— 选择${esc(getClassLabel())} ——</option>`]
    .concat(mergedClasses().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join("");
  el.value=char.classId||"";
}

function renderPlaybook(){
  const root=document.getElementById("playbook");
  boxReg = {};
  const cls=getClass(char.classId);
  const btnMode=document.getElementById("btnMode");
  btnMode.textContent = mode==="edit" ? "👁 查看模式" : "✏️ 编辑模式";
  btnMode.classList.toggle("view", mode==="view");
  if(!cls){ root.innerHTML=`<div class="empty">↑ 在左上角选择一个${esc(getClassLabel())}开始车卡</div>`; return; }
  const col = keys => keys.map(k => renderArea(k, cls)).join("");
  root.innerHTML =
    renderHeader(cls) +
    `<div class="pb-cols">
      <div class="pb-left">${col(AREA_LAYOUT.left)}</div>
      <div class="pb-right">${col(AREA_LAYOUT.right)}</div>
    </div>`;
  autosizeAll();
  autosizeBlanks();
}

// 区域路由：根据 type 字段选择渲染器
function renderArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  const fn = area && AREA_RENDERERS[area.type];
  return fn ? fn(areaKey, cls) : "";
}
const AREA_RENDERERS = {
  plain: renderPlainArea,
  moveList: renderMoveListArea,
  fillbox: renderFillboxArea,
  bonds: renderBondsArea,
  heritage: renderHeritageArea,
};

/* ============ 页首：charInfo / stats / metrics ============ */
// 页首布局固定（不参与 areaLayout），但三个区块的内容全由 header 声明
function renderHeader(cls){
  const header = headerFor(cls);
  return `<div class="pb-head">
    <div class="pb-class">${esc(cls.name)}</div>
    ${renderCharInfo(header)}
  </div>
  <div class="pb-stats">
    ${renderStatsBlock(header)}
    ${renderMetricsBlock(header)}
  </div>`;
}

// 字段是否可改：编辑模式一律可改，查看模式只认 view:"editable"
function fieldEditable(f){ return mode === "edit" || f.view === "editable"; }

function renderCharInfo(header){
  if(!header.charInfo.length) return "";
  const items = header.charInfo.map(f => {
    const raw = char.fields[f.id];
    const val = raw === undefined || raw === "" ? fieldSeed(f) : raw;
    // flex 是基准宽的倍数：写 2 就是两倍宽，不写即一倍
    const n = parseFloat(f.flex);
    const w = (n > 0 && f.type !== "track")
      ? ` style="width:calc(var(--info-w) * ${n})"` : "";
    const cls = f.type === "track" ? "it it-track" : "it";
    return `<div class="${cls}"${w}><span class="k">${esc(f.label || f.id)}</span>${renderFieldControl(f, val)}</div>`;
  }).join("");
  return `<div class="pb-info">${items}</div>`;
}

// 带步进箭头的数字框。target 形如 "field:xp" 或 "stat:STR"。
// 等级、XP、护甲这类值多是 ±1 变化，点箭头比重填一遍方便。
function numberControl(f, val, target){
  const btn = (dir, label) =>
    `<button type="button" data-field-step="${esc(target)}:${dir}" title="${dir > 0 ? "+1" : "-1"}">${label}</button>`;
  return `<span class="num-wrap">`
    + `<input type="number" data-field="${esc(target)}" value="${esc(val)}"${numBounds(f)}>`
    + `<span class="num-step">${btn(1, "▲")}${btn(-1, "▼")}</span></span>`;
}

// charInfo 与 metrics 共用的字段控件：text / number / select / track
function renderFieldControl(f, val){
  if(f.type === "track") return renderFieldTrack(f, val);
  if(!fieldEditable(f)) return `<span class="v">${esc(val === "" ? "—" : val)}</span>`;

  const bind = `data-field="field:${esc(f.id)}"`;
  if(f.type === "number"){
    return numberControl(f, val, `field:${f.id}`);
  }
  if(f.type === "select"){
    // 下拉只提供候选，输入框照旧可以填任意值
    const opts = (f.options || []).map(o =>
      `<button type="button" class="sel-opt" data-field-pick="${esc(f.id)}" data-val="${esc(o)}">${esc(o)}</button>`).join("");
    return `<span class="sel-wrap">`
      + `<input ${bind} value="${esc(val)}" placeholder="${esc(f.tip || "")}">`
      + `<button type="button" class="sel-caret" data-field-menu="${esc(f.id)}" title="选择">▼</button>`
      + `<span class="sel-menu hidden">${opts}</span></span>`;
  }
  return `<input ${bind} value="${esc(val)}" placeholder="${esc(f.tip || "")}">`;
}

function renderFieldTrack(f, val){
  const slots = Math.max(0, parseInt(f.slots, 10) || 0);
  if(!slots) return "";
  const dis = fieldEditable(f) ? "" : " disabled";
  const cells = Array.from({length:slots}, (_, i) =>
    `<button type="button" class="trc${i < (val||0) ? " on" : ""}" data-field-track="${esc(f.id)}:${i}"${dis}></button>`).join("");
  return `<div class="track">${cells}</div>`;
}

function renderStatsBlock(header){
  const cfg = header.stats;
  if(!cfg.items.length) return "<div></div>";
  const prompt = cfg.prompt ? `<div class="stat-prompt">${esc(cfg.prompt)}</div>` : "";
  const cards = cfg.items.map(item => renderStatCard(item, header)).join("");
  // 没有 boundStat 的状态不归属任何属性，另起一行横排，超宽自动换行
  const loose = cfg.conditions.filter(c => c.boundStat === undefined)
    .map(c => renderConditionBtn(c)).join("");
  const looseHtml = loose ? `<div class="loose-conditions">${loose}</div>` : "";
  return `<div class="stat-block">${prompt}<div class="stat-grid">${cards}</div>${looseHtml}</div>`;
}

function renderStatCard(item, header){
  const value = statValue(item.id, header);
  const em = fmtMod(effModOf(item, header));
  // score 类属性数值与调整值分两行；modifier 类属性本身就是调整值，只有一行
  const isMod = item.type !== "score";
  const val = mode === "edit"
    ? numberControl(item, value, `stat:${item.id}`)
    : `<div class="v"${isMod ? ` data-mod="${esc(item.id)}"` : ""}>${isMod ? em : esc(value)}</div>`;
  const modRow = isMod ? "" : `<div class="m" data-mod="${esc(item.id)}">${em}</div>`;
  const conds = boundConditions(item, header).map(c => renderConditionBtn(c)).join("");
  return `<div class="stat-card"><div class="n">${esc(item.label || item.id)}</div>${val}${modRow}${conds}</div>`;
}

// 状态按钮：点一次进下一档，到顶回 0。
// 默认用画出来的圆表示档位（0 空心 → 满档实心），
// 规则显式写了 symbols 时改用字符——那种场合多半不是渐进语义。
function renderConditionBtn(c){
  const st = char.states[c.id] || 0;
  const n = stateCount(c);
  const syms = Array.isArray(c.symbols) && c.symbols.length >= n ? c.symbols : null;
  const mark = syms
    ? `<span class="cond-mark cond-sym">${esc(syms[st])}</span>`
    : `<span class="cond-mark" style="--fill:${Math.round(st / (n - 1) * 100)}%"></span>`;
  return `<button type="button" class="cond${st ? " on" : ""}" data-state="${esc(c.id)}" data-m="${st}" title="${esc(c.label || c.id)}">${mark} ${esc(c.label || c.id)}</button>`;
}

function renderMetricsBlock(header){
  const cfg = header.metrics;
  if(!cfg.fields.length) return "";
  const fields = cfg.fields.map(f => {
    const hint = f.formula ? `<div class="formula">${formulaHint(f.formula, f.id)}</div>` : "";
    return `<div class="metric-field"><div class="k">${esc(f.label || f.id)}</div>${renderMetricControl(f)}${hint}</div>`;
  }).join("");
  return `<div class="metrics-grid" style="grid-template-columns:repeat(${esc(cfg.columns)},minmax(var(--metric-w),max-content))">${fields}</div>`;
}

// 与 charInfo 的区别：空值回退到公式或 default 算出的默认值，
// 这样职业给了 hpMax 公式、角色还没填时也显示算好的数
function renderMetricControl(f){
  return renderFieldControl(f, shownFieldValue(f, f.id));
}

function formulaHint(txt, setter){
  if(!txt) return "";
  const body = esc(txt);
  if(setter && mode==="edit"){
    return `<span class="formula-hint">（<button type="button" class="formula-link" data-setformula="${esc(setter)}" title="设为默认值">${body}</button>）</span>`;
  }
  return `<span class="formula-hint">（${body}）</span>`;
}

/* ============ fillbox / bonds / heritage 区域模板 ============ */
// 这三类区域的角色数据统一按 areaKey 存放，于是同一 type 可以有任意多个区域
function areaData(areaKey, init){
  if(!char.areaData) char.areaData = {};
  if(!char.areaData[areaKey]) char.areaData[areaKey] = init;
  return char.areaData[areaKey];
}

// 计数器行：declared 为数据声明的固定项（名字只读），extra 为玩家自行添加的（名字可改）
// 计数器在两种模式下都保持可编辑——查看模式才是实际用它计数的场合
function renderCounters(areaKey, declared, data){
  const rows = (declared || []).map(c => {
    const v = (data.counters[c.key] !== undefined) ? data.counters[c.key] : (c.value || 0);
    return `<div class="bond-line fixed"><span class="cnt-name">${esc(c.label || c.key)}</span><input type="number" class="coins-input" data-area="cnt:${areaKey}:${esc(c.key)}" value="${v}" min="0"></div>`;
  });
  (data.extra || []).forEach((c, i) => {
    rows.push(`<div class="bond-line"><input data-area="xname:${areaKey}:${i}" value="${esc(c.name||"")}" placeholder="计数器名"><input type="number" class="coins-input" data-area="xval:${areaKey}:${i}" value="${c.value||0}" min="0"><button class="x" data-area="xdel:${areaKey}:${i}" title="删除">✕</button></div>`);
  });
  return rows.length ? `<div class="counters">${rows.join("")}</div>` : "";
}

// fillbox：一个大文本框，可挂选项组（点 ＋ 追加进文本框）、计数器、提示句
function renderFillboxArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "fillbox") return "";
  const data = areaData(areaKey, {text:"", counters:{}, extra:[]});
  if(!data.counters) data.counters = {};

  const counters = renderCounters(areaKey, area.counters, data);
  // 「＋ 计数器」两种模式都给出，与计数器本身一致
  const addCounter = area.addCounter
    ? `<div class="addrow counters-add"><button data-area="xadd:${areaKey}">＋ 计数器</button></div>` : "";

  const opts = (mode === "edit" ? (area.options || []) : []).map(g =>
    `<div class="gear-group"><div class="gear-prompt md">${markdownToHtml(g.prompt||"")}</div>` +
    (g.options||[]).map(o => {
      const txt = stripTags(o);
      return `<div class="opt"><button class="gear-add" data-area="opt:${areaKey}:${esc(txt)}" title="加入">＋</button> <span>${esc(txt)}</span></div>`;
    }).join("") + `</div>`).join("");

  const hints = (area.hints || []).map(h => `<div class="question-hint">${markdownToHtml(h)}</div>`).join("");

  return `<div class="pb-sec">${renderAreaHeader(areaKey, cls)}${counters}${addCounter}<textarea class="fillbox" data-area="text:${areaKey}">${esc(data.text||"")}</textarea>${opts}${hints}</div>`;
}

// bonds：若干可增删的文本行，可挂「关系」（目标 + 描述 + 深度轨道）
function renderBondsArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "bonds") return "";
  const data = areaData(areaKey, {lines:(area.lines||[]).slice(), relations:[]});
  if(!data.lines) data.lines = [];
  if(!data.relations) data.relations = [];

  const label = area.title || "";
  const depth = area.relationDepth || 3;
  const rels = area.relations ? (mode === "edit"
    ? data.relations.map((r,i)=>`<div class="bond-line rel">
        <input data-area="rtarget:${areaKey}:${i}" value="${esc(r.target||"")}" placeholder="关系目标">
        <input data-area="rdesc:${areaKey}:${i}" value="${esc(r.description||"")}" placeholder="关系描述">
        <span class="rel-depth">${Array.from({length:depth},(_,d)=>`<button type="button" class="trc${d<(r.depth||0)?" on":""}" data-area="rdepth:${areaKey}:${i}:${d}"></button>`).join("")}</span>
        <button class="x" data-area="rdel:${areaKey}:${i}" title="删除">✕</button></div>`).join("")
    : data.relations.filter(r=>r.target).map(r=>`<div class="bond-line"><b>${esc(r.target)}</b>${r.description?` <span class="faint">${esc(r.description)}</span>`:""} <span class="rel-depth-v">${Array.from({length:depth},(_,d)=>(r.depth||0)>d?"●":"○").join("")}</span></div>`).join("")
  ) : "";

  if(mode === "view"){
    const lines = data.lines.map((b,i)=>b?`<div class="bond-line md">${renderFieldMarkdown(b, "bond::"+areaKey+"::"+i, ()=>data.lines[i]||"", t=>{data.lines[i]=t;})}</div>`:"").join("");
    return `<div class="pb-sec">${renderAreaHeader(areaKey, cls)}${rels}${lines||`<div class="hint">无${esc(label)}</div>`}</div>`;
  }
  const lines = data.lines.map((b,i)=>`<div class="bond-line"><input data-area="bond:${areaKey}:${i}" value="${esc(b)}" placeholder="${esc(label)}"><button class="x" data-area="bdel:${areaKey}:${i}" title="删除">✕</button></div>`).join("");
  const btns = [`<button data-area="badd:${areaKey}">＋ ${esc(label)}</button>`];
  if(area.relations) btns.push(`<button data-area="radd:${areaKey}">＋ 关系</button>`);
  return `<div class="pb-sec">${renderAreaHeader(areaKey, cls)}${rels}${lines}<div class="addrow">${btns.join("")}</div></div>`;
}

// heritage：一组格子 + 等量的文本行 + 一张说明卡，可整区折叠
function renderHeritageArea(areaKey, cls){
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "heritage") return "";
  const data = areaData(areaKey, {boxes:[], moves:[], upgraded:false, hidden:false});
  if(!data.boxes) data.boxes = [];
  if(!data.moves) data.moves = [];

  const toggle = `<button type="button" class="h-toggle" data-area="hide:${areaKey}" title="显示 / 隐藏">${data.hidden ? "显示" : "隐藏"}</button>`;
  const hdr = renderAreaHeader(areaKey, cls, toggle);
  if(data.hidden) return `<div class="pb-sec">${hdr}</div>`;

  const n = data.upgraded ? (area.boxesUpgraded || area.boxes || 0) : (area.boxes || 0);
  const boxes = Array.from({length:n}, (_,i) =>
    `<label class="heritage-box"><input type="checkbox" class="chk" data-area="hbox:${areaKey}:${i}"${data.boxes[i]?" checked":""}></label>`).join("");
  const lines = Array.from({length:n}, (_,i) => mode === "edit"
    ? `<div class="bond-line"><input data-area="hmove:${areaKey}:${i}" value="${esc(data.moves[i]||"")}" placeholder="${esc(area.movePlaceholder||"")}"></div>`
    : `<div class="bond-line md">${renderFieldMarkdown(data.moves[i]||"", "heritage::"+areaKey+"::"+i, ()=>data.moves[i]||"", t=>{data.moves[i]=t;})}</div>`).join("");

  const card = [];
  if(area.description) card.push(markdownToHtml(area.description));
  if(area.upgradePrompt) card.push(markdownToHtml(area.upgradePrompt));
  if(area.upgradeEffect){
    card.push(`<p class="heritage-up"><input type="checkbox" class="chk" data-area="hup:${areaKey}"${data.upgraded?" checked":""}${mode==="view"?" disabled":""}>${inlineMarkdown(area.upgradeEffect)}</p>`);
  }
  const cardHtml = card.length ? `<div class="mv"${mvBarStyle(areaKey)}><div class="mv-t">${card.join("")}</div></div>` : "";
  return `<div class="pb-sec">${hdr}<div class="heritage-boxes">${boxes}</div>${lines}${cardHtml}</div>`;
}

/* ============ 参考资料边栏 ============ */
function renderRefTabs(){
  const tabs = document.getElementById("refTabs");
  if(!tabs) return;
  tabs.innerHTML = REF_SECTIONS.map(s =>
    `<button class="ref-tab ${s.id===refTab?"active":""}" data-ref-tab="${esc(s.id)}">${esc(s.title)}</button>`
  ).join("");
}
function renderRef(){
  const panel = document.getElementById("refPanel");
  const cols = document.getElementById("mainCols");
  // 规则没声明 refSections 就没有边栏，不拿占位内容充数
  const show = REF_SECTIONS.length > 0;
  if(panel) panel.classList.toggle("hidden", !show);
  if(cols) cols.classList.toggle("no-ref", !show);
  if(!show) return;

  renderRefTabs();
  const body = document.getElementById("refBody");
  lastSearchItems = [];
  if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
    body.innerHTML = '<div class="ref-empty">未加载规则。</div>';
    return;
  }
  const sec = REF_SECTIONS.find(s => s.id === refTab);
  if(!sec){
    body.innerHTML = '';
    return;
  }
  
  if(sec.type === "search"){
    body.innerHTML = renderRefSearch(searchKw);
  } else if(sec.type === "moves"){
    body.innerHTML = renderRefMoves(sec);
  } else if(sec.type === "tags"){
    body.innerHTML = renderRefTags(sec);
  } else {
    body.innerHTML = '<div class="ref-empty">未知类型。</div>';
  }
}

function refSectionData(sectionId){
  return (DW_DATA.reference && DW_DATA.reference[sectionId]) || {};
}

function renderRefMoves(sec){
  const data = refSectionData(sec.id);
  if(!data.moves && !data.groups) return '<div class="ref-empty">暂无内容。</div>';
  
  let html = "";
  
  // 顶层 moves
  html += renderMovesList(data.moves || [], sec, sec);
  
  // groups：组标题可点开合，默认展开
  for(const g of (data.groups || [])){
    const inner = renderMovesList(g.moves || [], g, sec);
    html += g.title ? `<details class="ref-grp" open><summary>${esc(g.title)}</summary>${inner}</details>` : inner;
  }
  
  return html || '<div class="ref-empty">暂无内容。</div>';
}

function renderMovesList(moves, context, sec){
  return moves.map(m => {
    if(typeof m === "string") return `<div class="md">${markdownToHtml(m)}</div>`;
    return refMoveCard(createMoveItem(m, context, sec));
  }).join("");
}

function createMoveItem(move, context, sec){
  return {
    kind: move.importArea || context.importArea || sec.importArea || null,
    name: move.name,
    html: move.text,
    source: context.title || sec.title,
    group: move.importGroup || context.importGroup || sec.importGroup || null
  };
}

function renderRefTags(sec){
  const data = refSectionData(sec.id);
  if(!data.tags && !data.groups) return '<div class="ref-empty">未定义标签</div>';
  
  let html = "";
  
  // 顶层 tags
  if(data.tags && data.tags.length){
    html += `<details class="ref-grp" open><summary>标签</summary>${data.tags.map(tagItemHtml).join("")}</details>`;
  }
  
  // groups
  for(const g of (data.groups || [])){
    html += `<details class="ref-grp" open><summary>${esc(g.title)}</summary>${(g.tags || []).map(tagItemHtml).join("")}</details>`;
  }
  
  return html || '<div class="ref-empty">未定义标签</div>';
}

function refDetailsState(){
  const body = document.getElementById("refBody");
  return body ? [...body.querySelectorAll("details")].map(d => d.open) : [];
}
function restoreRefDetails(state){
  const body = document.getElementById("refBody");
  if(!body) return;
  [...body.querySelectorAll("details")].forEach((d, i) => { if(i < state.length) d.open = state[i]; });
