<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地城世界 · 车卡工具</title>
<style>
:root{
  /* ===== 主题配色：改这里即可整体换肤 ===== */
  /* 应用外壳（背景/工具栏） */
  --bg:#20242c; --panel:#262b35; --panel2:#2d3340; --panel3:#38404e; --line:#3d4554;
  --text:#e8eaf0; --muted:#98a2b3;
  --accent:#c8a24b; --accent-hover:#d7b25e; --accent-ink:#1a1408;
  --accent2:#5b8def; --accent2-dim:#2c3a4d; --accent2-ink:#cfe0f5; --accent2-line:#3d5470;
  /* 角色卡纸面 */
  --paper:#ffffff; --paper-2:#fafbfc; --ink:#1a1d24;
  --ink-2:#333333; --ink-3:#555555; --ink-4:#777777; --ink-5:#999999;
  --paperline:#cfd4dd;
  --line-2:#9aa; --line-3:#bbb; --line-4:#ccc; --line-5:#ddd;
  --warn:#b06a1a; --danger:#c0392b; --danger-bg:#fdecea;
  --tag-bg:#eee3c8; --tag-ink:#8a6a20; --on-ink:#ffffff;
  /* 资料边栏（默认跟随纸面，可单独覆盖以区别于角色卡） */
  --ref-paper:var(--paper); --ref-ink:var(--ink);
  --ref-ink-2:var(--ink-2); --ref-ink-3:var(--ink-3); --ref-ink-4:var(--ink-4); --ref-ink-5:var(--ink-5);
  --ref-paperline:var(--paperline); --ref-line-4:var(--line-4); --ref-line-5:var(--line-5);
  /* 动作左侧色条：按来源填色可区分（默认透明 = 不显示） */
  --bar-race:transparent; --bar-align:transparent; --bar-start:transparent; --bar-adv:transparent;
  --bar-custom:transparent; --bar-spell:transparent; --bar-compendium:transparent;
}
*{box-sizing:border-box}
input,select,textarea,button{font-family:inherit}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.55}

/* ===== 工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.toolbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
.toolbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;max-width:180px}
.toolbar .spacer{flex:1}
.toolbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.toolbar button:hover{background:var(--panel3)}
.toolbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.toolbar button.primary:hover{background:var(--accent-hover)}
.toolbar button.mode-btn{background:var(--accent2);color:var(--on-ink);border-color:var(--accent2);font-weight:600}

/* ===== 规则栈面板 ===== */
.rules-panel{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.rules-panel.hidden{display:none}
.rules-panel-head{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.rules-list{display:flex;flex-direction:column;gap:4px}
.rule-layer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.rule-layer-name{flex:1;color:var(--text);word-break:break-all}
.rule-tag{font-size:10px;color:var(--accent2);border:1px solid var(--accent2);border-radius:4px;padding:0 5px;white-space:nowrap}
.rule-layer .xbtn{flex:none}
.rules-actions{display:flex;gap:8px}
.rules-actions button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
.rules-actions button:hover{background:var(--panel3)}
.toolbar button.mode-btn.view{background:var(--accent2-dim);color:var(--accent2-ink);border-color:var(--accent2-line)}

/* ===== 主体 ===== */
.wrap{max-width:1440px;margin:0 auto;padding:18px 14px 60px}
.main-cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:1120px){.main-cols{grid-template-columns:1fr}}
.playbook{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px 22px;min-height:600px;box-shadow:0 4px 24px rgba(0,0,0,.4)}

/* ===== 参考资料边栏 (浅色) ===== */
.ref{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--ref-paper);border:1px solid var(--ref-line-4);border-radius:8px;display:flex;flex-direction:column}
.ref-tabs{display:flex;border-bottom:1px solid var(--ref-paperline);position:sticky;top:0;background:var(--ref-paper);z-index:5}
.ref-tab{flex:1;background:transparent;color:var(--ref-ink-4);border:none;padding:9px 4px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
.ref-tab.active{color:var(--ref-ink);border-bottom-color:var(--accent);font-weight:600}
.ref-body{padding:12px 14px}
.ref-empty{color:var(--ref-ink-4);font-size:12.5px;text-align:center;padding:30px 10px}
.ref-sec{font-size:12.5px;font-weight:700;color:var(--ref-ink);margin:14px 0 6px;letter-spacing:.5px;border-bottom:1px solid var(--ref-paperline);padding-bottom:3px}
.ref-sec:first-child{margin-top:0}
.ref-intro{font-size:12px;color:var(--ref-ink-2);margin-bottom:8px}
.rmv{border:1px solid var(--ref-line-4);border-radius:6px;margin-bottom:7px;background:var(--ref-paper);position:relative}
.rmv summary{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ref-ink);list-style:none}
.rmv summary::before{content:"▸";color:var(--ref-ink-4);font-size:10px;flex:none}
.rmv[open] summary::before{content:"▾"}
.rmv summary::-webkit-details-marker{display:none}
.rmv summary .src{font-size:10.5px;font-weight:400;color:var(--ref-ink-4);margin-left:auto;white-space:nowrap}
.rmv .rmv-b{margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11px;border:1px solid var(--accent);color:var(--tag-ink);background:transparent;cursor:pointer}
.rmv .rmv-b:hover{background:var(--accent);color:var(--accent-ink)}
.rmv .rmv-t{padding:6px 9px 8px;font-size:12px;color:var(--ref-ink-2);border-top:1px solid var(--ref-paperline)}
.rmv .rmv-foot{padding:0 9px 8px;text-align:right}
.rmv .rmv-t p{margin:3px 0}
.rmv .rmv-t ul{margin:3px 0;padding-left:18px}
.rmv .rmv-t .tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:3px;padding:0 4px;font-size:11px}
.ref-search{width:100%;background:var(--ref-paper);color:var(--ref-ink);border:1px solid var(--ref-line-5);border-radius:6px;padding:7px 9px;font-size:13px;margin-bottom:4px}
.ref-spell-group{margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--ref-ink-3)}
.ref-spell-list{border:1px solid var(--ref-line-4);border-radius:6px;margin-bottom:10px;background:var(--ref-paper)}
.ref-spell-list summary{display:flex;align-items:center;gap:6px;padding:10px 12px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ref-ink);list-style:none}
.ref-spell-list summary::before{content:"▸";color:var(--ref-ink-4);font-size:11px;flex:none}
.ref-spell-list[open] summary::before{content:"▾"}
.ref-spell-list summary::-webkit-details-marker{display:none}
.ref-spell-list .ref-spell-inner{padding:0 12px 10px}

/* ===== 页头 ===== */
.pb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.pb-class{font-size:26px;font-weight:800;letter-spacing:1px;line-height:1.1}
.pb-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.pb-info{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
.pb-info .it{display:flex;flex-direction:column;min-width:56px}
.pb-info .it .k{font-size:10px;color:var(--ink-4)}
.pb-info .it .v{font-size:16px;font-weight:700}
.pb-info input{background:transparent;border:none;border-bottom:1px dashed var(--ink-5);font-size:16px;font-weight:700;color:var(--ink);width:64px;text-align:left}

/* ===== 数值 ===== */
.pb-stats{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:12px}
.stat-dist{position:absolute;top:0;left:0;font-size:11px;color:var(--ink-5);line-height:1.2;white-space:nowrap}
.pb-statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pb-stat{text-align:center}
.pb-stat .n{font-size:13px;color:var(--ink-3);border-bottom:1px solid var(--paperline);padding-bottom:1px}
.pb-stat .v{font-size:24px;font-weight:800}
.pb-stat .m{font-size:15px;font-weight:700;color:var(--ink-2)}
.pb-stat .deb{display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-4);margin-top:2px;cursor:pointer}
.pb-stat .deb .chk{width:13px;height:13px;border-width:1.2px;border-radius:2px}
.pb-stat .deb .chk:checked::after{font-size:9px}
.pb-stat input{width:100%;border:none;border-bottom:1px dashed var(--ink-5);text-align:center;font-size:24px;font-weight:800;background:transparent;color:var(--ink)}
.pb-stat input[type=number],.pb-num input[type=number],.h3r input[type=number],input[data-bind=coins]{-moz-appearance:textfield;appearance:textfield}
.pb-stat input[type=number]::-webkit-outer-spin-button,.pb-stat input[type=number]::-webkit-inner-spin-button,
.pb-num input[type=number]::-webkit-outer-spin-button,.pb-num input[type=number]::-webkit-inner-spin-button,
.h3r input[type=number]::-webkit-outer-spin-button,.h3r input[type=number]::-webkit-inner-spin-button,
input[data-bind=coins]::-webkit-outer-spin-button,input[data-bind=coins]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pb-nums{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;min-width:190px}
.pb-num{text-align:center;border:1px solid var(--line-3);border-radius:4px;padding:4px 6px}
.pb-num .k{font-size:12px;color:var(--ink-3)}
.pb-num .v{font-size:22px;font-weight:800}
.pb-num input{width:68px;border:none;border-bottom:1px dashed var(--ink-5);text-align:center;font-size:22px;font-weight:800;background:transparent;color:var(--ink)}
.pb-num .formula{font-size:10px;color:var(--ink-5);margin-top:1px}
.formula-link{margin:0;padding:0;border:none;background:none;color:inherit;font:inherit;text-decoration:none;cursor:pointer}
.formula-link:hover{color:var(--accent);text-decoration:underline}

/* ===== 两栏 ===== */
.pb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.pb-cols{grid-template-columns:1fr}}
.pb-sec{margin-bottom:12px}
.pb-sec h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pb-sec h3 small{font-weight:400;color:var(--ink-4);font-size:10px;text-transform:none;margin-left:4px}
.pb-sec h3 .h3r{font-weight:400;font-size:11px;color:var(--ink-5);text-transform:none;letter-spacing:0;white-space:nowrap}
.pb-sec h3 .h3r input{border:1px solid var(--line-5);border-radius:3px;padding:1px 3px;font-size:12px;background:var(--paper);color:var(--ink);width:52px;text-align:center}
.pb-sec h3 .h3r b{color:var(--ink);font-weight:700}

/* ===== 动作卡 ===== */
.mv{border:1px solid var(--line-2);border-radius:4px;padding:7px 9px;margin-bottom:7px;background:var(--paper);position:relative}
.mv.disabled{opacity:.45}
/* 动作左侧色条（--bar 由来源 class 或内联样式指定） */
.mv::before,.rmv::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--bar,transparent);border-radius:3px 0 0 3px;pointer-events:none}
.mv-race{--bar:var(--bar-race)}
.mv-align{--bar:var(--bar-align)}
.mv-start{--bar:var(--bar-start)}
.mv-adv{--bar:var(--bar-adv)}
.mv-custom{--bar:var(--bar-custom)}
.mv-spell{--bar:var(--bar-spell)}
.mv-compendium{--bar:var(--bar-compendium)}
.mv .mv-h{display:flex;align-items:flex-start;gap:6px}
.mv .mv-h .chk{flex:none;margin-top:3px}
.mv .mv-n{font-weight:700;font-size:13px;flex:1}
.mv .mv-n.look-h{font-size:12px}
.mv .mv-n input{width:100%;border:none;border-bottom:1px dashed transparent;background:transparent;font-weight:700;font-size:13px;color:var(--ink)}
.mv .mv-n input:focus{border-bottom-color:var(--accent);outline:none}
.mv .mv-t{font-size:12px;color:var(--ink-2);margin-top:3px}
.mv .mv-t textarea{width:100%;border:1px solid var(--line-5);border-radius:3px;background:var(--paper-2);font-size:12px;min-height:34px;padding:5px 7px;resize:none;overflow:hidden;font-family:inherit;color:var(--ink);line-height:1.5}
.mv .req{font-size:10px;color:var(--warn);font-weight:400;margin-left:6px;white-space:nowrap}
.mv .mv-t p{margin:3px 0}
.mv .mv-t ul{margin:3px 0;padding-left:18px}
.mv .mv-t input.mbox,input.mbox{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1.5px solid var(--ink-4);border-radius:3px;background:var(--paper);vertical-align:-2px;margin:0 2px;cursor:pointer}
.mv .mv-t input.mbox:hover,input.mbox:hover{border-color:var(--accent)}
.mv .mv-t input.mbox:checked,input.mbox:checked{background:var(--ink);border-color:var(--ink)}
.md p{margin:3px 0}
.md ul{margin:3px 0;padding-left:18px}
.md li{margin:1px 0}
.notes-md{font-size:12.5px;color:var(--ink-2);padding:2px 0;line-height:1.5}
.mv .tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:3px;padding:0 4px;font-size:11px}
.mv .del{position:absolute;top:4px;right:4px;border:none;background:transparent;color:var(--line-3);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:3px;z-index:2}
.mv .del:hover{color:var(--danger);background:var(--danger-bg)}
.mv-add{margin-top:4px}
.mv-add button{background:var(--paper);color:var(--ink);border:1px dashed var(--ink-5);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11.5px}
.mv-add button:hover{border-color:var(--accent);color:var(--accent)}

/* ===== 选项 (勾选框) ===== */
.opt{display:flex;align-items:flex-start;gap:7px;padding:3px 0;font-size:12.5px}
.opt.gap{margin-top:3px}
.opt .chk{flex:none;margin-top:0;vertical-align:middle}
.chk{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.6px solid var(--ink-4);border-radius:3px;cursor:pointer;background:var(--paper);position:relative;flex:none}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--on-ink);font-size:11px;font-weight:700}
.chk:disabled{opacity:.4;cursor:not-allowed}
.opt .optt{flex:1}
.opt .optt input.cust{width:100%;border:none;border-bottom:1px dashed var(--ink-5);background:transparent;font-size:12.5px;color:var(--ink)}

.ck-mark{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink-3);border-radius:3px;margin-right:6px;position:relative;background:var(--paper);flex:none;margin-top:3px}
.ck-mark.on{background:var(--ink);border-color:var(--ink)}
.ck-mark.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--on-ink);font-size:9px;font-weight:700}

/* ===== 空白/文本 ===== */
.fillbox{width:100%;min-height:34px;border:1px solid var(--line-5);border-radius:3px;padding:5px 7px;font-size:12px;background:var(--paper);color:var(--ink);resize:none;overflow:hidden;font-family:inherit;line-height:1.5}
.gear-line{font-size:12.5px;padding:2px 0}
.gear-line.pre{white-space:pre-wrap}
.gear-group{margin-top:6px}
.gear-prompt{font-size:11px;color:var(--ink-4)}
.gear-prompt .tag{background:var(--paper-2);color:var(--ink-4);border:1px solid var(--ink-5);border-radius:3px;padding:0 3px;font-size:10px}
.gear-add{border:1px solid var(--accent);background:transparent;color:var(--tag-ink);border-radius:4px;width:18px;height:18px;padding:0;font-size:12px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.gear-add:hover{background:var(--accent);color:var(--accent-ink)}
.coins-input{width:80px;border:1px solid var(--line-5);border-radius:3px;padding:3px 6px;background:var(--paper);color:var(--ink);font-size:13px}
.spell-group{margin-top:6px}
.spell-group-h{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:4px;border-bottom:1px solid var(--paperline);padding-bottom:2px}
.mv.spell-off{opacity:.5}
.bond-line{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line-4);font-size:12.5px}
.bond-line input{flex:1;border:none;border-bottom:1px dashed var(--ink-5);background:transparent;font-size:12.5px;color:var(--ink)}
.bond-line .x{border:none;background:transparent;color:var(--line-3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:3px;line-height:1}
.bond-line .x:hover{color:var(--danger);background:var(--danger-bg)}
.heritage-boxes{display:flex;gap:6px;padding:4px 0 6px}
.heritage-box{display:inline-flex;align-items:center;cursor:pointer}
.heritage-box .chk{width:18px;height:18px;border-width:1.5px;border-radius:3px}
.heritage-box .chk:checked::after{content:none}
.heritage-up{position:relative;text-indent:16px}
.heritage-up .chk{position:absolute;left:-2px;top:0;width:12px;height:12px;border-width:1.2px;border-radius:2px}
.heritage-up .chk:checked::after{font-size:8px}
.heritage-up .chk:disabled{opacity:1;cursor:default;pointer-events:none}
.h-toggle{border:1px solid var(--line-3);background:var(--paper);color:var(--ink);border-radius:3px;padding:2px 6px;font-size:11px;cursor:pointer}
.h-toggle:hover{border-color:var(--accent);color:var(--accent)}
.question-hint{font-size:11px;color:var(--ink-4);margin-top:6px;line-height:1.5}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.counters .bond-line input{flex:1;min-width:0}
.counters .bond-line .coins-input{flex:none;width:52px;border:none;border-bottom:1px dashed var(--ink-5);background:transparent;text-align:center;padding:0}
.counters .bond-line .x{flex:none}
.counters-add{margin-bottom:8px}
.xbtn{border:none;background:transparent;color:var(--line-3);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:3px}
.xbtn:hover{color:var(--danger);background:var(--danger-bg)}
.empty{color:var(--ink-5);text-align:center;padding:70px 20px;font-size:14px}
.hint{font-size:11px;color:var(--ink-4);margin-top:4px}
.addrow{margin-top:6px}
.addrow button{background:var(--paper);color:var(--ink);border:1px dashed var(--ink-5);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px}
.addrow button:hover{border-color:var(--accent);color:var(--accent)}
.adv-tier{font-size:11px;color:var(--warn);font-weight:700;margin:8px 0 4px}
.faint{color:var(--ink-5)}

/* ===== 打印 ===== */
@media print{
  body{background:var(--paper)}
  .toolbar{display:none !important}
  .ref{display:none !important}
  details.help{display:none !important}
  .main-cols{grid-template-columns:1fr}
  .wrap{max-width:none;padding:0;margin:0}
  .playbook{border:none;border-radius:0;padding:0;min-height:0;box-shadow:none}
  @page{size:A4;margin:11mm}
  .pb-sec,.mv{page-break-inside:avoid}
}

.hidden{display:none}
details.help{font-size:12px;color:var(--muted);margin-top:10px}
details.help summary{cursor:pointer;color:var(--accent2)}
details.help .help-note{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0}
details.help pre{background:var(--panel2);padding:10px;border-radius:6px;overflow:auto;font-size:11px;color:var(--text)}
</style>
</head>
<body>
<div class="toolbar">
  <h1>⚔ 地城世界 · 车卡</h1>

    <pre id="jsonSchema"></pre>

<script>
let DW_DATA = null, META = {}, STATS = [], STATS_MODE = "scores", ADV_TIERS = [], DEBILITIES = {}, LABELS = {}, SPELL_SECTIONS = {}, PREPARE_CAP_FORMULA = "", STAT_DISTRIBUTION = null, REF_SECTIONS = [], STAT_MIN = null, STAT_MAX = null, DEBILITY_PENALTY = "on", COINS_ENABLED = true;
function applyData(data){
  DW_DATA = data || {};
  META = DW_DATA.meta || {};
  STATS = META.stats || [];
  STATS_MODE = META.statsMode || "scores";
  ADV_TIERS = META.advancedTiers || [{key:"2-5", label:"进阶 · 2~5 级", minLevel:1}, {key:"6-10", label:"进阶 · 6~10 级", minLevel:6}];
  DEBILITIES = META.debilities || {力量:"虚弱",敏捷:"颤抖",体质:"患病",智力:"晕眩",睿知:"困惑",魅力:"疤痕"};
  LABELS = Object.assign({
    look:"外观", race:"种族动作", raceName:"种族", alignment:"阵营动作", alignmentNote:"动机 / Drive", alignmentName:"阵营",
    starting:"起始动作", advanced:"进阶动作", customAdvanced:"其他", gear:"装备", bonds:"羁绊", notes:"笔记",
    load:"负载上限", hpMax:"最大生命", hpCur:"当前生命", armor:"护甲", damage:"伤害", name:"姓名", level:"等级", xp:"XP",
    defaultFormula:"默认", blank:" ", casterLevel:"施法等级", prepareCap:"准备上限", statDist:"初始分配", coins:"金币"
  }, META.labels || {});
  SPELL_SECTIONS = META.spellSections || {
    spellbook: { title:"法术书", source:"法师法术", trigger:"法术书", spellClass:"wizard", groups:["戏法","等级 1","等级 3","等级 5","等级 7","等级 9"] },
    cleric: { title:"牧师法术", source:"牧师法术", trigger:"通神", spellClass:"cleric", groups:["祷念","等级 1","等级 3","等级 5","等级 7","等级 9"] }
  };
  PREPARE_CAP_FORMULA = META.prepareCapFormula || "";
  STAT_DISTRIBUTION = META.statDistribution || null;
  STAT_MIN = (META.statMin !== undefined) ? META.statMin : null;
  STAT_MAX = (META.statMax !== undefined) ? META.statMax : null;
  DEBILITY_PENALTY = META.debilityPenalty || "on";
  COINS_ENABLED = META.coins !== "off";
  REF_SECTIONS = META.refSections || [
    {id:"moves", title:"通用动作", type:"groups", groups:[
      {key:"basicMoves", label:"基本动作"},
      {key:"specialMoves", label:"特殊动作"}
    ]},
    {id:"spells", title:"法术列表", type:"spells"},
    {id:"extension", title:"扩展", type:"extension", groups:[
      {key:"customMoves", label:"自定义动作"}
    ], articles:"compendium"},
    {id:"search", title:"资料速查", type:"search"}
  ];
  if(!REF_SECTIONS.some(s => s.id === refTab)) refTab = REF_SECTIONS[0] ? REF_SECTIONS[0].id : "search";
}

/* ============ 规则合并（分层） ============ */
function isObj(v){ return v && typeof v === "object" && !Array.isArray(v); }
function entryField(e){
  if(isObj(e)){ if(e.id !== undefined) return "id"; if(e.name !== undefined) return "name"; }
  return null;
}
function deepMerge(base, patch){
  if(!isObj(patch)) return patch;
  const out = isObj(base) ? {...base} : {};
  for(const k of Object.keys(patch)){
    const pv = patch[k];
    if(pv === null){ delete out[k]; continue; }
    const bv = out[k];
    if(Array.isArray(pv)){ out[k] = mergeArray(Array.isArray(bv) ? bv : [], pv); }
    else if(isObj(pv) && isObj(bv)){ out[k] = deepMerge(bv, pv); }
    else { out[k] = pv; }
  }
  return out;
}
function mergeArray(baseArr, patchArr){
  const out = baseArr.map(x => isObj(x) ? {...x} : x);
  for(const pe of patchArr){
    if(isObj(pe) && pe.$delete === true){
      const field = entryField(pe);
      if(field){ const val = pe[field]; const idx = out.findIndex(x => isObj(x) && x[field] === val); if(idx !== -1) out.splice(idx, 1); }
      continue;
    }
    const field = entryField(pe);
    if(field){
      const val = pe[field];
      const idx = out.findIndex(x => isObj(x) && x[field] === val);
      if(idx !== -1) out[idx] = deepMerge(out[idx], pe);
      else out.push(isObj(pe) ? {...pe} : pe);
    } else {
      out.push(pe);
    }
  }
  return out;
}

/* ============ 状态 ============ */
let mode = "edit";
let refTab = "moves";
let searchKw = "";
let lastSearchItems = [];
let boxReg = {};
let ruleStack = [];
let customData = {classes:[], extraMoves:{}, extraRacialMoves:{}, extraAlignments:{}};
let char = defaultChar();

function uid(){ return "c"+Math.random().toString(36).slice(2,9); }
function defaultChar(){
  const stats = {};
  if(STATS_MODE==="modifiers"){ STATS.forEach(s=>stats[s]=0); }
  else { STATS.forEach(s=>stats[s]=10); }
  const spells = {};
  Object.keys(SPELL_SECTIONS).forEach(k => spells[k] = {effectiveLevel:1, levelCap:2, list:[]});
  return {name:"",classId:"",races:[],alignments:[],level:1,xp:0,
    stats,
    look:[], lookNotes:"", hpMax:0, load:0, hpCur:0, armor:0, damage:"",
    gear:"", bonds:[], advancedMoves:[], startingChoices:[], coins:0, notes:"", moveEdits:{}, debilities:[], counters:[],
    spells, manualSpells:[]};
}
function mod(score){
  const table = META.modTable || {"1-3":-3, "4-5":-2, "6-8":-1, "9-12":0, "13-15":1, "16-17":2, "18":3};
  for(const r of Object.keys(table)){
    const parts = r.split("-");
    const lo = parseInt(parts[0])||0;
    const hi = parts.length>1 ? (parseInt(parts[1])||0) : Infinity;
    if(score >= lo && score <= hi) return table[r];
  }
  return 0;
}
function fmtMod(m){return (m>0?"+":"")+m;}
function statMod(score){ return STATS_MODE==="modifiers" ? (score||0) : mod(score); }
function effMod(score, stat){ return statMod(score) - ((DEBILITY_PENALTY==="on" && (char.debilities||[]).includes(stat))?1:0); }
function statBoundsAttr(isMod){
  if(STAT_MIN!==null || STAT_MAX!==null){
    return `${STAT_MIN!==null?` min="${STAT_MIN}"`:""}${STAT_MAX!==null?` max="${STAT_MAX}"`:""}`;
  }
  return isMod ? ' min="-4" max="4"' : ' min="1" max="18"';
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stripTags(html){ const d=document.createElement("div"); d.innerHTML=html||""; return d.textContent||""; }
function inlineMarkdown(t){
  return esc(t).replace(/\{([^{}]+)\}/g,'<span class="tag">$1</span>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function markdownToHtml(md){
  const lines=String(md||"").split("\n");
  const out=[]; let list=[]; let para=[];
  const inline=t=>esc(t).replace(/\{([^{}]+)\}/g,'<span class="tag">$1</span>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  const flushList=()=>{ if(list.length){ out.push("<ul>"+list.map(x=>"<li>"+x+"</li>").join("")+"</ul>"); list=[]; } };
  const flushPara=()=>{ if(para.length){ out.push("<p>"+para.map(inline).join("<br>")+"</p>"); para=[]; } };
  for(const line of lines){
    const m=line.match(/^\s*[-*]\s+(.*)$/);
    if(m){ flushPara(); list.push(inline(m[1])); continue; }
    if(line.trim()===""){ flushList(); flushPara(); continue; }
    flushList(); para.push(line.trim());
  }
  flushList(); flushPara();
  return out.join("");
}
function moveBoxKey(kind, mv){ return mv._custom ? ("custom::"+(mv.id||"")) : editKey(kind, mv.name); }
function applyBoxes(html, key){
  let idx = 0;
  return String(html||"").replace(/\[([ xX])\]/g, (m, c)=>{
    const box = `<input type="checkbox" class="mbox" data-movebox="${esc(key)}" data-box="${idx}"${c !== " " ? " checked" : ""}>`;
    idx++;
    return box;
  });
}
function getMoveMarkdown(kind, mv){
  if(mv._custom) return mv.text || "";
  const d = moveDisplay(kind, mv);
  return d.text !== null ? d.text : mv.text;
}
function setMoveMarkdown(kind, mv, newText){
  if(mv._custom){
    const cid = char.classId;
    const am = (customData.extraMoves[cid]||[]).find(x=>x.id===mv.id);
    if(am){ am.text = newText; return; }
    for(const g of (customData.extraRacialMoves[cid]||[])){
      const mm = (g.moves||[]).find(x=>x.id===mv.id);
      if(mm){ mm.text = newText; return; }
    }
    const al = (customData.extraAlignments[cid]||[]).find(x=>x.id===mv.id);
    if(al){ al.text = newText; return; }
    return;
  }
  const key = editKey(kind, mv.name);
  if(!char.moveEdits[key]) char.moveEdits[key] = {};
  char.moveEdits[key].text = newText;
}
function toggleTextBox(md, index){
  let i = 0;
  return String(md||"").replace(/\[([ xX])\]/g, (m, c)=>{
    if(i === index){ i++; return c === " " ? "[x]" : "[ ]"; }
    i++;
    return m;
  });
}
function renderFieldMarkdown(md, key, get, set){
  boxReg[key] = {get, set};
  return applyBoxes(markdownToHtml(md), key);
}

function mergedClasses(){ return (DW_DATA.classes||[]).concat(customData.classes||[]); }
function getClass(id){ return mergedClasses().find(c=>c.id===id); }
function mergeRacialGroups(builtin, extra){
  const map={};
  (builtin||[]).forEach(g=>{
    if(!map[g.race]) map[g.race]={race:g.race, moves:[], _custom:false, _id:null};
    map[g.race].moves=map[g.race].moves.concat((g.moves||[]).map(mm=>({...mm,_custom:false,_gid:null})));
  });
  (extra||[]).forEach(g=>{
    const key = g.race || ("_custom_"+g.id);
    if(!map[key]) map[key]={race:g.race, moves:[], _custom:true, _id:g.id||null};
    else if(g.race) map[key]._custom=true;
    map[key].moves=map[key].moves.concat((g.moves||[]).map(mm=>({...mm,_custom:true,_gid:g.id||null})));
  });
  return Object.values(map);
}
function classMoves(cls){
  const racialGroups = mergeRacialGroups(cls.racialMoves||[], customData.extraRacialMoves[cls.id]||[]);
  const races = racialGroups.filter(g=>g.race).map(g=>g.race);
  const alignments = (cls.alignment||[]).map(a=>({...a,_custom:false})).concat((customData.extraAlignments[cls.id]||[]).map(a=>({...a,_custom:true})));
  const starting = cls.startingMoves||[];
  const advTiers = ADV_TIERS.map(t => ({...t, moves:(cls.advancedMoves[t.key]||[]).map(m=>({...m,_custom:false}))}));
  const customMoves=(customData.extraMoves[cls.id]||[]).map(m=>({...m,_custom:true}));
  return {racialGroups, races, alignments, starting, advTiers, customMoves};
}
function allAdvancedMoves(m){ return m.advTiers.reduce((a,t)=>a.concat(t.moves),[]).concat(m.customMoves); }
function reqList(mv){ return mv.requires ? (Array.isArray(mv.requires) ? mv.requires : [mv.requires]) : []; }
function repList(mv){ return mv.replaces ? (Array.isArray(mv.replaces) ? mv.replaces : [mv.replaces]) : []; }
function hasSpellTrigger(key){
  const cls = getClass(char.classId);
  if(!cls) return false;
  const m = classMoves(cls);
  const trigger = SPELL_SECTIONS[key].trigger;
  if(m.starting.some(mv => mv.name === trigger)) return true;
  const checked = allAdvancedMoves(m).filter(mv => (char.advancedMoves||[]).includes(mv.name));
  return checked.some(mv => mv.name === trigger);
}
function spellSectionActive(key){ return hasSpellTrigger(key) || (char.manualSpells||[]).includes(key); }
function spellFind(key, id){ const sec=char.spells&&char.spells[key]; return sec ? (sec.list||[]).find(s=>s.id===id) : null; }
function editKey(kind, name){ return char.classId+"::"+kind+"::"+name; }
function moveDisplay(kind, mv){
  const key=editKey(kind, mv.name);
  const ed=char.moveEdits[key];
  return {name:(ed&&ed.name!==undefined)?ed.name:mv.name, text:(ed&&ed.text!==undefined)?ed.text:null, key, templateText:mv.text};
}
function evalFormula(formula, ctx){
  const terms = String(formula||"").split("+").map(t=>t.trim()).filter(t=>t!=="");
  if(!terms.length) return null;
  let sum = 0;
  for(const t of terms){
    if(/^-?\d+$/.test(t)){ sum += parseInt(t,10); continue; }
    if(STATS.includes(t)){ sum += (char.stats[t]||0); continue; }
    if(t === LABELS.casterLevel){ sum += ((ctx && ctx.effectiveLevel)||0); continue; }
    return null;
  }
  return sum;
}
function defaultHP(cls){ const b=(parseInt((cls.hp||"0").split("+")[0])||0); return STATS_MODE==="modifiers" ? b : (evalFormula(cls.hp) ?? b); }
function defaultLoad(cls){ const b=(parseInt((cls.load||"0").split("+")[0])||0); return STATS_MODE==="modifiers" ? b : (evalFormula(cls.load) ?? b); }
function applyFormula(target){
  const cls=getClass(char.classId);
  if(!cls) return;
  if(target==="hpMax"){ const v=evalFormula(cls.hp); if(v!=null) char.hpMax=v; }
  else if(target==="load"){ const v=evalFormula(cls.load); if(v!=null) char.load=v; }
  else if(target.indexOf("prepareCap:")===0){
    const k=target.slice("prepareCap:".length);
    const sec=char.spells && char.spells[k];
    if(sec){ const v=evalFormula(PREPARE_CAP_FORMULA, {effectiveLevel:sec.effectiveLevel}); if(v!=null) sec.levelCap=v; }
  }
  renderPlaybook(); save();
}

/* ============ 持久化 ============ */
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function save(){ lsSet("dw-char", JSON.stringify(char)); lsSet("dw-custom", JSON.stringify(customData)); lsSet("dw-ui", JSON.stringify({mode, refTab})); }
function saveRules(){ lsSet("dw-rules-stack", JSON.stringify(ruleStack)); }
function loadRules(){
  const s = lsGet("dw-rules-stack");
  if(s !== null){
    // 有规则栈键（哪怕是空数组），说明是新版存储，直接用它，不再回退旧键
    try{ const arr = JSON.parse(s); if(Array.isArray(arr)) ruleStack = arr; }catch(e){}
    return;
  }
  // 旧版本首次迁移：没有规则栈键时，读一次旧的单份 dw-rules
  try{ const old = lsGet("dw-rules"); if(old){ const data = JSON.parse(old); if(data) ruleStack = [{name:"规则", data}]; } }catch(e){}
}
function normalizeCustomData(){
  customData.classes = customData.classes || [];
  customData.extraMoves = customData.extraMoves || {};
  customData.extraRacialMoves = customData.extraRacialMoves || {};
  customData.extraAlignments = customData.extraAlignments || {};
}
function ensureSpellData(){
  char.spells = char.spells || {};
  Object.keys(SPELL_SECTIONS).forEach(k=>{
    char.spells[k] = char.spells[k] || {effectiveLevel:1, levelCap:2, list:[]};
    char.spells[k].list = char.spells[k].list || [];
    char.spells[k].list.forEach(s=>{ if(!s.id)s.id=uid(); if(s.available===undefined)s.available=false; });
  });
  char.manualSpells = char.manualSpells || [];
}
function normalizeChar(){
  // 旧存档迁移：单值 race/alignment → 数组 races/alignments；look 元素 → 数组
  if(char.race!==undefined && !Array.isArray(char.race)){ char.races = char.race ? [char.race] : []; delete char.race; }
  if(char.alignment!==undefined && !Array.isArray(char.alignment)){ char.alignments = char.alignment ? [char.alignment] : []; delete char.alignment; }
  char.races = char.races || [];
  char.alignments = char.alignments || [];
  char.startingChoices = char.startingChoices || [];
  char.look = (char.look || []).map(x => Array.isArray(x) ? x : (x ? [x] : []));
  char.counters = char.counters || [];
}
function load(){
  try{
    const c=lsGet("dw-char"); if(c) char=Object.assign(defaultChar(), JSON.parse(c));
    const cu=lsGet("dw-custom"); if(cu) customData=JSON.parse(cu);
    const ui=lsGet("dw-ui"); if(ui){ const u=JSON.parse(ui); if(u.mode==="view"||u.mode==="edit") mode=u.mode; if(u.refTab && REF_SECTIONS.some(s=>s.id===u.refTab)) refTab=u.refTab; }
  }catch(e){}
  normalizeCustomData();
  normalizeChar();
  ensureSpellData();
  Object.values(customData.extraMoves||{}).forEach(arr=>arr.forEach(m=>{ if(!m.id)m.id=uid(); }));
  Object.values(customData.extraRacialMoves||{}).forEach(arr=>arr.forEach(g=>{ if(!g.id)g.id=uid(); (g.moves||[]).forEach(m=>{ if(!m.id)m.id=uid(); }); }));
  Object.values(customData.extraAlignments||{}).forEach(arr=>arr.forEach(a=>{ if(!a.id)a.id=uid(); }));
}

/* ============ 渲染 ============ */
function renderClassSelect(){
  const el=document.getElementById("classSelect");
  el.innerHTML = ['<option value="">—— 选择职业 ——</option>']
    .concat(mergedClasses().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join("");
  el.value=char.classId||"";
}

function renderPlaybook(){
  const root=document.getElementById("playbook");
  boxReg = {};
  const cls=getClass(char.classId);
  const btnMode=document.getElementById("btnMode");
  btnMode.textContent = mode==="edit" ? "👁 查看模式" : "✏️ 编辑模式";
  btnMode.classList.toggle("view", mode==="view");
  if(!cls){ root.innerHTML='<div class="empty">↑ 在左上角选择一个职业开始车卡</div>'; return; }
  const m=classMoves(cls);
  root.innerHTML =
    headHtml(cls) + statsHtml(cls) +
    `<div class="pb-cols">
      <div class="pb-left">${lookHtml(cls)}${raceHtml(cls,m)}${alignHtml(cls,m)}${heritageHtml()}${gearHtml(cls)}${bondsHtml(cls)}${notesHtml(cls)}${spellSectionsHtml()}${addSpellSectionHtml()}</div>
      <div class="pb-right">${startingHtml(cls,m)}${advHtml(cls,m)}</div>
    </div>`;
  autosizeAll();
}

function headHtml(cls){
  const info = mode==="edit" ?
    `<div class="pb-info">
      <div class="it"><span class="k">${esc(LABELS.name)}</span><input data-bind="name" value="${esc(char.name)}" placeholder="角色名"></div>
      <div class="it"><span class="k">${esc(LABELS.level)}</span><input type="number" data-bind="level" value="${char.level}" min="1" max="10"></div>
      <div class="it"><span class="k">${esc(LABELS.xp)}</span><input type="number" data-bind="xp" value="${char.xp||0}" min="0"></div>
    </div>` :
    `<div class="pb-info">
      <div class="it"><span class="k">${esc(LABELS.name)}</span><span class="v">${esc(char.name||"—")}</span></div>
      <div class="it"><span class="k">${esc(LABELS.level)}</span><span class="v">${esc(char.level)}</span></div>
      <div class="it"><span class="k">${esc(LABELS.xp)}</span><input type="number" data-bind="xp" value="${char.xp||0}" min="0"></div>
    </div>`;
  return `<div class="pb-head">
    <div><div class="pb-class">${esc(cls.name)}</div>
      <div class="pb-sub">${esc(char.races.length ? char.races.join("、") : ("未选"+LABELS.raceName))} · ${esc(char.alignments.length ? char.alignments.join("、") : ("未选"+LABELS.alignmentName))}</div></div>
    ${info}
  </div>`;
}

function formulaHint(txt, setter, hideInModifiers){
  if(STATS_MODE==="modifiers"){
    return hideInModifiers ? "" : `<span class="formula-hint">${esc(LABELS.blank||" ")}</span>`;
  }
  const body = esc(txt);
  if(setter && mode==="edit"){
    return `<span class="formula-hint">（<button type="button" class="formula-link" data-setformula="${esc(setter)}" title="设为默认值">${body}</button>）</span>`;
  }
  return `<span class="formula-hint">（${body}）</span>`;
}
function distHint(){
  const arr = STAT_DISTRIBUTION;
  if(!arr || !arr.length) return "";

}

function lookHtml(cls){
  const opts=(cls.look||[]);
  if(!opts.length && mode==="edit") return "";
  if(!char.look.length && opts.length) char.look=opts.map(()=>[]);
  if(mode==="view"){
    const inner=char.look.map((sel,i)=>{
      if(!sel||!sel.length) return "";
      const list=opts[i]||[];
      return sel.map(s=>{
        if(list.includes(s)) return `<div class="opt"><span class="ck-mark on"></span><span>${esc(s)}</span></div>`;
        return `<div class="opt"><span class="ck-mark on"></span><span class="md">${renderFieldMarkdown(s, "lookcustom::"+i, ()=>char.look[i].filter(x=>!list.includes(x))[0]||"", t=>{ char.look[i]=char.look[i].filter(x=>list.includes(x)); if(t.trim()) char.look[i].push(t.trim()); })}</span></div>`;
      }).join("");
    }).join("");
    const note=char.lookNotes?`<div class="gear-line md">${renderFieldMarkdown(char.lookNotes, "lookNotes", ()=>char.lookNotes||"", t=>{char.lookNotes=t;})}</div>`:"";
    return `<div class="pb-sec"><h3>${esc(LABELS.look)}</h3>${inner||""}${note||(!inner?'<div class="hint">未选择</div>':"")}</div>`;
  }
  const inner = opts.map((list,i)=>{
    const sel=char.look[i]||[];
    const boxes = list.map(o=>`<div class="opt"><label class="optt"><input type="checkbox" class="chk" value="${esc(o)}" data-look="${i}" ${sel.includes(o)?"checked":""}> ${esc(o)}</label></div>`).join("");
    const customVal = sel.filter(x=>!list.includes(x))[0] || "";
    return `<div class="mv"><div class="mv-n look-h">第${i+1}项</div>${boxes}
      <div class="opt gap"><label class="optt"><input class="cust" data-lookcustom="${i}" value="${esc(customVal)}" placeholder="自定义"></label></div></div>`;
  }).join("");
  const note=`<div class="opt gap"><label class="optt"><input class="cust" data-bind="lookNotes" value="${esc(char.lookNotes||"")}"></label></div>`;
  return `<div class="pb-sec"><h3>${esc(LABELS.look)}</h3>${inner}${note}</div>`;
}

function heritageHtml(){
  const cfg = META.heritage;
  if(!cfg) return "";
  const h = char.heritage = char.heritage || {boxes:[false,false,false], moves:["","",""], third:false, hidden:false};
  const title = cfg.title || "血统";
  const toggleBtn = `<button type="button" class="h-toggle" data-heritage-toggle title="显示 / 隐藏">${h.hidden ? "显示" : "隐藏"}</button>`;
  const hdr = `<h3>${esc(title)} <span class="h3r">${toggleBtn}</span></h3>`;
  if(h.hidden){
    return `<div class="pb-sec">${hdr}</div>`;
  }
  const n = h.third ? 3 : 2;
  const boxes = h.boxes.map((b,i)=>{
    if(i>=n) return "";
    return `<label class="heritage-box"><input type="checkbox" class="chk" data-heritage-box="${i}" ${b?"checked":""}></label>`;
  }).join("");
  const lines = h.moves.map((m,i)=>{
    if(i>=n) return "";
    if(mode==="edit"){
      return `<div class="bond-line"><input data-heritage-move="${i}" value="${esc(m||"")}" placeholder="血统动作"></div>`;
    }
    return `<div class="bond-line md">${renderFieldMarkdown(m||"", "heritage::"+i, ()=>char.heritage.moves[i]||"", t=>{char.heritage.moves[i]=t;})}</div>`;
  }).join("");
  const body = [];
  if(cfg.note) body.push(markdownToHtml(cfg.note));
  if(cfg.upgradePrompt) body.push(markdownToHtml(cfg.upgradePrompt));
  if(cfg.upgradeEffect){
    body.push(`<p class="heritage-up"><input type="checkbox" class="chk" data-heritage-third ${h.third?"checked":""}${mode==="view"?" disabled":""}>${inlineMarkdown(cfg.upgradeEffect)}</p>`);
  }
  const card = body.length ? `<div class="mv mv-heritage"><div class="mv-t">${body.join("")}</div></div>` : "";
  return `<div class="pb-sec">${hdr}<div class="heritage-boxes">${boxes}</div>${lines}${card}</div>`;
}

function advHtml(cls, m){
  const lvl=char.level||1;
  const chosen=char.advancedMoves||[];
  if(mode==="view"){
    const checked=allAdvancedMoves(m).filter(x=>chosen.includes(x.name));
    return `<div class="pb-sec"><h3>${esc(LABELS.advanced)}</h3>${checked.map(mv=>mvViewCard("adv",mv)).join("")||'<div class="hint">未选择</div>'}</div>`;
  }
  const tier=(title,moves)=>`<div class="adv-tier">${title}</div>`+moves.map(mv=>{
    if(mv._custom) return mvCardCustomAdv(mv);
    const d=moveDisplay("adv",mv);
    const text=d.text!==null?d.text:mv.text;
    const reqs=reqList(mv);
    const reps=repList(mv);
    const disabled=reqs.some(r=>!chosen.includes(r));
    const req=reqs.map(r=>`<span class="req">需:${esc(r)}</span>`).join("");
    const rep=reps.map(r=>`<span class="req">替:${esc(r)}</span>`).join("");
    return `<div class="mv mv-adv ${disabled?"disabled":""}"><div class="mv-h">
      <input type="checkbox" class="chk" data-adv="${esc(mv.name)}" ${chosen.includes(mv.name)?"checked":""} ${disabled?"disabled":""}>
      <div class="mv-n"><input data-key="${esc(d.key)}" data-field="name" value="${esc(d.name)}">${req}${rep}</div></div>
      <div class="mv-t"><textarea data-key="${esc(d.key)}" data-field="text">${esc(text)}</textarea></div></div>`;
  }).join("");
  let html = "";
  m.advTiers.forEach(t=>{
    if(!t.moves.length) return;
    if(lvl < t.minLevel) html += `<div class="hint">升至 ${t.minLevel} 级后解锁${t.label}。</div>`;
    else html += tier(t.label, t.moves);
  });
  if(m.customMoves.length) html += tier(LABELS.customAdvanced, m.customMoves);
  return `<div class="pb-sec"><h3>${esc(LABELS.advanced)}</h3>${html}<div class="addrow"><button data-add-adv>＋ 添加${esc(LABELS.advanced)}</button></div></div>`;
}

function spellSectionHtml(key){
  const cfg = SPELL_SECTIONS[key];
  const data = char.spells[key] || {effectiveLevel:1, levelCap:2, list:[]};
  const lvl = data.effectiveLevel||0, cap = data.levelCap||0;
  const del = (char.manualSpells||[]).includes(key) && !hasSpellTrigger(key) ? `<button class="xbtn" data-del-spell-section="${key}" title="移除该板块">✕</button>` : "";
  const prepHint = PREPARE_CAP_FORMULA ? formulaHint(PREPARE_CAP_FORMULA, "prepareCap:"+key, true) : "";
  const h3r = mode==="edit"
    ? `<span class="h3r">${esc(LABELS.casterLevel)} <input type="number" data-spell-lvl="${key}" value="${lvl}" min="0"> ${esc(LABELS.prepareCap)} <input type="number" data-spell-cap="${key}" value="${cap}" min="0">${prepHint}${del}</span>`
    : `<span class="h3r">${esc(LABELS.casterLevel)} <b>${lvl}</b> ${esc(LABELS.prepareCap)} <b>${cap}</b>${prepHint}${del}</span>`;
  const groups = cfg.groups.map(g=>{
    const spells = (data.list||[]).filter(s=>s.group===g);
    if(mode==="view" && !spells.length) return "";
    const cards = spells.map(s=>spellCard(key, s)).join("");
    const add = mode==="edit" ? `<div class="mv-add"><button data-add-spell="${key}:${esc(g)}">＋ 添加法术</button></div>` : "";
    return `<div class="spell-group"><div class="spell-group-h">${esc(g)}</div>${cards}${add}</div>`;
  }).join("");
  return `<div class="pb-sec"><h3>${esc(cfg.title)} ${h3r}</h3>${groups}</div>`;
}

function spellCard(key, s){
  const avail = s.available !== false;

    return `<div class="mv mv-spell ${avail?"":"spell-off"}" style="${bar}"><button class="del" data-spell-del="${key}:${esc(s.id)}" title="删除">✕</button>
      <div class="mv-h"><input type="checkbox" class="chk" data-spell-avail="${key}:${esc(s.id)}" ${avail?"checked":""} title="可用/不可用"><div class="mv-n"><input data-spell-name="${key}:${esc(s.id)}" value="${esc(s.name)}" placeholder="法术名"></div></div>
      <div class="mv-t"><textarea data-spell-text="${key}:${esc(s.id)}">${esc(s.text||"")}</textarea></div></div>`;
  }
  return `<div class="mv mv-spell ${avail?"":"spell-off"}" style="${bar}"><div class="mv-h"><input type="checkbox" class="chk" data-spell-avail="${key}:${esc(s.id)}" ${avail?"checked":""} title="可用/不可用"><div class="mv-n">${esc(s.name||"未命名法术")}</div></div><div class="mv-t">${markdownToHtml(s.text||"")}</div></div>`;

function renderRefTabs(){

function renderRef(){
  renderRefTabs();
  const body = document.getElementById("refBody");
  lastSearchItems = [];
  if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
    body.innerHTML = '<div class="ref-empty">未加载规则。</div>';
    return;
  }
  const sec = REF_SECTIONS.find(s => s.id === refTab);
  if(!sec) body.innerHTML = renderRefSearch(searchKw);
  else if(sec.type === "groups") body.innerHTML = renderRefGroups(sec);
  else if(sec.type === "extension") body.innerHTML = renderRefExtension(sec);
  else if(sec.type === "spells") body.innerHTML = renderRefSpells();
  else body.innerHTML = renderRefSearch(searchKw);
}

  for(const g of (sec.groups||[])){
    const moves = DW_DATA[g.key] || [];
    if(!moves.length) continue;
    const src = g.label || sec.title;
    const cards = moves.map(m => {
      if(g.importable){
        const idx = lastSearchItems.push({kind:"move", name:m.name, html:m.text, source:src, importable:true}) - 1;
        return rmvCardHtml({name:m.name, html:m.text, source:src, importable:true}, idx);
      }
      return rmvCardHtml({name:m.name, html:m.text, source:src, importable:false}, -1);
    }).join("");
    if(g.label) html += `<div class="ref-sec">${esc(g.label)}</div>`;
    html += cards;
  }
  return html;
}
function renderRefGroups(sec){
  return groupsHtml(sec) || '<div class="ref-empty">暂无内容。</div>';
}
function renderArticle(it){
  const body = (it.blocks||[]).map(b => {

      const idx = lastSearchItems.push({kind:"move", name:b.name, html:b.text, source:it.title, importable:true}) - 1;
      return rmvCardHtml({name:b.name, html:b.text, source:it.title, importable:true}, idx);
    }
    if(b.kind === "bond"){
      return `<div class="bond-line md">${markdownToHtml(b.text)}</div>`;
    }
    return `<div class="md">${markdownToHtml(b.text)}</div>`;
  }).join("");
  return `<details class="rmv" open><summary>${esc(it.title)}</summary><div class="rmv-t">${body}</div></details>`;

function spellSectionKeyForClass(ck){ return Object.keys(SPELL_SECTIONS).find(k => SPELL_SECTIONS[k].spellClass === ck) || Object.keys(SPELL_SECTIONS)[0]; }
function spellSourceLabel(ck){
  const sec = SPELL_SECTIONS[spellSectionKeyForClass(ck)];
  return (sec && (sec.source || sec.title)) || ck;
}
function renderRefSpells(){
  const ckeys = Object.keys(DW_DATA.spells||{});
  if(!ckeys.length) return '<div class="ref-empty">暂无法术数据。</div>';
  return ckeys.map(ck => {
    const spells = DW_DATA.spells[ck] || [];
    const groups = [...new Set(spells.map(s=>s.group))];
    const src = spellSourceLabel(ck);
    const cards = groups.map(g => {
      const gs = spells.filter(s=>s.group===g);
      return `<div class="ref-spell-group">${esc(g)}</div>` + gs.map(s => {
        const item = {kind:"spell", name:s.name, html:s.text, source:src, spellClass:ck, group:g, importable:true};
        const idx = lastSearchItems.push(item) - 1;
        return rmvCardHtml(item, idx);
      }).join("");
    }).join("");
    return `<details class="ref-spell-list" open><summary>${esc(src)}</summary><div class="ref-spell-inner">${cards}</div></details>`;
  }).join("");
}
function renderRefSearch(kw){
  return `<input class="ref-search" id="refSearch" placeholder="搜索动作、职业、${esc(LABELS.raceName)}、法术…" value="${esc(kw||"")}"><div id="refSearchResults">${searchResultsHtml(kw||"")}</div>`;
}
function collectRaces(){
  const set = new Set();
  (DW_DATA.classes||[]).forEach(c => (c.racialMoves||[]).forEach(g => { if(g.race) set.add(g.race); }));
  return [...set];
}
function classMovesFlat(c){
  const items = [];
  (c.startingMoves||[]).forEach(m => items.push({kind:"move", name:m.name, html:m.text, source:c.name, classId:c.id, importable:true}));
  for(const t of ADV_TIERS) (c.advancedMoves[t.key]||[]).forEach(m => items.push({kind:"move", name:m.name, html:m.text, source:c.name, classId:c.id, importable:true}));
  (c.racialMoves||[]).forEach(g => (g.moves||[]).forEach(m => items.push({kind:"racial", name:m.name, html:m.text, source:c.name, race:g.race, classId:c.id, importable:true})));
  (c.alignment||[]).forEach(a => items.push({kind:"alignment", name:a.name, html:a.text, source:c.name, classId:c.id, importable:true}));
  return items;
}
function collectSearchable(){
  const items = [];
  (DW_DATA.basicMoves||[]).forEach(m => items.push({kind:"basic", name:m.name, html:m.text, source:"基本动作", importable:false}));
  (DW_DATA.specialMoves||[]).forEach(m => items.push({kind:"special", name:m.name, html:m.text, source:"特殊动作", importable:false}));
  (DW_DATA.classes||[]).forEach(c => items.push(...classMovesFlat(c)));
  Object.keys(DW_DATA.spells||{}).forEach(ck => {
    const src = spellSourceLabel(ck);
    (DW_DATA.spells[ck]||[]).forEach(s => items.push({kind:"spell", name:s.name, html:s.text, source:src, spellClass:ck, group:s.group, importable:true}));
  });
  return items;
}
function searchResultsHtml(kw){
  kw = (kw||"").trim();
  lastSearchItems = [];
  if(!kw) return `<div class="ref-empty">输入关键词，可搜动作名/正文、职业名、${esc(LABELS.raceName)}名、法术。</div>`;
  const parts = [];
  // 1. 职业
  const classMatches = (DW_DATA.classes||[]).filter(c => c.name.includes(kw));
  classMatches.forEach(c => {
    const intro = c.intro ? `<div class="ref-intro">${markdownToHtml(c.intro)}</div>` : "";
    const cards = classMovesFlat(c).map(item => { const idx = lastSearchItems.push(item)-1; return rmvCardHtml(item, idx); }).join("");
    parts.push(`<div class="ref-sec">职业：${esc(c.name)}</div>${intro}${cards}`);
  });
  // 2. 种族
  const matchedRaces = collectRaces().filter(r => r.includes(kw));
  if(matchedRaces.length){
    const raceItems = [];
    (DW_DATA.classes||[]).forEach(c => (c.racialMoves||[]).forEach(g => { if(matchedRaces.includes(g.race)) (g.moves||[]).forEach(m => raceItems.push({kind:"racial", name:m.name, html:m.text, source:c.name, race:g.race, classId:c.id, importable:true})); }));
    const cards = raceItems.map(item => { const idx = lastSearchItems.push(item)-1; return rmvCardHtml(item, idx); }).join("");
    parts.push(`<div class="ref-sec">${esc(LABELS.raceName)}：${esc(matchedRaces.join("、"))}</div>${cards}`);
  }
  // 3. 关键词 (去重)
  const matchedClassIds = new Set(classMatches.map(c=>c.id));
  const matchedRaceSet = new Set(matchedRaces);
  const kwItems = collectSearchable().filter(it => {
    if(!(it.name.includes(kw) || stripTags(it.html).includes(kw))) return false;
    if(it.classId && matchedClassIds.has(it.classId)) return false;
    if(it.race && matchedRaceSet.has(it.race)) return false;
    return true;
  });
  if(kwItems.length){
    const cards = kwItems.map(item => { const idx = lastSearchItems.push(item)-1; return rmvCardHtml(item, idx); }).join("");
    parts.push(`<div class="ref-sec">关键词匹配</div>${cards}`);
  }
  if(!parts.length) return `<div class="ref-empty">没有找到匹配「${esc(kw)}」的内容。</div>`;
  return parts.join("");
}
function importSearchItem(idx){
  const item = lastSearchItems[idx];
  if(!item) return;
  if(item.kind === "spell"){
    const secKey = spellSectionKeyForClass(item.spellClass);
    if(!spellSectionActive(secKey)){ if(!char.manualSpells.includes(secKey)) char.manualSpells.push(secKey); }
    ensureSpellData();
    char.spells[secKey].list.push({id:uid(), group:item.group, name:item.name, text:item.html, available:false});
  } else if(item.kind === "racial"){
    if(!customData.extraRacialMoves[char.classId]) customData.extraRacialMoves[char.classId]=[];
    let grp = customData.extraRacialMoves[char.classId].find(g=>g.race===item.race);
    if(!grp){ grp={id:uid(), race:item.race, moves:[]}; customData.extraRacialMoves[char.classId].push(grp); }
    grp.moves.push({id:uid(), name:item.name, text:item.html});
  } else if(item.kind === "alignment"){
    if(!customData.extraAlignments[char.classId]) customData.extraAlignments[char.classId]=[];
    customData.extraAlignments[char.classId].push({id:uid(), name:item.name, text:item.html});
  } else if(item.kind === "move"){
    if(!customData.extraMoves[char.classId]) customData.extraMoves[char.classId]=[];
    customData.extraMoves[char.classId].push({id:uid(), name:item.name, text:item.html, tier:"2-5", requires:null, replaces:null});
  }
  renderPlaybook(); save();
}

function onClassChange(){
  const newId=document.getElementById("classSelect").value;
  if(newId!==char.classId){
    char.classId=newId;
    char.races=[]; char.alignments=[]; char.look=[]; char.lookNotes=""; char.advancedMoves=[]; char.startingChoices=[];
    char.gear=""; char.bonds=[]; char.damage=""; char.hpCur=0;
    char.hpMax=0; char.load=0;
  }
  const cls=getClass(char.classId);
  if(!cls){ renderPlaybook(); return; }
  const m=classMoves(cls);
  if(!char.damage) char.damage=cls.damage||"";
  if(!char.look.length && cls.look) char.look=cls.look.map(()=>[]);
  if(!char.hpMax) char.hpMax=defaultHP(cls);
  if(!char.load) char.load=defaultLoad(cls);
  renderPlaybook(); save();
}

document.addEventListener("input", e=>{
  const t=e.target, d=t.dataset||{};
  if(t.id==="refSearch"){ searchKw=t.value; const r=document.getElementById("refSearchResults"); if(r) r.innerHTML=searchResultsHtml(searchKw); return; }
  if(d.key && d.field){ if(!char.moveEdits[d.key]) char.moveEdits[d.key]={}; char.moveEdits[d.key][d.field]=t.value; autosize(t); save(); return; }
  if(d.cadvName){ const m=(customData.extraMoves[char.classId]||[]).find(x=>x.id===d.cadvName); if(m){ const old=m.name; m.name=t.value; const i=char.advancedMoves.indexOf(old); if(i!==-1) char.advancedMoves[i]=t.value; save(); } return; }
  if(d.cadvText){ const m=(customData.extraMoves[char.classId]||[]).find(x=>x.id===d.cadvText); if(m){ m.text=t.value; autosize(t); save(); } return; }
  if(d.calignName){ const a=(customData.extraAlignments[char.classId]||[]).find(x=>x.id===d.calignName); if(a){ const old=a.name; a.name=t.value; const i=char.alignments.indexOf(old); if(i!==-1) char.alignments[i]=t.value; save(); } return; }
  if(d.calignText){ const a=(customData.extraAlignments[char.classId]||[]).find(x=>x.id===d.calignText); if(a){ a.text=t.value; autosize(t); save(); } return; }
  if(d.craceName){ const g=(customData.extraRacialMoves[char.classId]||[]).find(x=>x.id===d.craceName); if(g){ const old=g.race; g.race=t.value; const i=char.races.indexOf(old); if(i!==-1) char.races[i]=t.value; save(); } return; }
  if(d.crmoveName){ const [gid,mid]=d.crmoveName.split(":"); const g=(customData.extraRacialMoves[char.classId]||[]).find(x=>x.id===gid); const m=g&&g.moves.find(x=>x.id===mid); if(m){ m.name=t.value; save(); } return; }
  if(d.crmoveText){ const [gid,mid]=d.crmoveText.split(":"); const g=(customData.extraRacialMoves[char.classId]||[]).find(x=>x.id===gid); const m=g&&g.moves.find(x=>x.id===mid); if(m){ m.text=t.value; autosize(t); save(); } return; }

  if(d.spellCap){ const s=char.spells[d.spellCap]; if(s){ s.levelCap=parseInt(t.value)||0; save(); } return; }
  if(d.spellName){ const [k,id]=d.spellName.split(":"); const s=spellFind(k,id); if(s){ s.name=t.value; save(); } return; }
  if(d.spellText){ const [k,id]=d.spellText.split(":"); const s=spellFind(k,id); if(s){ s.text=t.value; autosize(t); save(); } return; }
  if(d.bind){
    const v=t.value;
    if(["level","xp","coins","hpCur","armor","hpMax","load"].includes(d.bind)) char[d.bind]=parseInt(v)||0;
    else char[d.bind]=v;
    autosize(t); save(); return;
  }
  if(d.stat!==undefined){
    char.stats[d.stat]=parseInt(t.value)||0;
    const modEl=document.querySelector(`[data-mod="${d.stat}"]`);
    if(modEl) modEl.textContent=fmtMod(effMod(char.stats[d.stat], d.stat));
    save(); return;
  }
  if(d.bond!==undefined){ char.bonds[+d.bond]=t.value; save(); return; }
  if(d.counterName!==undefined){ const c=(char.counters||[])[+d.counterName]; if(c) c.name=t.value; save(); return; }
  if(d.counterVal!==undefined){ const c=(char.counters||[])[+d.counterVal]; if(c) c.value=parseInt(t.value)||0; save(); return; }
  if(d.heritageMove!==undefined){ const h=char.heritage=char.heritage||{boxes:[false,false,false],moves:["","",""],third:false}; h.moves[+d.heritageMove]=t.value; save(); return; }
  if(d.lookcustom!==undefined){

    const list=(cls&&cls.look[i])||[];
    let sel=(char.look[i]||[]).filter(x=>list.includes(x));
    if(t.value.trim()) sel.push(t.value.trim());
    char.look[i]=sel;
    save(); return;
  }
});

  if(d.movebox!==undefined){

    renderPlaybook(); save(); return;
  }
  if(d.delSpellSection!==undefined){ char.manualSpells=(char.manualSpells||[]).filter(x=>x!==d.delSpellSection); renderPlaybook(); save(); return; }
  if(d.addSpell!==undefined){ const [k,g]=d.addSpell.split(":"); const s=char.spells[k]; if(s) s.list.push({id:uid(), group:g, name:"", text:"", available:false}); renderPlaybook(); save(); return; }
  if(d.spellDel!==undefined){ const [k,id]=d.spellDel.split(":"); const s=char.spells[k]; if(s) s.list=s.list.filter(x=>x.id!==id); renderPlaybook(); save(); return; }
  if(d.heritageToggle!==undefined){ const h=char.heritage=char.heritage||{boxes:[false,false,false],moves:["","",""],third:false}; h.hidden=!h.hidden; renderPlaybook(); save(); return; }
});

function toggleAdv(name, checked){
  const cls=getClass(char.classId); const m=classMoves(cls);
  const all=allAdvancedMoves(m);
  const mv=all.find(x=>x.name===name);
  if(!mv) return;
  if(checked){
    if(!char.advancedMoves.includes(name)) char.advancedMoves.push(name);
    repList(mv).forEach(r=>{ char.advancedMoves=char.advancedMoves.filter(n=>n!==r); });
  } else {
    char.advancedMoves=char.advancedMoves.filter(n=>n!==name);
    char.advancedMoves=char.advancedMoves.filter(n=>{ const dep=all.find(x=>x.name===n); return !(dep&&reqList(dep).includes(name)); });
  }
  renderPlaybook(); save();
}
function toggleStarting(name, checked){
  const cls=getClass(char.classId); const m=classMoves(cls);
  const mv=m.starting.find(x=>x.name===name);
  if(!mv) return;
  if(checked){
    if(!char.startingChoices.includes(name)) char.startingChoices.push(name);
    repList(mv).forEach(r=>{ char.startingChoices=char.startingChoices.filter(n=>n!==r); });
  } else {
    char.startingChoices=char.startingChoices.filter(n=>n!==name);
  }
  renderPlaybook(); save();
}

function bind(){
  document.getElementById("btnMode").addEventListener("click", ()=>{
    const ds = refDetailsState();
    mode = mode==="edit" ? "view" : "edit";
    renderPlaybook();
    renderRef();
    restoreRefDetails(ds);
    save();
  });
  document.getElementById("btnNew").addEventListener("click", ()=>{
    if(confirm("确定清空当前角色及所有自定义数据？")){
      char=defaultChar();
      customData={classes:[], extraMoves:{}, extraRacialMoves:{}, extraAlignments:{}};
      renderClassSelect(); renderPlaybook(); save();
    }
  });
  document.getElementById("btnExport").addEventListener("click", exportJSON);
  document.getElementById("btnImport").addEventListener("click", ()=>document.getElementById("fileImport").click());
  document.getElementById("fileImport").addEventListener("change", importJSON);
  document.getElementById("btnImportRules").addEventListener("click", ()=>document.getElementById("fileRules").click());
  document.getElementById("fileRules").addEventListener("change", importRules);
  document.getElementById("btnRulesPanel").addEventListener("click", ()=>{
    document.getElementById("rulesPanel").classList.toggle("hidden");
  });
  document.getElementById("btnClearRules").addEventListener("click", clearRules);
  document.getElementById("btnPrint").addEventListener("click", ()=>{
    const prev=mode; mode="view"; renderPlaybook();
    const restore=()=>{ mode=prev; renderPlaybook(); window.removeEventListener("afterprint",restore); };
    window.addEventListener("afterprint",restore);
    window.print();
  });
}

function exportJSON(){
  const payload={kind:"dw-card-export",version:4,character:char,custom:customData,exportedAt:new Date().toISOString()};
  const text=JSON.stringify(payload,null,2);
  const blob=new Blob([text],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(char.name||"角色")+"-地城世界角色卡.json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result||"");
    let data=null;
    try{ data=JSON.parse(text); }
    catch(err){
      const m=text.match(/window\.DW_CARD\s*=\s*([\s\S]*);\s*$/);
      if(m){ try{ data=JSON.parse(m[1]); }catch(e2){} }
    }
    if(!data){ alert("无法识别的文件：应为 JSON（兼容旧的 window.DW_CARD 格式）。"); return; }
    if(data.kind==="dw-card-export"){
      if(data.character) char=Object.assign(defaultChar(),data.character);
      if(data.custom) customData=data.custom;
      alert("已导入角色与自定义数据。");
    } else if(data.classes||data.extraMoves||data.extraRacialMoves||data.extraAlignments){
      customData={classes:(data.classes||[]).concat(customData.classes||[]),
        extraMoves:Object.assign(customData.extraMoves||{},data.extraMoves||{}),
        extraRacialMoves:Object.assign(customData.extraRacialMoves||{},data.extraRacialMoves||{}),
        extraAlignments:Object.assign(customData.extraAlignments||{},data.extraAlignments||{})};
      alert("已导入自定义数据。");
    } else { alert("无法识别的数据。"); }
    normalizeCustomData();
    ensureSpellData();
    Object.values(customData.extraMoves||{}).forEach(arr=>arr.forEach(m=>{ if(!m.id)m.id=uid(); }));
    Object.values(customData.extraRacialMoves||{}).forEach(arr=>arr.forEach(g=>{ if(!g.id)g.id=uid(); (g.moves||[]).forEach(m=>{ if(!m.id)m.id=uid(); }); }));
    Object.values(customData.extraAlignments||{}).forEach(arr=>arr.forEach(a=>{ if(!a.id)a.id=uid(); }));
    renderClassSelect(); renderPlaybook(); save();
  };
  reader.readAsText(f);
  e.target.value="";
}

function effectiveRules(){
  return ruleStack.reduce((acc, layer) => deepMerge(acc, layer.data), {});
}
function applyEffective(){
  applyData(effectiveRules());
  if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
    renderNoRules();
    save();
    return;
  }
  ensureSpellData();
  renderClassSelect(); renderPlaybook(); renderRef(); save();
}
function checkAffected(after){
  const items = [];
  const cls = (after.classes||[]).find(c=>c.id===char.classId);
  if(!cls){
    if(char.classId) items.push("· 当前职业「"+char.classId+"」");
    return items;
  }
  // 合并「移除后规则」+「自定义数据」，得到移除后仍有效的完整集合，避免误报自定义内容
  const racialGroups = mergeRacialGroups(cls.racialMoves||[], customData.extraRacialMoves[char.classId]||[]);
  const raceNames = racialGroups.filter(g=>g.race).map(g=>g.race);
  const alignNames = (cls.alignment||[]).map(a=>a.name).concat((customData.extraAlignments[char.classId]||[]).map(a=>a.name));
  const moveNames = [];
  (cls.startingMoves||[]).forEach(m=>moveNames.push(m.name));
  for(const t of ADV_TIERS){ (cls.advancedMoves&&cls.advancedMoves[t.key]||[]).forEach(m=>moveNames.push(m.name)); }
  (customData.extraMoves[char.classId]||[]).forEach(m=>moveNames.push(m.name));

  for(const r of (char.races||[])){ if(!raceNames.includes(r)) items.push("· 种族「"+r+"」"); }
  for(const a of (char.alignments||[])){ if(!alignNames.includes(a)) items.push("· 阵营「"+a+"」"); }
  for(const m of (char.advancedMoves||[])){ if(!moveNames.includes(m)) items.push("· 进阶动作「"+m+"」"); }
  for(const m of (char.startingChoices||[])){ if(!moveNames.includes(m)) items.push("· 起始动作「"+m+"」"); }
  return items;
}
function removeRule(index){
  const layer = ruleStack[index];
  if(!layer) return;
  const afterStack = ruleStack.filter((_,i)=>i!==index);
  const after = afterStack.reduce((acc,l)=>deepMerge(acc,l.data), {});
  const affected = checkAffected(after);
  let msg = "确定移除「"+layer.name+"」？";
  if(affected.length) msg = "检测到你角色卡里的以下条目与「"+layer.name+"」有重合：\n\n"+affected.join("\n")+"\n\n移除后对这些条目的影响未知。确定移除？";
  if(!confirm(msg)) return;
  ruleStack = afterStack;
  saveRules();
  applyEffective();
  renderRulesPanel();
}
function clearRules(){
  if(ruleStack.length && !confirm("确定清空整个规则栈（移除全部 "+ruleStack.length+" 层）？")) return;
  ruleStack = [];
  saveRules();
  lsSet("dw-rules", "");   // 同时清掉旧版的单份规则键，避免残留
  applyData(null);
  renderNoRules();
  save();
}
function importRules(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||""));
      if(ruleStack.length === 0 && (!data || !data.classes || !data.classes.length)){
        alert("第一份导入的规则（底层）应包含 classes 数组。"); return;
      }
      ruleStack.push({name: f.name, data});
      saveRules();
      applyEffective();
      renderRulesPanel();
    }catch(err){ alert("规则 JSON 解析失败："+err.message); }
  };
  reader.readAsText(f);
  e.target.value="";
}

function renderRulesPanel(){
  const list = document.getElementById("rulesList");
  if(!list) return;
  if(!ruleStack.length){
    list.innerHTML = '<div class="hint">（空）尚无规则，请点「📥 导入规则」导入底层规则。</div>';
  } else {
    list.innerHTML = ruleStack.map((layer, i) => ({layer, i})).reverse().map(({layer, i}) =>
      `<div class="rule-layer"><span class="rule-layer-name">${esc(layer.name)}</span>${i===0?'<span class="rule-tag">底层</span>':''}<button class="xbtn" data-rule-del="${i}" title="撤销该层">✕</button></div>`
    ).join("");
  }
}

function renderNoRules(){
  renderRefTabs();
  document.getElementById("playbook").innerHTML = '<div class="empty">⚠️ 未加载规则<br><br>请点「📥 导入规则」导入第一份规则 JSON（底层，需包含 classes）。之后可继续导入规则包叠加。</div>';
  const sel = document.getElementById("classSelect");
  if(sel) sel.innerHTML = '<option value="">—— 选择职业 ——</option>';
  const body = document.getElementById("refBody");
  if(body) body.innerHTML = '<div class="ref-empty">未加载规则。</div>';
  renderRulesPanel();
}

      },

      "spells":{"wizard":[{"group":"戏法","name":"光亮术","text":"..."}]}
    }, null, 2);
    load();
    renderClassSelect();

  };

  start();

init();
