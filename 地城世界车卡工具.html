document.addEventListener("click", e=>{
  const t=e.target, d=t.dataset||{};
  if(d.setformula!==undefined){ applyFormula(d.setformula); return; }
  if(d.ruleDel!==undefined){ removeRule(+d.ruleDel); return; }
  if(d.ruleReload!==undefined){ reloadRule(+d.ruleReload); return; }
  if(t.closest("[data-ref-tab]")){ refTab=t.closest("[data-ref-tab]").dataset.refTab; renderRef(); save(); return; }
  if(d.imp!==undefined){ importSearchItem(+d.imp); return; }
  if(d.cond!==undefined){ const n=CONDITION_STATES.length; const cur=char.conditions[d.cond]||0; char.conditions[d.cond]=(cur+1)%n; renderPlaybook(); save(); return; }
  if(d.track!==undefined){
    const [key,idx]=d.track.split(":"); const k=parseInt(idx);
    if(key==="xp"){ char.xp = (k < (char.xp||0)) ? k : (k+1); renderPlaybook(); save(); }
    return;
  }
  if(d.plain && d.plain.startsWith("track:")){
    const [, areaKey, key, idxStr] = d.plain.split(":");
    const idx = parseInt(idxStr);
    const cur = plainGet(areaKey, key, 0);
    plainSet(areaKey, key, (idx < cur) ? idx : (idx + 1));
    renderPlaybook(); save(); return;
  }
  if(d.area!==undefined){
    const parts = d.area.split(":");
    const op = parts[0], areaKey = parts[1], j = parts[3];
    // 选项文本可能含冒号，整段取回
    const i = op === "opt" ? parts.slice(2).join(":") : parts[2];
    const data = char.areaData && char.areaData[areaKey];
    if(!data) return;
    if(op === "opt"){ data.text = (data.text ? data.text + "\n" : "") + i; }
    else if(op === "xadd"){ (data.extra = data.extra || []).push({name:"", value:0}); }
    else if(op === "xdel"){ data.extra.splice(+i, 1); }
    else if(op === "badd"){ data.lines.push(""); }
    else if(op === "bdel"){ data.lines.splice(+i, 1); }
    else if(op === "radd"){ data.relations.push({target:"", description:"", depth:0}); }
    else if(op === "rdel"){ data.relations.splice(+i, 1); }
    else if(op === "rdepth"){ const r = data.relations[+i]; const k = +j; r.depth = (k < (r.depth||0)) ? k : (k+1); }
    else if(op === "hide"){ data.hidden = !data.hidden; }
    else return;
    renderPlaybook(); save(); return;
  }

  // moveList 事件处理
  if(d.movelistAction!==undefined){
    const [areaKey, action, targetGroup] = d.movelistAction.split(":");
    if(action === "addMove"){
      addMoveToMoveList(areaKey, targetGroup || null);
    } else if(action === "addGroup"){
      addGroupToMoveList(areaKey);
    }
    renderPlaybook(); save(); return;
  }
  if(d.movelistDel!==undefined){
    deleteMoveFromMoveList(d.movelistDel);
    renderPlaybook(); save(); return;
  }
  if(d.movelistGroupDel!==undefined){
    const [areaKey, groupKey] = d.movelistGroupDel.split(":");
    deleteGroupFromMoveList(areaKey, groupKey);
    renderPlaybook(); save(); return;
  }
});

// moveList 操作函数
function customGroupStore(areaKey){
  if(!customData.moveListGroups) customData.moveListGroups = {};
  if(!customData.moveListGroups[char.classId]) customData.moveListGroups[char.classId] = {};
  if(!customData.moveListGroups[char.classId][areaKey]) customData.moveListGroups[char.classId][areaKey] = [];
  return customData.moveListGroups[char.classId][areaKey];
}

// 确保 targetGroup 存在：模板里没有、自定义里也没有时，就建一个同 key 的分组
function ensureMoveListGroup(areaKey, groupKey, label){
  if(!groupKey) return null;
  const cls = getClass(char.classId);
  const area = cls ? getAreaHeader(areaKey, cls) : null;
  const inTemplate = ((area && area.groups) || []).some(g => g.key === groupKey);
  if(inTemplate) return groupKey;
  const store = customGroupStore(areaKey);
  if(!store.some(g => g.key === groupKey)) store.push({key:groupKey, label:(label !== undefined ? label : groupKey), moves:[]});
  return groupKey;
}

function addMoveToMoveList(areaKey, targetGroup){
  const groupKey = ensureMoveListGroup(areaKey, targetGroup);
  moveListCustomMoves(areaKey).push({id:uid(), name:"", text:"", group:groupKey || null});
}

function addGroupToMoveList(areaKey){
  customGroupStore(areaKey).push({key:uid(), label:"", moves:[]});
}

function deleteMoveFromMoveList(key){
  const [areaKey, id] = key.split(":");
  const custom = moveListCustomMoves(areaKey);
  const i = custom.findIndex(m => m.id === id);
  if(i === -1) return;
  // 连带清掉它的勾选
  const sel = moveListSelections(areaKey);
  const si = sel.indexOf(moveSelKey(custom[i]));
  if(si !== -1) sel.splice(si, 1);
  custom.splice(i, 1);
}

function deleteGroupFromMoveList(areaKey, groupKey){
  if(!customData.moveListGroups || !customData.moveListGroups[char.classId]) return;
  const groups = customData.moveListGroups[char.classId][areaKey];
  if(!groups) return;
  const i = groups.findIndex(g => g.key === groupKey);
  if(i === -1) return;
  // 连带删掉该分组下的自定义动作，并清理勾选与分组名
  const custom = moveListCustomMoves(areaKey);
  const sel = moveListSelections(areaKey);
  for(let j = custom.length - 1; j >= 0; j--){
    if(custom[j].group !== groupKey) continue;
    const si = sel.indexOf(moveSelKey(custom[j]));
    if(si !== -1) sel.splice(si, 1);
    custom.splice(j, 1);
  }
  (groups[i].moves || []).forEach(m => {
    const si = sel.indexOf(moveSelKey(m));
    if(si !== -1) sel.splice(si, 1);
  });
  groups.splice(i, 1);
  const gi = sel.indexOf(groupKey);
  if(gi !== -1) sel.splice(gi, 1);
  if(char.moveListGroupNames) delete char.moveListGroupNames[`${areaKey}::${groupKey}`];
}

// 获取区域的自定义 groups
function moveListCustomGroups(areaKey){
  if(!customData.moveListGroups) return [];
  if(!customData.moveListGroups[char.classId]) return [];
  return customData.moveListGroups[char.classId][areaKey] || [];
}

function toggleMoveListMove(areaKey, selKey, checked){
  const sel = moveListSelections(areaKey);
  const all = collectMovesInArea(areaKey);
  const move = all.find(m => moveSelKey(m) === selKey);
  if(checked){
    if(!sel.includes(selKey)) sel.push(selKey);
    // 处理 replaces：勾选时移除被替代的动作（按名字找出对应的勾选键）
    if(move) repList(move).forEach(r => {
      all.filter(m => m.name === r).forEach(m => {
        const i = sel.indexOf(moveSelKey(m));
        if(i !== -1) sel.splice(i, 1);
      });
    });
  } else {
    const i = sel.indexOf(selKey);
    if(i !== -1) sel.splice(i, 1);
    // 处理 requires：取消时移除依赖它的动作（requires 按动作名引用）
    const name = move ? move.name : selKey;
    for(let j = sel.length - 1; j >= 0; j--){
      const dep = all.find(m => moveSelKey(m) === sel[j]);
      if(dep && reqList(dep).includes(name)) sel.splice(j, 1);
    }
  }
  renderPlaybook(); save();
}

function toggleMoveListGroup(areaKey, groupKey, checked){
  const sel = moveListSelections(areaKey);
  if(checked){
    if(!sel.includes(groupKey)) sel.push(groupKey);
  } else {
    const i = sel.indexOf(groupKey);
    if(i !== -1) sel.splice(i, 1);
  }
  renderPlaybook(); save();
}

// 编辑动作的名称/正文：自定义动作直接改自身，内置动作写入角色数据的覆盖表
// 自定义动作的勾选以 id 为键，改名不影响勾选
function updateMoveListField(areaKey, idOrName, field, value){
  const mv = moveListCustomMoves(areaKey).find(m => m.id === idOrName);
  if(mv){ mv[field] = value; return; }
  const store = field === "name" ? "moveListNames" : "moveListTexts";
  if(!char[store]) char[store] = {};
  char[store][`${areaKey}::${idOrName}`] = value;
}

function updateMoveListGroupName(areaKey, groupKey, value){
  if(!char.moveListGroupNames) char.moveListGroupNames = {};
  char.moveListGroupNames[`${areaKey}::${groupKey}`] = value;
}


function collectMovesInArea(areaKey){
  const cls = getClass(char.classId);
  const area = getAreaHeader(areaKey, cls);
  if(!area || area.type !== "moveList") return [];
  let all = [];
  (area.groups || []).forEach(g => { all = all.concat(g.moves || []); });
  all = all.concat(area.moves || []);
  all = all.concat(moveListCustomMoves(areaKey));
  return all;
}

// 自定义动作统一存储在 customData.moveListMoves[classId][areaKey]
function moveListCustomMoves(areaKey){
  if(!customData.moveListMoves) customData.moveListMoves = {};
  if(!customData.moveListMoves[char.classId]) customData.moveListMoves[char.classId] = {};
  if(!customData.moveListMoves[char.classId][areaKey]) customData.moveListMoves[char.classId][areaKey] = [];
  return customData.moveListMoves[char.classId][areaKey];
}

function importJSON(e){

  reader.onload=()=>{

      const m=text.match(/window\.DW_CARD\s*=\s*([\s\S]*);\s*$/);

    }
    if(!data){ alert("无法识别的文件：应为 JSON（兼容旧的 window.DW_CARD 格式）。"); return; }
    if(data.kind==="dw-card-export"){

      alert("已导入角色与自定义数据。");
    } else if(data.classes||data.moveListMoves||data.moveListGroups){

        moveListGroups:Object.assign(customData.moveListGroups||{},data.moveListGroups||{})};
      alert("已导入自定义数据。");
    } else { alert("无法识别的数据。"); }

    renderClassSelect(); renderPlaybook(); save();

  e.target.value="";
}

function effectiveRules(){
  return ruleStack.reduce((acc, layer) => deepMerge(acc, layer.data), {});
}
function applyEffective(){
  applyData(effectiveRules());
  if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
    renderNoRules();
    save();
    return;
  }
  renderClassSelect(); renderPlaybook(); renderRef(); save();
}
function checkAffected(after){
  const items = [];
  const cls = (after.classes||[]).find(c=>c.id===char.classId);
  if(!cls){
    if(char.classId) items.push("· 当前职业「"+char.classId+"」");
    return items;
  }
  // 逐个 moveList 区域比对：移除后规则 + 自定义数据里是否还存在该条目
  const areas = (after.meta && after.meta.areas) || {};
  for(const areaKey of Object.keys(char.moveListSelections || {})){
    const sel = char.moveListSelections[areaKey] || [];
    if(!sel.length) continue;
    const base = areas[areaKey];
    const override = (cls.areas && cls.areas[areaKey]) || {};
    const area = deepMerge(base, override);
    const title = area.title || areaKey;
    const label = n => (char.moveListGroupNames && char.moveListGroupNames[`${areaKey}::${n}`]) || n;

    if(!area || area.type !== "moveList"){
      sel.forEach(n => items.push("· "+title+"「"+label(n)+"」"));
      continue;
    }
    // 有效的勾选键：分组用 key，动作用 moveSelKey
    const keys = [];
    (area.groups||[]).forEach(g => { keys.push(g.key); (g.moves||[]).forEach(m => keys.push(moveSelKey(m))); });
    (area.moves||[]).forEach(m => keys.push(moveSelKey(m)));
    moveListCustomGroups(areaKey).forEach(g => keys.push(g.key));
    moveListCustomMoves(areaKey).forEach(m => keys.push(moveSelKey(m)));
    sel.forEach(n => { if(!keys.includes(n)) items.push("· "+title+"「"+label(n)+"」"); });
  }
  return items;
}
function confirmRuleChange(actionName, layerName, newStack){
  const after = newStack.reduce((acc, l) => deepMerge(acc, l.data), {});
  const affected = checkAffected(after);
  let msg = "确定" + actionName + "「" + layerName + "」？";
  if(affected.length) msg = "检测到" + actionName + "后你角色卡里的以下条目可能受影响：\n\n" + affected.join("\n") + "\n\n确定" + actionName + "？";
  return confirm(msg);
}
function removeRule(index){
  const layer = ruleStack[index];
  if(!layer) return;
  const afterStack = ruleStack.filter((_,i)=>i!==index);
  if(!confirmRuleChange("移除", layer.name, afterStack)) return;
  ruleStack = afterStack;
  saveRules();
  applyEffective();
  renderRulesPanel();
}
function reloadRule(index){
  const layer = ruleStack[index];
  if(!layer) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const newData = JSON.parse(String(reader.result||""));
        const tempStack = ruleStack.map((l, i) => i === index ? {name: f.name, data: newData} : l);
        if(!confirmRuleChange("重载", layer.name, tempStack)) return;
        ruleStack[index] = {name: f.name, data: newData};
        saveRules();
        applyEffective();
        renderRulesPanel();
      }catch(err){ alert("规则 JSON 解析失败："+err.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}
function clearRules(){
  if(ruleStack.length && !confirm("确定清空整个规则栈（移除全部 "+ruleStack.length+" 层）？")) return;
  ruleStack = [];
  saveRules();
  lsSet("dw-rules", "");   // 同时清掉旧版的单份规则键，避免残留
  applyData(null);
  renderNoRules();
  save();
}
function importRules(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||""));
      if(ruleStack.length === 0 && (!data || !data.classes || !data.classes.length)){
        alert("第一份导入的规则（底层）应包含 classes 数组。"); return;
      }
      ruleStack.push({name: f.name, data});
      saveRules();
      applyEffective();
      renderRulesPanel();
    }catch(err){ alert("规则 JSON 解析失败："+err.message); }
  };
  reader.readAsText(f);
  e.target.value="";
}

function renderRulesPanel(){
  const list = document.getElementById("rulesList");
  if(!list) return;
  if(!ruleStack.length){
    list.innerHTML = '<div class="hint">（空）尚无规则，请点「📥 导入规则」导入底层规则。</div>';
  } else {
    list.innerHTML = ruleStack.map((layer, i) => ({layer, i})).reverse().map(({layer, i}) =>
      `<div class="rule-layer"><span class="rule-layer-name">${esc(layer.name)}</span>${i===0?'<span class="rule-tag">底层</span>':''}<button class="xbtn" data-rule-reload="${i}" title="重新加载该层">⟳</button><button class="xbtn" data-rule-del="${i}" title="撤销该层">✕</button></div>`
    ).join("");
  }
}

function renderNoRules(){
  document.getElementById("playbook").innerHTML = '<div class="empty">⚠️ 未加载规则<br><br>请点「📥 导入规则」导入第一份规则 JSON（底层，需包含 classes）。之后可继续导入规则包叠加。</div>';
  const sel = document.getElementById("classSelect");
  if(sel) sel.innerHTML = '<option value="">—— 选择职业 ——</option>';
  renderRef();
  renderRulesPanel();
}

function init(){
  const start = () => {
    loadRules();
    applyData(effectiveRules());
    if(!DW_DATA || !DW_DATA.classes || !DW_DATA.classes.length){
      renderNoRules();
      bind();
      return;
    }
    load();
    renderClassSelect();
    renderPlaybook();
    renderRef();
    bind();
    renderRulesPanel();
  };

  start();
}
init();
</script>
</body>
</html>
